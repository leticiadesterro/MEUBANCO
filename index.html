

<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MEUBANCO</title>

<style>

:root{

 --bg:#f5f8fa;--white:#fff;--ink:#293747;

 --muted:#758392;--line:#dfe5e9;

 --blue:#28627c;--light:#e9f2f5;

 --green:#16794b;--red:#b44442;

}

*{box-sizing:border-box}

body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Arial,sans-serif;color:var(--ink)}

button,input,select,textarea{font:inherit}

button{cursor:pointer}

header{background:white;border-bottom:1px solid var(--line);padding:20px 2%;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}

header h1{margin:0;font-size:26px}

header small{color:var(--muted)}

nav{display:flex;gap:5px;flex-wrap:wrap}

nav button{border:0;border-radius:9px;padding:12px;background:transparent;color:var(--muted)}

nav button.active{background:var(--light);color:var(--blue);font-weight:700}

main{padding:30px 2%;max-width:1550px;margin:auto}

h2{font-size:26px;margin:0 0 8px}

h3{margin:0 0 14px}

p{line-height:1.55}

.muted{color:var(--muted)}

.card{background:white;border:1px solid var(--line);border-radius:15px;padding:22px;margin:16px 0}

.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.between{justify-content:space-between}

.btn{background:white;border:1px solid var(--line);border-radius:10px;padding:11px 15px;color:var(--ink);font-weight:600}

.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}

.btn.danger{color:var(--red)}

.btn:disabled{opacity:.4}

input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;background:white;color:var(--ink)}

textarea{min-height:90px;resize:vertical}

label{display:grid;gap:7px;font-size:13px;color:var(--muted);font-weight:600}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.stats{border:1px solid var(--line);padding:16px;border-radius:12px}

.stats strong{font-size:27px;display:block}

.stats span{font-size:13px;color:var(--muted)}

.row{border-bottom:1px solid var(--line);padding:15px 0}

.row:last-child{border:0}

.badge{display:inline-block;background:#f0f3f5;border-radius:20px;padding:5px 9px;font-size:12px;margin:3px}

.good{color:var(--green)}

.bad{color:var(--red)}

.options{display:grid;gap:10px}

.option{border:1px solid var(--line);background:white;border-radius:10px;padding:13px;text-align:left;white-space:pre-wrap;line-height:1.5}

.option.selected{background:var(--light);border-color:var(--blue)}

.option.correct{background:#e5f5ed;border-color:var(--green)}

.option.wrong{background:#fff0ee;border-color:var(--red)}

.question-text{white-space:pre-wrap;line-height:1.7}

.modal-back{position:fixed;inset:0;background:#15263880;z-index:100;display:flex;justify-content:center;align-items:center;padding:12px}

.modal{background:white;width:min(1200px,100%);max-height:94vh;overflow:auto;border-radius:15px;padding:24px}

.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}

.fields{display:grid;gap:14px}

.studybar{display:flex;flex-wrap:wrap;gap:9px;position:sticky;bottom:-24px;background:white;padding:15px 0;border-top:1px solid var(--line);z-index:2}

details{border:1px solid var(--line);border-radius:10px;padding:14px;margin:9px 0;background:white}

details details{background:#fafcfd;margin-left:14px}

summary{cursor:pointer;font-weight:650;line-height:1.5}

.img{max-width:100%;max-height:430px;object-fit:contain;margin:10px 0;border-radius:9px}

.toolbar{display:grid;grid-template-columns:repeat(5,minmax(100px,1fr));gap:10px}

.search{grid-column:span 2}

.note{background:var(--light);border-radius:10px;padding:12px;color:#425f70;font-size:13px}

.hidden{display:none}

@media(max-width:800px){

 header{padding:14px}

 main{padding:16px}

 .split,.two{grid-template-columns:1fr}

 .grid{grid-template-columns:repeat(2,1fr)}

 .toolbar{grid-template-columns:1fr 1fr}

 .modal{padding:15px}

 .studybar{bottom:-15px}

 h2{font-size:22px}

}

</style>

</head>

<body>

<header>

<div>

<h1>MEUBANCO</h1>

<small>Meu banco pessoal de questões</small>

</div>

<nav id="nav"></nav>

</header>

<main id="app"></main>

<div id="modalRoot"></div>

<input id="fileInput" class="hidden" type="file" accept=".zip,.json" multiple>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script>

"use strict";

const $=id=>document.getElementById(id);

const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({

 "&":"&amp;","<":"&lt;",">":"&gt;",

 '"':"&quot;","'":"&#39;"

}[c]));

const clean=x=>String(x??"").trim();

const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2);

const AREAS=[

 "Clínica Médica",

 "Cirurgia Geral",

 "Ginecologia e Obstetrícia",

 "Pediatria",

 "Medicina Preventiva"

];

const MENU=[

 ["inicio","Início"],

 ["provas","Provas"],

 ["questoes","Questões"],

 ["colecoes","Coleções"],

 ["desempenho","Desempenho"],

 ["importar","Importar / Backup"]

];

let DB;

let S={

 tab:"inicio",

 provas:[],

 questoes:[],

 imagens:[],

 colecoes:[],

 atual:null,

 filtro:{prova:"",area:"",tema:"",situacao:"",busca:""},

 desempenhoProva:"",

 selecionadas:new Set()

};

/* BANCO LOCAL — COMPATÍVEL COM VERSÃO ANTERIOR */

function openDB(){

 return new Promise((resolve,reject)=>{

  const r=indexedDB.open("meubanco_v2",1);

  r.onupgradeneeded=()=>{

   const d=r.result;

   ["questoes","provas","colecoes","imagens"].forEach(n=>{

    if(!d.objectStoreNames.contains(n))

     d.createObjectStore(n,{keyPath:"id"});

   });

  };

  r.onsuccess=()=>resolve(r.result);

  r.onerror=()=>reject(r.error);

 });

}

function all(store){

 return new Promise((resolve,reject)=>{

  const r=DB.transaction(store).objectStore(store).getAll();

  r.onsuccess=()=>resolve(r.result);

  r.onerror=()=>reject(r.error);

 });

}

function put(store,obj){

 return new Promise((resolve,reject)=>{

  const t=DB.transaction(store,"readwrite");

  t.objectStore(store).put(obj);

  t.oncomplete=resolve;

  t.onerror=()=>reject(t.error);

 });

}

function del(store,id){

 return new Promise((resolve,reject)=>{

  const t=DB.transaction(store,"readwrite");

  t.objectStore(store).delete(id);

  t.oncomplete=resolve;

  t.onerror=()=>reject(t.error);

 });

}

function wipe(store){

 return new Promise((resolve,reject)=>{

  const t=DB.transaction(store,"readwrite");

  t.objectStore(store).clear();

  t.oncomplete=resolve;

  t.onerror=()=>reject(t.error);

 });

}

async function refresh(){

 [S.provas,S.questoes,S.imagens,S.colecoes]=await Promise.all([

  all("provas"),all("questoes"),all("imagens"),all("colecoes")

 ]);

 render();

}

function proofTitle(p){

 let n=clean(p.nome||"Prova");

 let y=clean(p.ano);

 return y&&!new RegExp("(^|\\D)"+y+"(\\D|$)").test(n)?n+" "+y:n;

}

function qproof(q){

 return S.provas.find(p=>p.id===q.provaId);

}

function qtitle(q){

 return proofTitle(qproof(q)||{nome:q.prova,ano:q.ano})+" — Q"+q.numero;

}

function status(q){

 if(q.situacao==="anulada")return "anulada";

 if(q.minha_resposta&&q.gabarito&&/^[A-E]$/i.test(q.gabarito)){

  return q.minha_resposta.toUpperCase()===q.gabarito.toUpperCase()?"acertei":"errei";

 }

 return ["acertei","errei","nao_fiz"].includes(q.situacao)?q.situacao:"nao_fiz";

}

function metrics(qs){

 let a=qs.filter(q=>status(q)==="acertei").length;

 let e=qs.filter(q=>status(q)==="errei").length;

 let n=qs.filter(q=>status(q)==="nao_fiz").length;

 let x=qs.filter(q=>status(q)==="anulada").length;

 return {total:qs.length,a,e,n,x,pct:a+e?100*a/(a+e):0};

}

function percent(n){return n.toFixed(1).replace(".",",")+"%";}

function summary(qs){

 const m=metrics(qs);

 return `${m.total} questões · ${m.a} acertos · ${m.e} erros · ${m.n} pendentes · ${percent(m.pct)}`;

}

function selectOptions(values,selected,placeholder="Todas"){

 return `<option value="">${esc(placeholder)}</option>`+

 [...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR"))

 .map(v=>`<option value="${esc(v)}" ${v===selected?"selected":""}>${esc(v)}</option>`).join("");

}

function changeTab(t){

 S.tab=t;

 closeModal();

 render();

}

function render(){

 $("nav").innerHTML=MENU.map(([id,label])=>

 `<button class="${S.tab===id?"active":""}" onclick="changeTab('${id}')">${label}</button>`

 ).join("");

 $("app").innerHTML={

  inicio:home,

  provas:provasView,

  questoes:questoesView,

  colecoes:colecoesView,

  desempenho:desempenhoView,

  importar:importarView

 }[S.tab]();

}

function statisticCards(qs){

 const m=metrics(qs);

 return `<div class="grid">

 <div class="stats"><span>Total</span><strong>${m.total}</strong></div>

 <div class="stats"><span>Acertos</span><strong class="good">${m.a}</strong></div>

 <div class="stats"><span>Erros</span><strong class="bad">${m.e}</strong></div>

 <div class="stats"><span>Aproveitamento</span><strong>${percent(m.pct)}</strong></div>

 </div>`;

}

function home(){

 return `<h2>Início</h2><p class="muted">Visão geral do banco.</p>

 ${statisticCards(S.questoes)}

 <div class="card">

 <h3>Resumo</h3>

 <p>${S.provas.length} provas cadastradas.</p>

 <p>${S.questoes.filter(q=>status(q)==="nao_fiz").length} questões ainda não respondidas.</p>

 <div class="flex">

 <button class="btn primary" onclick="changeTab('questoes')">Estudar questões</button>

 <button class="btn" onclick="changeTab('desempenho')">Analisar erros</button>

 </div>

 </div>`;

}

/* PROVAS E EDIÇÃO DE TÍTULO */

function provasView(){

 return `<h2>Provas</h2>

 <p class="muted">Abra uma prova completa ou edite seu título.</p>

 ${S.provas.length?S.provas.map(p=>{

  const qs=S.questoes.filter(q=>q.provaId===p.id);

  return `<div class="card flex between">

  <div>

  <h3>${esc(proofTitle(p))}</h3>

  <span class="muted">${summary(qs)}</span>

  </div>

  <div class="flex">

  <button class="btn primary" onclick="openProof('${p.id}')">Ver prova</button>

  <button class="btn" onclick="renameProof('${p.id}')">Editar título</button>

  <button class="btn" onclick="shareProof('${p.id}')">Compartilhar</button>

  <button class="btn danger" onclick="removeProof('${p.id}')">Excluir</button>

  </div></div>`;

 }).join(""):`<div class="card">Nenhuma prova importada.</div>`}`;

}

function openProof(id){

 S.filtro={prova:id,area:"",tema:"",situacao:"",busca:""};

 changeTab("questoes");

}

async function renameProof(id){

 const p=S.provas.find(x=>x.id===id);

 if(!p)return;

 const name=prompt("Como deseja nomear essa prova?",p.nome);

 if(name===null||!clean(name))return;

 p.nome=clean(name);

 await put("provas",p);

 await refresh();

}

async function removeProof(id){

 if(!confirm("Excluir esta prova e suas questões deste aparelho?"))return;

 for(const q of S.questoes.filter(q=>q.provaId===id))

  await del("questoes",q.id);

 for(const im of S.imagens.filter(i=>i.provaId===id))

  await del("imagens",im.id);

 await del("provas",id);

 await refresh();

}

/* FILTROS E QUESTÕES */

function filtered(){

 const f=S.filtro;

 return S.questoes.filter(q=>{

  return (!f.prova||q.provaId===f.prova)

   &&(!f.area||q.grande_area===f.area)

   &&(!f.tema||q.tema_geral===f.tema)

   &&(!f.situacao||status(q)===f.situacao)

   &&(!f.busca||(q.enunciado+" "+q.tema_geral+" "+q.tema_especifico)

      .toLowerCase().includes(f.busca.toLowerCase()));

 }).sort((a,b)=>{

  const pa=proofTitle(qproof(a)||{nome:a.prova});

  const pb=proofTitle(qproof(b)||{nome:b.prova});

  return pa.localeCompare(pb)||Number(a.numero)-Number(b.numero);

 });

}

function filterChange(key,value){

 S.filtro[key]=value;

 render();

}

function clearFilters(){

 S.filtro={prova:"",area:"",tema:"",situacao:"",busca:""};

 render();

}

function questoesView(){

 const f=S.filtro,qs=filtered();

 return `<h2>Questões</h2>

 <p class="muted">Filtre por prova, área, tema ou desempenho.</p>

 <div class="card">

 <div class="toolbar">

 <label class="search">Buscar<input id="searchInput" value="${esc(f.busca)}" placeholder="Pesquisar questões"></label>

 <label>Prova<select onchange="filterChange('prova',this.value)">

 ${selectOptions(S.provas.map(p=>p.id),f.prova,"Todas as provas").replace(/<option value="([^"]+)">([^<]+)<\/option>/g,(match,id,label)=>{

 const p=S.provas.find(p=>p.id===id);

 return p?`<option value="${esc(id)}">${esc(proofTitle(p))}</option>`:match;

 })}

 </select></label>

 <label>Grande área<select onchange="filterChange('area',this.value)">

 ${selectOptions(AREAS,f.area)}

 </select></label>

 <label>Tema geral<select onchange="filterChange('tema',this.value)">

 ${selectOptions(S.questoes.map(q=>q.tema_geral),f.tema)}

 </select></label>

 <label>Desempenho<select onchange="filterChange('situacao',this.value)">

 <option value="">Todos</option>

 ${["acertei","errei","nao_fiz","anulada"].map(v=>

 `<option ${f.situacao===v?"selected":""} value="${v}">${v}</option>`).join("")}

 </select></label>

 </div>

 <div class="flex" style="margin-top:12px">

 <button class="btn" onclick="S.filtro.busca=$('searchInput').value;render()">Pesquisar</button>

 <button class="btn" onclick="clearFilters()">Limpar filtros</button>

 <span class="muted">${qs.length} questões</span>

 </div>

 </div>

 ${qs.map(q=>`<div class="card">

 <div class="flex between">

 <div>

 <strong>${esc(qtitle(q))}</strong>

 <div class="flex">

 <span class="badge">${esc(q.grande_area)}</span>

 <span class="badge">${esc(q.tema_geral)}</span>

 <span class="badge">${esc(q.tema_especifico)}</span>

 <span class="badge">${esc(status(q))}</span>

 </div>

 </div>

 <button class="btn primary" onclick="openQuestion('${q.id}')">Abrir</button>

 </div>

 <p class="muted">${esc(q.enunciado).slice(0,250)}...</p>

 </div>`).join("")||'<div class="card">Nenhuma questão encontrada.</div>'}`;

}

/* MODAL E NAVEGAÇÃO */

function modal(html){

 $("modalRoot").innerHTML=`<div class="modal-back">

 <div class="modal">${html}</div></div>`;

}

function closeModal(){

 $("modalRoot").innerHTML="";

 S.atual=null;

}

function orderedQuestions(q){

 return S.questoes.filter(x=>x.provaId===q.provaId)

 .sort((a,b)=>Number(a.numero)-Number(b.numero));

}

function adjacent(q,d){

 const list=orderedQuestions(q);

 return list[list.findIndex(x=>x.id===q.id)+d];

}

function imageURL(im){

 if(!im)return "";

 if(im.blob)return URL.createObjectURL(im.blob);

 return "";

}

function questionImages(q){

 return (q.imagens||[]).map(id=>{

  const im=S.imagens.find(x=>x.id===id||x.path===id);

  return im?`<img class="img" src="${imageURL(im)}">`:"";

 }).join("");

}

function openQuestion(id){

 const q=S.questoes.find(x=>x.id===id);

 if(!q)return;

 S.atual=id;

 const prev=adjacent(q,-1),next=adjacent(q,1);

 const opts=q.alternativas||{};

 modal(`<div class="modal-head">

 <h2>${esc(qtitle(q))}</h2>

 <button class="btn" onclick="closeModal()">Fechar ×</button>

 </div>

 <div class="split">

 <section>

 <div class="question-text">${esc(q.enunciado)}</div>

 <div class="options">

 ${Object.entries(opts).map(([letter,value])=>{

  let selected=q.minha_resposta===letter;

  let correct=q.gabarito===letter;

  let cl=selected?"selected":"";

  if(status(q)!=="nao_fiz"&&status(q)!=="anulada"){

   if(correct)cl="correct";

   else if(selected)cl="wrong";

  }

  return `<button class="option ${cl}" onclick="answer('${letter}')">

  <b>${esc(letter)})</b> ${esc(value)}

  </button>`;

 }).join("")}

 </div>

 ${questionImages(q)}

 <div class="note" style="margin-top:12px">

 Gabarito: ${esc(q.gabarito||"Não informado")} ·

 Sua resposta: ${esc(q.minha_resposta||"Não respondida")} ·

 Situação: ${esc(status(q))}

 </div>

 </section>

 <section class="fields">

 <h3>Classificação</h3>

 <label>Grande área

 <select id="qArea">${AREAS.map(a=>`<option ${q.grande_area===a?"selected":""}>${a}</option>`).join("")}</select>

 </label>

 <label>Tema geral

 <input id="qTema" value="${esc(q.tema_geral)}">

 </label>

 <label>Subtema

 <input id="qSub" value="${esc(q.tema_especifico)}">

 </label>

 <label>Desempenho

 <select id="qStatus">

 ${["nao_fiz","acertei","errei","anulada"].map(s=>

 `<option value="${s}" ${status(q)===s?"selected":""}>${s}</option>`).join("")}

 </select>

 </label>

 <label>Minha resposta<input id="qMine" value="${esc(q.minha_resposta)}"></label>

 <label>Gabarito<input id="qGab" value="${esc(q.gabarito)}"></label>

 <label>Anotações

 <textarea id="qNote">${esc(q.comentario)}</textarea>

 </label>

 <div class="note">

 Use subtemas amplos, como "Tumores de pulmão".

 Questões de um mesmo caso podem compartilhar o mesmo subtema.

 </div>

 </section>

 </div>

 <div class="studybar">

 <button class="btn primary" onclick="saveQuestion('next')">Salvar e próxima →</button>

 <button class="btn" onclick="saveQuestion('stay')">Salvar</button>

 <button class="btn" ${prev?"":"disabled"} onclick="navigate(-1)">← Anterior</button>

 <button class="btn" ${next?"":"disabled"} onclick="navigate(1)">Próxima →</button>

 <button class="btn" onclick="copyQuestion()">Copiar para ChatGPT</button>

 </div>`);

}

async function saveQuestion(mode="stay"){

 const q=S.questoes.find(x=>x.id===S.atual);

 if(!q)return;

 const next=adjacent(q,1);

 q.grande_area=$("qArea").value;

 q.tema_geral=clean($("qTema").value);

 q.tema_especifico=clean($("qSub").value);

 q.minha_resposta=clean($("qMine").value).toUpperCase();

 q.gabarito=clean($("qGab").value).toUpperCase();

 q.comentario=$("qNote").value;

 q.situacao=$("qStatus").value;

 if(q.situacao!=="anulada"&&q.minha_resposta&&q.gabarito)

  q.situacao=q.minha_resposta===q.gabarito?"acertei":"errei";

 q.classificacao_aprovada=true;

 await put("questoes",q);

 await refresh();

 if(mode==="next"){

  if(next)openQuestion(next.id);

  else closeModal();

 }else openQuestion(q.id);

}

async function navigate(direction){

 const q=S.questoes.find(x=>x.id===S.atual);

 if(!q)return;

 const next=adjacent(q,direction);

 await saveQuestion("stay");

 if(next)openQuestion(next.id);

}

async function answer(letter){

 const q=S.questoes.find(x=>x.id===S.atual);

 if(!q||status(q)==="anulada")return;

 q.minha_resposta=letter;

 q.situacao=q.gabarito?

 (letter.toUpperCase()===q.gabarito.toUpperCase()?"acertei":"errei"):

 "nao_fiz";

 await put("questoes",q);

 await refresh();

 openQuestion(q.id);

}

function copyQuestion(){

 const q=S.questoes.find(x=>x.id===S.atual);

 if(!q)return;

 const content=q.enunciado+"\n"+

 Object.entries(q.alternativas||{}).map(([l,t])=>l+") "+t).join("\n")+

 "\nMinha resposta: "+q.minha_resposta+

 "\nGabarito: "+q.gabarito+

 "\nRevise integralmente o tema desta questão para residência médica.";

 navigator.clipboard.writeText(content).then(()=>alert("Questão copiada."));

}

/* DESEMPENHO HIERÁRQUICO */

function groupBy(qs,key){

 const obj={};

 qs.forEach(q=>{

  const k=clean(q[key])||"Sem classificação";

  (obj[k]??=[]).push(q);

 });

 return obj;

}

function metricText(qs){

 const m=metrics(qs);

 return `<span class="muted" style="font-size:12px">

 ${m.total} questões ·

 <span class="good">${m.a} acertos</span> ·

 <span class="bad">${m.e} erros</span> ·

 ${percent(m.pct)}

 </span>`;

}

function reportLevel(qs,keys,index=0){

 if(index>=keys.length){

  return `<div style="padding:10px">

  <button class="btn" onclick="showErrors('${qs.map(q=>q.id).join("|")}')">

  Ver apenas erros (${metrics(qs).e})

  </button>

  ${qs.sort((a,b)=>Number(a.numero)-Number(b.numero)).map(q=>`

  <div class="row flex between">

  <div>${esc(qtitle(q))} <span class="badge">${esc(status(q))}</span></div>

  <button class="btn" onclick="openQuestion('${q.id}')">Abrir</button>

  </div>`).join("")}

  </div>`;

 }

 const groups=groupBy(qs,keys[index]);

 return Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0],"pt-BR"))

 .map(([name,list])=>`

 <details>

 <summary>${esc(name)} — ${metricText(list)}</summary>

 ${reportLevel(list,keys,index+1)}

 </details>`).join("");

}

/* IMPORTAÇÃO E EXPORTAÇÃO */

function download(blob,filename){

 const url=URL.createObjectURL(blob);

 const a=document.createElement("a");

 a.href=url;a.download=filename;a.click();

 setTimeout(()=>URL.revokeObjectURL(url),60000);

}

function normalizedProof(p){

 const nome=clean(p.nome||"Prova");

 const ano=p.ano||"";

 const id=clean(p.id)||("prova-"+nome.toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-"+ano);

 return {id,nome,ano,created:p.created||new Date().toISOString()};

}

function normalizedQuestion(q,p){

 return {

  id:q.id||p.id+"-q"+q.numero,

  provaId:p.id,

  prova:p.nome,

  ano:p.ano,

  numero:q.numero,

  enunciado:q.enunciado||"",

  alternativas:q.alternativas||{},

  grande_area:q.grande_area||"",

  tema_geral:q.tema_geral||"",

  tema_especifico:q.tema_especifico||"",

  classificacao_aprovada:!!q.classificacao_aprovada,

  situacao:q.situacao||"nao_fiz",

  gabarito:q.gabarito||"",

  minha_resposta:q.minha_resposta||"",

  comentario:q.comentario||"",

  imagens:q.imagens||[]

 };

}

async function importFile(file){

 let doc,zip=null;

 if(file.name.toLowerCase().endsWith(".zip")){

  if(!window.JSZip)throw Error("Biblioteca ZIP indisponível");

  zip=await JSZip.loadAsync(file);

  const entry=zip.file("manifest.json")||zip.file("backup.json");

  if(!entry)throw Error("ZIP sem manifest.json ou backup.json");

  doc=JSON.parse(await entry.async("string"));

 }else doc=JSON.parse(await file.text());

 if(doc.tipo==="MEUBANCO_BACKUP_V2"||(doc.provas&&doc.questoes)){

  if(confirm("Restaurar dados deste backup? Registros com IDs iguais serão atualizados.")){

   for(const p of doc.provas||[])await put("provas",p);

   for(const q of doc.questoes||[])await put("questoes",q);

   for(const c of doc.colecoes||[])await put("colecoes",c);

   if(zip){

    for(const im of doc.imagens||[]){

     const f=zip.file(im.path);

     if(f)await put("imagens",{...im,blob:await f.async("blob")});

    }

   }

  }

 }else{

  if(!Array.isArray(doc.questoes))throw Error("Manifesto sem questões");

  const p=normalizedProof(doc.prova||{nome:file.name});

  const existing=S.provas.find(x=>x.id===p.id);

  if(existing&&!confirm("Esta prova já está importada. Substituir registros com os mesmos IDs?"))return;

  await put("provas",existing?{...existing,...p}:p);

  for(const original of doc.questoes){

   const q=normalizedQuestion(original,p);

   const old=S.questoes.find(x=>x.id===q.id);

   if(old&&old.minha_resposta&&!q.minha_resposta){

    q.minha_resposta=old.minha_resposta;

    q.situacao=old.situacao;

    q.comentario=old.comentario;

    q.classificacao_aprovada=old.classificacao_aprovada;

    if(old.classificacao_aprovada){

     q.grande_area=old.grande_area;

     q.tema_geral=old.tema_geral;

     q.tema_especifico=old.tema_especifico;

    }

   }

   const imgs=[];

   for(let path of q.imagens){

    if(!zip){imgs.push(path);continue;}

    const f=zip.file(path);

    if(!f)continue;

    const id=p.id+"::"+path;

    await put("imagens",{id,provaId:p.id,path,blob:await f.async("blob")});

    imgs.push(id);

   }

   q.imagens=imgs;

   await put("questoes",q);

  }

 }

 await refresh();

 alert("Importação concluída.");

}

$("fileInput").addEventListener("change",async e=>{

 const files=[...e.target.files];

 e.target.value="";

 for(const file of files){

  try{await importFile(file)}

  catch(err){alert("Erro na importação: "+err.message)}

 }

});

async function exportBackup(){

 if(!window.JSZip)return alert("Biblioteca ZIP indisponível.");

 const zip=new JSZip();

 const images=[];

 for(const im of S.imagens){

  if(!im.blob)continue;

  const path="imagens/"+im.id.replace(/[^a-z0-9_-]/gi,"_")+".png";

  zip.file(path,im.blob);

  images.push({id:im.id,provaId:im.provaId,path,original:im.path});

 }

 zip.file("backup.json",JSON.stringify({

  tipo:"MEUBANCO_BACKUP_V2",

  versao:2,

  provas:S.provas,

  questoes:S.questoes,

  colecoes:S.colecoes,

  imagens:images

 },null,2));

 download(await zip.generateAsync({type:"blob",compression:"DEFLATE"}),"MEUBANCO-BACKUP.zip");

}

async function shareProof(id=""){

 if(!window.JSZip)return alert("Biblioteca ZIP indisponível.");

 const provas=id?S.provas.filter(p=>p.id===id):S.provas;

 if(!provas.length)return alert("Nenhuma prova disponível.");

 const zip=new JSZip();

 for(const p of provas){

  const folder=id?"":p.id.replace(/[^a-z0-9_-]/gi,"_")+"/";

  const qs=S.questoes.filter(q=>q.provaId===p.id);

  const output=[];

  for(const q of qs){

   const images=[];

   for(const imageId of q.imagens||[]){

    const im=S.imagens.find(x=>x.id===imageId);

    if(!im||!im.blob)continue;

    const ext=(im.path||"imagem.png").split(".").pop().toLowerCase();

    const safeExt=/^(png|jpg|jpeg|gif|webp)$/.test(ext)?ext:"png";

    const path="imagens/"+imageId.replace(/[^a-z0-9_-]/gi,"_")+"."+safeExt;

    zip.file(folder+path,im.blob);

    images.push(path);

   }

   output.push({

    id:q.id,

    numero:q.numero,

    enunciado:q.enunciado,

    alternativas:q.alternativas,

    grande_area:q.grande_area,

    tema_geral:q.tema_geral,

    tema_especifico:q.tema_especifico,

    classificacao_aprovada:false,

    situacao:q.situacao==="anulada"?"anulada":"nao_fiz",

    gabarito:q.gabarito||"",

    minha_resposta:"",

    comentario:"",

    imagens:images

   });

  }

  zip.file(folder+"manifest.json",JSON.stringify({

   versao:3,

   prova:{id:p.id,nome:p.nome,ano:p.ano},

   questoes:output

  },null,2));

 }

 const blob=await zip.generateAsync({type:"blob",compression:"DEFLATE"});

 download(blob,id?"MEUBANCO-COMPARTILHAR-PROVA.zip":"MEUBANCO-COMPARTILHAR-TODAS.zip");

}
