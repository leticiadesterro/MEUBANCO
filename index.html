
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEUBANCO</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{--bg:#f5f7f9;--ink:#253343;--muted:#778596;--line:#e0e6ec;--blue:#285f79;--light:#eaf3f7;--red:#b54848;--green:#207a57}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
header{background:#fff;border-bottom:1px solid var(--line);padding:17px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{font-weight:800;letter-spacing:.04em;font-size:21px}
.logo small{display:block;color:var(--muted);font-size:11px;font-weight:400}
nav{display:flex;gap:5px;overflow:auto}
nav button{border:0;background:none;color:var(--muted);padding:10px;border-radius:8px;white-space:nowrap;font-size:13px}
nav button.active{background:var(--light);color:var(--blue);font-weight:700}
main{max-width:1250px;margin:auto;padding:25px 18px 80px}
h1{font-size:26px;margin:0 0 4px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:0}
p{line-height:1.6}
.sub,.muted{color:var(--muted)}
.sub{font-size:13px;margin-bottom:22px}
.small{font-size:12px;color:var(--muted)}
.card,.metric{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.metric strong{font-size:28px;display:block;margin:3px 0}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:10px 13px;font-size:13px;font-weight:650}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.danger{color:var(--red)}
label{font-size:12px;color:var(--muted);display:block;font-weight:650;margin-bottom:6px}
input:not([type=checkbox]),select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:95px}
.field{margin-bottom:13px}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.item{padding:15px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.preview{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;padding:4px 9px;background:#eff2f5;border-radius:20px;font-size:11px;margin:3px}
.tag.good{color:var(--green);background:#e7f5ed}
.tag.bad{color:var(--red);background:#ffeded}
.tag.warn{color:#8a621a;background:#fff3d9}
.check{width:20px;height:20px;accent-color:var(--blue)}
.modal-bg{position:fixed;inset:0;z-index:10;background:#1926348c;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:white;border-radius:16px;padding:20px;width:min(100%,1120px);max-height:94dvh;overflow:auto}
.modal-head{position:sticky;top:-20px;background:white;z-index:2;padding:5px 0 12px;border-bottom:1px solid var(--line);margin-bottom:15px}
.modal-foot{position:sticky;bottom:-20px;z-index:2;background:white;padding:14px 0 5px;border-top:1px solid var(--line);margin-top:10px}
.question{white-space:pre-wrap;line-height:1.75}
.alternative{padding:12px;margin:8px 0;border:1px solid var(--line);border-radius:10px;white-space:pre-wrap}
.qimage{display:block;max-width:100%;max-height:430px;object-fit:contain;border-radius:10px;margin:12px 0}
.notice{background:var(--light);color:#416478;border-radius:10px;padding:12px;font-size:13px}
.empty{text-align:center;padding:38px 10px;color:var(--muted)}
.chartrow{display:grid;grid-template-columns:minmax(100px,1fr) minmax(70px,2fr) 65px;gap:10px;align-items:center;margin:13px 0;font-size:12px}
.bar{height:11px;border-radius:12px;background:#edf1f4;overflow:hidden}
.fill{height:100%;background:#438ca5}
.section-space{margin-top:20px}
.subchoices{display:flex;flex-wrap:wrap;gap:7px;max-height:210px;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:10px}
.subchoice{padding:7px 10px;border:1px solid var(--line);border-radius:20px;font-size:12px;background:#fff;display:flex;align-items:center;gap:6px}
.subchoice input{accent-color:var(--blue)}
.text-btn{background:none;color:var(--blue);border:0;padding:3px;text-decoration:underline}
@media(max-width:850px){header{display:block;padding:14px}nav{margin-top:10px}.filters,.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.modal{padding:14px}.modal-head{top:-14px}.modal-foot{bottom:-14px}}
@media(max-width:550px){main{padding:16px 12px}.grid,.two,.filters{grid-template-columns:1fr}.modal{max-height:97dvh}.modal-bg{padding:5px}.chartrow{grid-template-columns:100px 1fr 55px}}
</style>
</head>
<body>
<header><div class="logo">MEUBANCO<small>Banco pessoal de questões</small></div><nav id="nav"></nav></header>
<main id="app"></main>
<div id="modalRoot"></div>
<input id="importFile" type="file" accept=".zip,.json" multiple hidden>
<script>
"use strict";

const $=id=>document.getElementById(id);
const clean=v=>String(v??"").trim();
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const enc=v=>encodeURIComponent(String(v));
const dec=v=>decodeURIComponent(v);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2);

const areas=["Clínica Médica","Cirurgia Geral","Ginecologia e Obstetrícia","Pediatria","Medicina Preventiva","Outras"];
const tabs=[["inicio","Início"],["provas","Provas"],["questoes","Questões"],["colecoes","Coleções"],["desempenho","Desempenho"],["backup","Importar nova prova / Backup"]];
const statuses=["acertei","errei","nao_fiz","anulada","a_conferir"];

let db,provas=[],questoes=[],colecoes=[],imagens=[];
let tela="inicio",aberta=null,navIds=[],imageUrls=[];
let selecionadas=new Set();
let filtro={prova:"",area:"",tema:"",subs:[],status:"",busca:""};
let relatorio={provas:[],area:"",tema:"",subs:[],detail:"",visao:"macro"};

function avisar(s){alert(s)}
function abrirDB(){
return new Promise((ok,err)=>{
let r=indexedDB.open("MEUBANCO_V3",1);
r.onupgradeneeded=()=>{
for(let t of ["provas","questoes","colecoes","imagens"])
if(!r.result.objectStoreNames.contains(t))
r.result.createObjectStore(t,{keyPath:"id"});
};
r.onsuccess=()=>ok(r.result);
r.onerror=()=>err(r.error);
});
}
function getAll(t){
return new Promise((ok,err)=>{
let r=db.transaction(t).objectStore(t).getAll();
r.onsuccess=()=>ok(r.result);
r.onerror=()=>err(r.error);
});
}
function put(t,v){
return new Promise((ok,err)=>{
let r=db.transaction(t,"readwrite");
r.objectStore(t).put(v);
r.oncomplete=ok;
r.onerror=()=>err(r.error);
});
}
function del(t,id){
return new Promise((ok,err)=>{
let r=db.transaction(t,"readwrite");
r.objectStore(t).delete(id);
r.oncomplete=ok;
r.onerror=()=>err(r.error);
});
}
function clear(t){
return new Promise((ok,err)=>{
let r=db.transaction(t,"readwrite");
r.objectStore(t).clear();
r.oncomplete=ok;
r.onerror=()=>err(r.error);
});
}
async function reload(draw=true){
[provas,questoes,colecoes,imagens]=await Promise.all(["provas","questoes","colecoes","imagens"].map(getAll));
if(draw)render();
}
function go(t){tela=t;selecionadas.clear();render();window.scrollTo(0,0)}
function header(t,s){return `<h1>${esc(t)}</h1><div class="sub">${esc(s)}</div>`}
function proof(q){return provas.find(x=>x.id===q.provaId)}
function proofName(p){return p?`${p.nome}${String(p.nome).includes(String(p.ano))||!p.ano?"":" "+p.ano}`:"Prova"}
function titleQ(q){return `${proofName(proof(q))} — Q${q.numero}`}
function labelStatus(st){return ({acertei:"Acertei",errei:"Errei",nao_fiz:"Não fiz",anulada:"Anulada",a_conferir:"A conferir"})[st]||"A conferir"}
function tag(q){
let s=q.situacao;
return `<span class="tag ${s==="acertei"?"good":s==="errei"?"bad":s==="anulada"||s==="a_conferir"?"warn":""}">${labelStatus(s)}</span>`;
}
function perf(list){
let feitas=list.filter(x=>x.situacao==="acertei"||x.situacao==="errei");
let a=feitas.filter(x=>x.situacao==="acertei").length;
return {total:list.length,feitas:feitas.length,acertos:a,erros:feitas.length-a,nao:list.filter(x=>x.situacao==="nao_fiz").length,anuladas:list.filter(x=>x.situacao==="anulada").length,pendentes:list.filter(x=>x.situacao==="a_conferir").length,indice:feitas.length?a/feitas.length*100:null};
}
function pct(n){return n===null?"—":n.toFixed(1).replace(".",",")+"%"}
function metrics(s){
return `<div class="grid">
<div class="metric"><span class="small">QUESTÕES NO BANCO</span><strong>${s.total}</strong></div>
<div class="metric"><span class="small">QUESTÕES FEITAS</span><strong>${s.feitas}</strong></div>
<div class="metric"><span class="small">ACERTOS / ERROS</span><strong>${s.acertos} / ${s.erros}</strong></div>
<div class="metric"><span class="small">ÍNDICE DE ACERTOS</span><strong>${pct(s.indice)}</strong></div>
</div>`;
}
function render(){
$("nav").innerHTML=tabs.map(([k,v])=>`<button class="${tela===k?"active":""}" onclick="go('${k}')">${v}</button>`).join("");
$("app").innerHTML=({inicio:home,provas:pageProvas,questoes:pageQuestions,colecoes:pageCollections,desempenho:pagePerformance,backup:pageBackup})[tela]();
}
function home(){
return header("Minha biblioteca","Suas provas, temas e coleções em um só lugar.")+metrics(perf(questoes))+`
<div class="two section-space">
<section class="card"><h2>Provas importadas</h2>
${provas.length?provas.map(p=>`<div class="item row between"><div><b>${esc(proofName(p))}</b><div class="small">${questoes.filter(q=>q.provaId===p.id).length} questões</div></div><button class="btn" onclick="openProof('${enc(p.id)}')">Abrir</button></div>`).join(""):'<p class="muted">Nenhuma prova cadastrada.</p>'}
</section>
<section class="card"><h2>Acesso rápido</h2><p>Importe provas em ZIP, confira temas sugeridos e selecione questões semelhantes para estudar.</p><div class="row"><button class="btn primary" onclick="go('backup')">Importar nova prova</button><button class="btn" onclick="go('questoes')">Buscar questões</button></div></section>
</div>`;
}
function pageProvas(){
return header("Provas","Abra todas as questões de uma prova na ordem original.")+`<div class="card">${provas.map(p=>{
let s=perf(questoes.filter(q=>q.provaId===p.id));
return `<div class="item row between"><div><h3>${esc(proofName(p))}</h3><div class="small">${s.total} questões · ${s.feitas} feitas · ${pct(s.indice)} de acertos</div></div><div class="row"><button class="btn" onclick="openProof('${enc(p.id)}')">Abrir prova</button><button class="btn danger" onclick="deleteProof('${enc(p.id)}')">Excluir</button></div></div>`;
}).join("")||'<div class="empty">Nenhuma prova importada.</div>'}</div>`;
}
function openProof(e){
filtro={prova:dec(e),area:"",tema:"",subs:[],status:"",busca:""};
go("questoes");
}
function options(arr,selected,base="Todos"){
return `<option value="">${esc(base)}</option>`+[...new Set(arr.filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR")).map(x=>`<option value="${esc(x)}" ${selected===x?"selected":""}>${esc(x)}</option>`).join("");
}

/* FILTROS DE QUESTÕES */

function filtered(){
return questoes.filter(q=>{
const hay=[q.enunciado,q.tema_geral,q.tema_especifico,q.descricao_detalhada,...Object.values(q.alternativas||{})].join(" ").toLocaleLowerCase("pt-BR");
return (!filtro.prova||q.provaId===filtro.prova)&&(!filtro.area||q.grande_area===filtro.area)&&(!filtro.tema||q.tema_geral===filtro.tema)&&(!filtro.subs.length||filtro.subs.includes(q.tema_especifico))&&(!filtro.status||q.situacao===filtro.status)&&(!filtro.busca||hay.includes(filtro.busca.toLocaleLowerCase("pt-BR")));
}).sort((a,b)=>proofName(proof(a)).localeCompare(proofName(proof(b)),"pt-BR")||Number(a.numero)-Number(b.numero));
}
function setFilter(k,v){
filtro[k]=v;
if(k==="area"||k==="tema")filtro.subs=[];
if(k==="area")filtro.tema="";
render();
}
function clearFilters(){
filtro={prova:"",area:"",tema:"",subs:[],status:"",busca:""};
render();
}
function toggleSub(e,checked){
let v=dec(e);
filtro.subs=checked?[...new Set([...filtro.subs,v])]:filtro.subs.filter(s=>s!==v);
render();
}
function selectQ(e,on){
let id=dec(e);
on?selecionadas.add(id):selecionadas.delete(id);
render();
}
function selectResults(){filtered().forEach(q=>selecionadas.add(q.id));render()}
function lineQ(q){
return `<div class="item">
<div class="row between">
<div class="row">
<input aria-label="Selecionar questão" class="check" type="checkbox" ${selecionadas.has(q.id)?"checked":""} onchange="selectQ('${enc(q.id)}',this.checked)">
<div>
<h3>${esc(titleQ(q))}</h3>
<span class="tag">${esc(q.grande_area||"Sem área")}</span>
<span class="tag">${esc(q.tema_geral||"Sem tema")}</span>
${q.tema_especifico?`<span class="tag">${esc(q.tema_especifico)}</span>`:""}
${tag(q)}
${q.classificacao_aprovada?"":'<span class="tag warn">Tema sugerido</span>'}
</div></div>
<button class="btn" onclick="openQ('${enc(q.id)}')">Abrir</button>
</div>
<p class="preview">${esc(q.enunciado)}</p>
${q.descricao_detalhada?`<div class="small">Detalhamento: ${esc(q.descricao_detalhada)}</div>`:""}
</div>`;
}
function pageQuestions(){
let list=filtered();
let themes=questoes.filter(q=>!filtro.area||q.grande_area===filtro.area).map(x=>x.tema_geral);
let subs=[...new Set(questoes.filter(q=>(!filtro.prova||q.provaId===filtro.prova)&&(!filtro.area||q.grande_area===filtro.area)&&(!filtro.tema||q.tema_geral===filtro.tema)).map(q=>q.tema_especifico).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
return header("Banco de questões","Marque vários subtemas para reunir questões de assuntos semelhantes.")+`
<div class="card">
<div class="filters">
<div><label>Prova</label><select onchange="setFilter('prova',this.value)"><option value="">Todas as provas</option>${provas.map(p=>`<option value="${esc(p.id)}" ${filtro.prova===p.id?"selected":""}>${esc(proofName(p))}</option>`).join("")}</select></div>
<div><label>Grande área</label><select onchange="setFilter('area',this.value)">${options([...areas,...questoes.map(q=>q.grande_area)],filtro.area)}</select></div>
<div><label>Tema geral</label><select onchange="setFilter('tema',this.value)">${options(themes,filtro.tema)}</select></div>
<div><label>Desempenho</label><select onchange="setFilter('status',this.value)"><option value="">Todos</option>${statuses.map(v=>`<option value="${v}" ${filtro.status===v?"selected":""}>${labelStatus(v)}</option>`).join("")}</select></div>
<div><label>Pesquisar texto ou descrição detalhada</label><input value="${esc(filtro.busca)}" placeholder="Palavra-chave" onchange="setFilter('busca',this.value)"></div>
</div>
<div class="field"><label>Subtemas (marque quantos quiser; sem seleção = todos)</label>
<div class="subchoices">${subs.map(v=>`<label class="subchoice"><input type="checkbox" ${filtro.subs.includes(v)?"checked":""} onchange="toggleSub('${enc(v)}',this.checked)">${esc(v)}</label>`).join("")||'<span class="small">Nenhum subtema cadastrado</span>'}</div></div>
<div class="row between"><span class="small">${list.length} questões encontradas · ${filtro.subs.length} subtemas selecionados</span><div class="row"><button class="btn" onclick="clearFilters()">Limpar filtros</button><button class="btn" onclick="selectResults()">Selecionar resultados</button></div></div>
</div>
<div class="card">
<div class="row between"><b>${selecionadas.size} selecionadas</b><div class="row"><button class="btn" ${selecionadas.size?"":"disabled"} onclick="batchModal()">Classificar em lote</button><button class="btn" ${selecionadas.size?"":"disabled"} onclick="makeCollection()">Criar coleção</button><button class="btn primary" ${selecionadas.size?"":"disabled"} onclick="copySelected()">Copiar para ChatGPT</button></div></div>
${list.map(lineQ).join("")||'<div class="empty">Nenhuma questão encontrada.</div>'}
</div>`;
}

/* RESULTADO AUTOMÁTICO */

function choice(v){
const x=clean(v).toUpperCase();
return /^[A-E]$/.test(x)?x:"";
}
function isAnnulled(v){
return /\bANULAD[AO]\b/i.test(clean(v));
}
function inferredStatus(answer,key,emptyStatus="a_conferir"){
if(isAnnulled(key))return "anulada";
const a=choice(answer),g=choice(key);
if(a&&g)return a===g?"acertei":"errei";
return !a&&emptyStatus==="nao_fiz"?"nao_fiz":"a_conferir";
}
function updateComputedStatus(){
const a=$("edMinha"),g=$("edGab"),m=$("edManual"),result=$("computedResult");
if(!a||!g||!result)return;
const status=inferredStatus(a.value,g.value);
result.textContent="Resultado calculado: "+labelStatus(status)+(m&&m.value!=="automatico"?" (substituído manualmente)":"");
}

/* EDITOR */

function revokeImages(){imageUrls.forEach(URL.revokeObjectURL);imageUrls=[]}
function showModal(html){
$("modalRoot").innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal(){
revokeImages();
$("modalRoot").innerHTML="";
aberta=null;
}
function photoURL(blob){
let url=URL.createObjectURL(blob);
imageUrls.push(url);
return url;
}
function openQ(e,keepNav=false){
let id=dec(e);
let q=questoes.find(x=>x.id===id);
if(!q)return;
if(!keepNav)navIds=filtered().map(x=>x.id);
if(!navIds.includes(id))navIds=[id];
aberta=id;
let pos=navIds.indexOf(id);
revokeImages();

let alts=Object.entries(q.alternativas||{}).map(([a,t])=>`<div class="alternative"><b>${esc(a)})</b> ${esc(t)}</div>`).join("");
let photos=(q.imagens||[]).map(id=>{
let im=imagens.find(x=>x.id===id);
return im?`<img class="qimage" alt="Figura da questão" src="${photoURL(im.blob)}">`:"";
}).join("");

let areaOptions=options([...areas,...questoes.map(x=>x.grande_area)],q.grande_area,"Selecionar área");

showModal(`
<div class="modal-head row between">
<div><h2 style="margin:0">${esc(titleQ(q))}</h2><span class="small">Questão ${pos+1} de ${navIds.length} nesta seleção</span></div>
<button class="btn" onclick="closeModal()">Fechar ×</button>
</div>
<div class="two">
<div>
<div class="question">${esc(q.enunciado)}</div>
${alts}
${photos}
<div class="notice" style="margin-top:14px">Gabarito: <b>${esc(q.gabarito||"Não informado")}</b> · Sua resposta: <b>${esc(q.minha_resposta||"Não informada")}</b></div>
</div>
<div class="card">
<h2>Classificação e desempenho</h2>
<div class="field"><label>Grande área</label><select id="edArea">${areaOptions}</select></div>
<div class="field"><label>Tema geral (amplo)</label><input id="edTema" list="temaList" value="${esc(q.tema_geral)}" placeholder="Ex.: Endocrinologia"><datalist id="temaList">${[...new Set(questoes.map(x=>x.tema_geral).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join("")}</datalist></div>
<div class="field"><label>Subtema (amplo, por extenso)</label><input id="edSub" list="subList" value="${esc(q.tema_especifico)}" placeholder="Ex.: Anemias hemolíticas"><datalist id="subList">${[...new Set(questoes.map(x=>x.tema_especifico).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join("")}</datalist></div>
<div class="field"><label>Descrição detalhada (opcional)</label><input id="edDetail" value="${esc(q.descricao_detalhada||"")}" placeholder="Ex.: Anemia falciforme"></div>

<div class="field">
<label>Resultado calculado automaticamente</label>
<div class="notice" id="computedResult">Resultado calculado: ${labelStatus(inferredStatus(q.minha_resposta,q.gabarito,q.situacao))}</div>
</div>

<div class="field">
<label>Correção manual (somente se necessário)</label>
<select id="edManual" onchange="updateComputedStatus()">
<option value="automatico" ${!q.situacao_manual?"selected":""}>Automático</option>
${statuses.map(s=>`<option value="${s}" ${q.situacao_manual&&q.situacao===s?"selected":""}>${labelStatus(s)}</option>`).join("")}
</select>
</div>

<div class="two">
<div class="field"><label>Minha resposta</label><input id="edMinha" value="${esc(q.minha_resposta)}" oninput="updateComputedStatus()"></div>
<div class="field"><label>Gabarito</label><input id="edGab" value="${esc(q.gabarito)}" oninput="updateComputedStatus()"></div>
</div>

<div class="field">
<label>Imagens necessárias (desmarque capturas repetidas do texto)</label>
<div class="subchoices">

async function saveQ(move){
let q=questoes.find(x=>x.id===aberta);
if(!q)return;
const id=q.id;
const a=clean($("edMinha").value);
const g=clean($("edGab").value);
const manual=$("edManual").value;
const keep=[...document.querySelectorAll(".keepImage:checked")].map(el=>el.value);
q={...q,
grande_area:$("edArea").value,
tema_geral:clean($("edTema").value),
tema_especifico:clean($("edSub").value),
descricao_detalhada:clean($("edDetail").value),
situacao:manual==="automatico"?inferredStatus(a,g,q.situacao):manual,
situacao_manual:manual!=="automatico",
minha_resposta:a,
gabarito:g,
comentario:$("edNotas").value,
imagens:keep,
classificacao_aprovada:true
};
await put("questoes",q);
await reload(false);
render();
const next=navIds[navIds.indexOf(id)+move];
openQ(enc(move&&next?next:id),true);
}

/* DESEMPENHO MACRO E MICRO */

function groups(list,field){
let m=new Map();
for(let q of list){
let k=q[field]||"Sem classificação";
if(!m.has(k))m.set(k,[]);
m.get(k).push(q);
}
return [...m].map(([nome,l])=>({nome,...perf(l)})).sort((a,b)=>b.feitas-a.feitas||a.nome.localeCompare(b.nome));
}
function reportList(){
return questoes.filter(q=>
(!relatorio.provas.length||relatorio.provas.includes(q.provaId))&&
(!relatorio.area||q.grande_area===relatorio.area)&&
(!relatorio.tema||q.tema_geral===relatorio.tema)&&
(!relatorio.subs.length||relatorio.subs.includes(q.tema_especifico))&&
(!relatorio.detail||q.descricao_detalhada===relatorio.detail)
);
}
function reportChange(k,v){
relatorio[k]=v;
if(k==="area"){relatorio.tema="";relatorio.subs=[];relatorio.detail=""}
if(k==="tema"){relatorio.subs=[];relatorio.detail=""}
render();
}
function reportToggle(k,value,on){
value=dec(value);
relatorio[k]=on?[...new Set([...relatorio[k],value])]:relatorio[k].filter(x=>x!==value);
if(k==="subs")relatorio.detail="";
render();
}
function reportReset(){
relatorio={provas:[],area:"",tema:"",subs:[],detail:"",visao:"macro"};
render();
}
function reportDetail(field,value,errors=false){
value=dec(value);
let list=reportList().filter(q=>(!field||(q[field]||"Sem classificação")===value)&&(!errors||q.situacao==="errei"));

function download(blob,name){
let url=URL.createObjectURL(blob),a=document.createElement("a");
a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function exportCSV(){
let list=reportList();
let rows=[["Nível","Assunto","Total","Feitas","Acertos","Erros","Não fiz","Anuladas","A conferir","Índice"]];
for(let [field,label] of [["grande_area","Grande área"],["tema_geral","Tema geral"],["tema_especifico","Subtema"],["descricao_detalhada","Descrição detalhada"]])
for(let g of groups(list,field))
rows.push([label,g.nome,g.total,g.feitas,g.acertos,g.erros,g.nao,g.anuladas,g.pendentes,pct(g.indice)]);
let csv="\ufeff"+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(";")).join("\n");
download(new Blob([csv],{type:"text/csv;charset=utf-8"}),"MEUBANCO-RELATORIO.csv");
}

/* BACKUP E COMPARTILHAMENTO */

async function exportShare(){
if(typeof JSZip==="undefined")return avisar("Biblioteca ZIP indisponível.");
const zip=new JSZip(),meta=[];
for(const im of imagens){
let ext=(im.caminho||"imagem.png").split(".").pop().toLowerCase();
if(!/^(jpg|jpeg|png|webp|gif|svg)$/.test(ext))ext="png";
const path="imagens/"+im.id.replace(/[^\w-]/g,"_")+"."+ext;
zip.file(path,im.blob);
meta.push({id:im.id,provaId:im.provaId,caminho:im.caminho,arquivo:path});
}
const publicQs=questoes.map(q=>({...q,minha_resposta:"",situacao:"a_conferir",situacao_manual:false,comentario:"",classificacao_aprovada:false}));
zip.file("backup.json",JSON.stringify({tipo:"MEUBANCO_BACKUP_V3",versao:3,provas,questoes:publicQs,colecoes:[],imagens:meta,criado:new Date().toISOString()},null,2));
download(await zip.generateAsync({type:"blob",compression:"DEFLATE"}),"MEUBANCO-PARA-COMPARTILHAR.zip");
}

/* IMPORTAÇÃO INTELIGENTE */

function normalizedProof(p){
let nome=clean(p.nome||p.prova||"Prova"),ano=p.ano||"";
return {id:clean(p.id)||"prova-"+nome.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-")+"-"+ano,nome,ano};
}
function broadSub(v){
let s=clean(v),k=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
if(!k)return "";
if(/diabetes|\bdm\b/.test(k))return "Diabetes mellitus";
if(/hipertensao arterial|\bhas\b/.test(k))return "Hipertensão arterial";
if(/trauma esplenico/.test(k))return "Trauma esplênico";
if(/anemia.*hemolitic/.test(k))return "Anemias hemolíticas";
if(/\banemia/.test(k))return "Anemias";
if(/cuidados perioperatorios/.test(k))return "Cuidados perioperatórios";
if(/anatomia pelvica|vascularizacao pelvica|nervo pudendo|pelvimetria/.test(k))return "Anatomia pélvica";
if(/endocardite/.test(k))return "Endocardite infecciosa";
return s;
}
function normalizedQ(q,p){
const raw=clean(q.tema_especifico||q.subtema),broad=broadSub(raw);
let detail=clean(q.descricao_detalhada||q.detalhamento);
if(!detail&&raw&&broad!==raw)detail=raw;
let answer=clean(q.minha_resposta),key=clean(q.gabarito);
if(q.anulada===true||isAnnulled(q.situacao))key="ANULADA";
const pre=clean(q.situacao).toLowerCase();
const status=inferredStatus(answer,key,pre==="nao_fiz"?"nao_fiz":"a_conferir");
return {
id:clean(q.id)||p.id+"-q"+(q.numero||q.questao),
provaId:p.id,
numero:q.numero||q.questao||0,
enunciado:String(q.enunciado||q.texto||""),
alternativas:q.alternativas||{},
grande_area:clean(q.grande_area||q.area),
tema_geral:clean(q.tema_geral||q.tema),
tema_especifico:broad,
descricao_detalhada:detail,
classificacao_aprovada:!!q.classificacao_aprovada,
situacao:status,
situacao_manual:false,
gabarito:key,
minha_resposta:answer,
comentario:"",
imagens:Array.isArray(q.imagens)?q.imagens:[]
};
}
async function importRecords(ps,qs,imgs){
let duplicates=qs.filter(q=>questoes.some(x=>x.id===q.id));
let overwrite=false;
if(duplicates.length)overwrite=confirm(`${duplicates.length} questões já existem.\nOK: substituir registros existentes (incluindo classificações).\nCancelar: manter as existentes e importar só novas.`);
for(let p of ps)if(overwrite||!provas.some(x=>x.id===p.id))await put("provas",p);
let allowed=new Set(qs.filter(q=>overwrite||!duplicates.some(x=>x.id===q.id)).map(x=>x.id));
let paths=new Set(qs.filter(q=>allowed.has(q.id)).flatMap(q=>q.imagens||[]));
for(let im of imgs)if(paths.has(im.id))await put("imagens",im);
for(let q of qs)if(allowed.has(q.id))await put("questoes",q);
await reload();
avisar(`${allowed.size} questões importadas ou atualizadas.`);
}
async function importJSON(data,fileName){
if(data.tipo==="MEUBANCO_BACKUP_V3"||(Array.isArray(data.provas)&&Array.isArray(data.questoes))){
await restore(data);
return;
}
let list=data.questoes||data.questions;
if(!Array.isArray(list))throw Error("JSON não contém questões.");
let p=normalizedProof(data.prova||{nome:data.nome||fileName.replace(/\.json$/i,""),ano:data.ano||""});
await importRecords([p],list.map(q=>normalizedQ(q,p)),[]);
}
async function importZIP(file){
if(typeof JSZip==="undefined")throw Error("Biblioteca ZIP indisponível.");
let zip=await JSZip.loadAsync(file);
let entry=zip.file("manifest.json")||zip.file("backup.json");
if(!entry)throw Error("Não encontrei manifest.json nem backup.json na raiz.");
let data=JSON.parse(await entry.async("string"));
if(data.tipo==="MEUBANCO_BACKUP_V3"){
await restore(data,zip);
return;
}
if(!Array.isArray(data.questoes))throw Error("Manifesto sem lista de questões.");
let p=normalizedProof(data.prova||{nome:file.name,ano:""});
let list=data.questoes.map(q=>normalizedQ(q,p)),imgs=[];
for(let q of list){
let names=[];
for(let path of q.imagens){
if(typeof path!=="string"||path.startsWith("/")||path.includes(".."))continue;
let entry=zip.file(path);
if(!entry)continue;
let id=p.id+"::"+path;
imgs.push({id,provaId:p.id,caminho:path,blob:await entry.async("blob")});
names.push(id);
}
q.imagens=names;
}
await importRecords([p],list,imgs);
}
async function exportBackup(){
if(typeof JSZip==="undefined")return avisar("Biblioteca ZIP indisponível.");
let zip=new JSZip(),meta=[];
for(let im of imagens){
let extension=(im.caminho||"imagem.png").split(".").pop().toLowerCase();
if(!/^(jpg|jpeg|png|webp|gif|svg)$/.test(extension))extension="png";
let file="imagens/"+im.id.replace(/[^\w-]/g,"_")+"."+extension;
zip.file(file,im.blob);
meta.push({id:im.id,provaId:im.provaId,caminho:im.caminho,arquivo:file});
}
zip.file("backup.json",JSON.stringify({tipo:"MEUBANCO_BACKUP_V3",versao:3,provas,questoes,colecoes,imagens:meta,criado:new Date().toISOString()},null,2));
download(await zip.generateAsync({type:"blob",compression:"DEFLATE"}),"MEUBANCO-BACKUP-"+new Date().toISOString().slice(0,10)+".zip");
}
async function restore(data,zip){
if(!Array.isArray(data.questoes))throw Error("Backup inválido");
let imgs=[];
if(zip)for(let im of data.imagens||[]){
let f=zip.file(im.arquivo);
if(f)imgs.push({id:im.id,provaId:im.provaId,caminho:im.caminho,blob:await f.async("blob")});
}
await importRecords(data.provas||[],data.questoes,imgs);
for(let c of data.colecoes||[])await put("colecoes",c);
await reload();
}
async function deleteProof(e){
let id=dec(e);
if(!confirm("Excluir esta prova, suas questões e imagens?"))return;
for(let q of questoes.filter(x=>x.provaId===id))await del("questoes",q.id);
for(let im of imagens.filter(x=>x.provaId===id))await del("imagens",im.id);
for(let c of colecoes){
c.ids=c.ids.filter(qid=>!questoes.some(q=>q.provaId===id&&q.id===qid));
await put("colecoes",c);
}
await del("provas",id);
await reload();
}
async function deleteAll(){
if(prompt("Digite APAGAR para excluir todo o banco local:")!=="APAGAR")return;
for(let t of ["provas","questoes","colecoes","imagens"])await clear(t);
await reload();
}
$("importFile").addEventListener("change",async e=>{
let files=[...e.target.files];
e.target.value="";
for(let f of files){
try{
if(/\.zip$/i.test(f.name))await importZIP(f);
else if(/\.json$/i.test(f.name))await importJSON(JSON.parse(await f.text()),f.name);
else throw Error("Formato incompatível.");
}catch(err){
console.error(err);
avisar("Não foi possível importar: "+err.message);
}
}
});
(async()=>{
try{
db=await abrirDB();
await reload();
}catch(err){
console.error(err);
$("app").innerHTML="<h2>Não foi possível abrir o armazenamento do navegador.</h2><p>Use o GitHub Pages em HTTPS, fora do modo privado.</p>";
}
})();
