
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7f9">
<title>MEUBANCO</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{
--bg:#f5f7f9;--ink:#253343;--muted:#758395;
--line:#e1e7ec;--blue:#285f79;--soft:#edf4f7;
--green:#247d57;--red:#b54949
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
header{background:white;border-bottom:1px solid var(--line);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{font-size:21px;font-weight:800;letter-spacing:.4px}
.logo small{display:block;font-size:11px;color:var(--muted);font-weight:400}
nav{display:flex;gap:5px;overflow:auto}
nav button{border:0;background:transparent;color:var(--muted);padding:10px;border-radius:9px;white-space:nowrap}
nav button.active{background:var(--soft);color:var(--blue);font-weight:700}
main{max-width:1240px;margin:auto;padding:25px 17px 80px}
h1{font-size:26px;margin:0 0 5px}
h2{font-size:19px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 5px}
p{line-height:1.65}
.sub,.small{color:var(--muted);font-size:12px}
.sub{margin-bottom:22px}
.card,.metric{background:white;border:1px solid var(--line);border-radius:14px;padding:19px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.metric strong{display:block;font-size:28px;margin:5px 0}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{background:white;border:1px solid var(--line);border-radius:9px;padding:11px 14px;color:var(--ink);font-size:13px;font-weight:650}
.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}
.btn.danger{color:var(--red)}
.btn.large{padding:15px 20px;font-size:15px}
label{display:block;color:var(--muted);font-size:12px;font-weight:650;margin-bottom:6px}
input:not([type=checkbox]),select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;background:white;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.field{margin-bottom:13px}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.item{padding:15px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.preview{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;background:#f0f3f6;border-radius:20px;padding:5px 9px;font-size:11px;margin:3px 3px 3px 0}
.good{background:#e7f5ed;color:var(--green)}
.bad{background:#ffeded;color:var(--red)}
.warn{background:#fff2d7;color:#906319}
.check{width:19px;height:19px;accent-color:var(--blue)}
.choices{display:flex;flex-wrap:wrap;gap:8px;max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:11px;padding:10px}
.choice{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:20px;padding:8px 10px;color:var(--ink);font-weight:500;margin:0;cursor:pointer}
.choice input{accent-color:var(--blue)}
.notice{background:var(--soft);color:#45687b;border-radius:10px;padding:13px;font-size:13px}
.empty{text-align:center;padding:38px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:#16243591;z-index:10;display:flex;justify-content:center;align-items:center;padding:12px}
.modal{width:min(100%,1120px);max-height:95dvh;overflow:auto;background:white;border-radius:16px;padding:20px}
.modal-head{position:sticky;top:-20px;background:white;z-index:2;border-bottom:1px solid var(--line);padding:5px 0 13px;margin-bottom:15px}
.modal-foot{position:sticky;bottom:-20px;background:white;z-index:2;border-top:1px solid var(--line);padding:14px 0 5px;margin-top:15px}
.question{white-space:pre-wrap;font-size:15px;line-height:1.75}
.alternative{white-space:pre-wrap;border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
.qimage{display:block;max-width:100%;max-height:440px;object-fit:contain;margin:12px 0}
.chartrow{display:grid;grid-template-columns:130px 1fr 65px;align-items:center;gap:11px;margin:13px 0;font-size:12px}
.bar{height:11px;background:#edf1f4;border-radius:12px;overflow:hidden}
.fill{height:100%;background:#438da5}
.step{border-left:3px solid #b8d5e2;padding-left:17px}
.stepnumber{font-size:11px;color:var(--blue);font-weight:800;letter-spacing:.06em}
.hero{border:1px solid #c5dbe6;background:#fbfdff}
.secondary-panel{background:#fff}
@media(max-width:850px){
header{display:block;padding:13px}
nav{margin-top:10px}
.grid,.two,.filters{grid-template-columns:repeat(2,minmax(0,1fr))}
.modal{padding:14px}
.modal-head{top:-14px}
.modal-foot{bottom:-14px}
}
@media(max-width:550px){
main{padding:16px 11px}
.grid,.two,.filters{grid-template-columns:1fr}
.modal-bg{padding:4px}
.modal{max-height:98dvh}
.chartrow{grid-template-columns:100px 1fr 55px}
}
</style>
</head>
<body>
<header>
<div class="logo">MEUBANCO<small>Banco pessoal de questões</small></div>
<nav id="nav"></nav>
</header>
<main id="app"></main>
<div id="modalRoot"></div>
<input id="fileInput" type="file" accept=".zip,.json" multiple hidden>
<script>
"use strict";
const $=id=>document.getElementById(id);
const clean=v=>String(v??"").trim();
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
})[c]);
const enc=v=>encodeURIComponent(String(v));
const dec=v=>decodeURIComponent(v);
const uid=()=>crypto.randomUUID();
const AREAS=[
"Clínica Médica","Cirurgia Geral",
"Ginecologia e Obstetrícia","Pediatria",
"Medicina Preventiva","Outras"
];
const STATUSES=["acertei","errei","nao_fiz","anulada","a_conferir"];
const TABS=[
["inicio","Início"],["provas","Provas"],
["questoes","Questões"],["colecoes","Coleções"],
["desempenho","Desempenho"],["backup","Adicionar / Backup"]
];
let db,provas=[],questoes=[],colecoes=[],imagens=[];
let page="inicio",current=null,navigation=[],imageURLs=[];
let selected=new Set(),reportProof="";
let filter={prova:"",area:"",tema:"",subs:[],status:"",busca:""};

function statusName(s){
return ({acertei:"Acertei",errei:"Errei",
nao_fiz:"Não fiz",anulada:"Anulada",
a_conferir:"A conferir"})[s]||"A conferir";
}
function openDB(){
return new Promise((resolve,reject)=>{
let r=indexedDB.open("MEUBANCO_V3",1);
r.onupgradeneeded=()=>{
for(let name of ["provas","questoes","colecoes","imagens"])
if(!r.result.objectStoreNames.contains(name))
r.result.createObjectStore(name,{keyPath:"id"});
};
r.onsuccess=()=>resolve(r.result);
r.onerror=()=>reject(r.error);
});
}
function getAll(t){
return new Promise((resolve,reject)=>{
let r=db.transaction(t).objectStore(t).getAll();
r.onsuccess=()=>resolve(r.result);
r.onerror=()=>reject(r.error);
});
}
function put(t,v){
return new Promise((resolve,reject)=>{
let tr=db.transaction(t,"readwrite");
tr.objectStore(t).put(v);
tr.oncomplete=resolve;
tr.onerror=()=>reject(tr.error);
});
}
function del(t,id){
return new Promise((resolve,reject)=>{
let tr=db.transaction(t,"readwrite");
tr.objectStore(t).delete(id);
tr.oncomplete=resolve;
tr.onerror=()=>reject(tr.error);
});
}
function clear(t){
return new Promise((resolve,reject)=>{
let tr=db.transaction(t,"readwrite");
tr.objectStore(t).clear();
tr.oncomplete=resolve;
tr.onerror=()=>reject(tr.error);
});
}
async function reload(draw=true){
[provas,questoes,colecoes,imagens]=await Promise.all(
["provas","questoes","colecoes","imagens"].map(getAll));
if(draw)render();
}
function go(p){
page=p;selected.clear();render();window.scrollTo(0,0);
}
function heading(t,s){
return `<h1>${esc(t)}</h1><div class="sub">${esc(s)}</div>`;
}
function proof(q){return provas.find(p=>p.id===q.provaId)}
function proofName(p){
if(!p)return "Prova";
return p.nome+(!p.ano||String(p.nome).includes(String(p.ano))?"":" "+p.ano);
}
function titleQ(q){return proofName(proof(q))+" — Q"+q.numero}
function stat(list){
let made=list.filter(q=>["acertei","errei"].includes(q.situacao));
let correct=made.filter(q=>q.situacao==="acertei").length;
return {total:list.length,made:made.length,correct,
wrong:made.length-correct,
nao:list.filter(q=>q.situacao==="nao_fiz").length,
anuladas:list.filter(q=>q.situacao==="anulada").length,
pendentes:list.filter(q=>q.situacao==="a_conferir").length,
rate:made.length?correct/made.length*100:null};
}
function percent(n){
return n===null?"—":n.toFixed(1).replace(".",",")+"%";
}
function metrics(s){
return `<div class="grid">
<div class="metric"><span class="small">QUESTÕES</span><strong>${s.total}</strong></div>
<div class="metric"><span class="small">FEITAS</span><strong>${s.made}</strong></div>
<div class="metric"><span class="small">ACERTOS / ERROS</span><strong>${s.correct} / ${s.wrong}</strong></div>
<div class="metric"><span class="small">DESEMPENHO</span><strong>${percent(s.rate)}</strong></div>
</div>`;
}
function render(){
$("nav").innerHTML=TABS.map(([k,t])=>
`<button class="${page===k?"active":""}" onclick="go('${k}')">${t}</button>`
).join("");
$("app").innerHTML=({
inicio:home,provas:proofPage,questoes:questionPage,
colecoes:collectionPage,desempenho:performancePage,
backup:backupPage
})[page]();
}

// INÍCIO E PROVAS
function home(){
return heading("Minha biblioteca","Organize suas provas e estude por assunto.")+
metrics(stat(questoes))+
`<div class="two" style="margin-top:15px">
<div class="card"><h2>Minhas provas</h2>
${provas.map(p=>`<div class="item row between">
<div><b>${esc(proofName(p))}</b>
<div class="small">${questoes.filter(q=>q.provaId===p.id).length} questões</div></div>
<button class="btn" onclick="openProof('${enc(p.id)}')">Abrir</button>
</div>`).join("")||"<p>Nenhuma prova importada.</p>"}</div>
<div class="card"><h2>Adicionar uma prova</h2>
<p>Você tem uma prova em PDF? O ChatGPT pode preparar as questões e imagens para o seu banco.</p>
<button class="btn primary large" onclick="go('backup')">Adicionar nova prova →</button>
</div></div>`;
}
function proofPage(){
return heading("Provas","Abra a prova completa e classifique as questões em sequência.")+
`<div class="card">${provas.map(p=>{
let s=stat(questoes.filter(q=>q.provaId===p.id));
return `<div class="item row between">
<div><h3>${esc(proofName(p))}</h3>
<span class="small">${s.total} questões · ${percent(s.rate)} de acertos</span></div>
<div class="row">
<button class="btn" onclick="openProof('${enc(p.id)}')">Abrir prova</button>
<button class="btn danger" onclick="deleteProof('${enc(p.id)}')">Excluir</button>
</div></div>`;
}).join("")||'<div class="empty">Nenhuma prova cadastrada.</div>'}</div>`;
}
function openProof(e){
filter={prova:dec(e),area:"",tema:"",subs:[],status:"",busca:""};
go("questoes");
}
function options(values,selected,base="Todos"){
return `<option value="">${esc(base)}</option>`+
[...new Set(values.filter(Boolean))]
.sort((a,b)=>a.localeCompare(b,"pt-BR"))
.map(v=>`<option value="${esc(v)}" ${selected===v?"selected":""}>${esc(v)}</option>`)
.join("");
}

// FILTROS E QUESTÕES
function filtered(){
return questoes.filter(q=>{
let text=[
q.enunciado,q.tema_geral,q.tema_especifico,
q.descricao_detalhada,...Object.values(q.alternativas||{})
].join(" ").toLocaleLowerCase("pt-BR");
return (!filter.prova||q.provaId===filter.prova)&&
(!filter.area||q.grande_area===filter.area)&&
(!filter.tema||q.tema_geral===filter.tema)&&
(!filter.subs.length||filter.subs.includes(q.tema_especifico))&&
(!filter.status||q.situacao===filter.status)&&
(!filter.busca||text.includes(filter.busca.toLocaleLowerCase("pt-BR")));
}).sort((a,b)=>proofName(proof(a)).localeCompare(
proofName(proof(b)),"pt-BR")||Number(a.numero)-Number(b.numero));
}
function changeFilter(k,v){
filter[k]=v;
if(k==="area"){filter.tema="";filter.subs=[]}
if(k==="tema")filter.subs=[];
render();
}
function toggleSub(e,checked){
let value=dec(e);
filter.subs=checked?
[...new Set([...filter.subs,value])]:
filter.subs.filter(s=>s!==value);
render();
}
function clearFilters(){
filter={prova:"",area:"",tema:"",subs:[],status:"",busca:""};
render();
}
function tag(q){
let s=q.situacao;
return `<span class="tag ${
s==="acertei"?"good":s==="errei"?"bad":"warn"
}">${statusName(s)}</span>`;
}
function lineQ(q){
return `<div class="item">
<div class="row between">
<div class="row">
<input class="check" type="checkbox" ${selected.has(q.id)?"checked":""}
onchange="selectQ('${enc(q.id)}',this.checked)">
<div>
<h3>${esc(titleQ(q))}</h3>
<span class="tag">${esc(q.grande_area||"Sem área")}</span>
<span class="tag">${esc(q.tema_geral||"Sem tema")}</span>
<span class="tag">${esc(q.tema_especifico||"Sem subtema")}</span>
${tag(q)}
${q.classificacao_aprovada?"":'<span class="tag warn">Tema sugerido</span>'}
</div></div>
<button class="btn" onclick="openQ('${enc(q.id)}')">Abrir</button>
</div>
<p class="preview">${esc(q.enunciado)}</p>
${q.descricao_detalhada?`<div class="small">Descrição: ${esc(q.descricao_detalhada)}</div>`:""}
</div>`;
}
function questionPage(){
let list=filtered();
let themes=questoes.filter(q=>
!filter.area||q.grande_area===filter.area).map(q=>q.tema_geral);
let subs=[...new Set(questoes.filter(q=>
(!filter.prova||q.provaId===filter.prova)&&
(!filter.area||q.grande_area===filter.area)&&
(!filter.tema||q.tema_geral===filter.tema))
.map(q=>q.tema_especifico).filter(Boolean))]
.sort((a,b)=>a.localeCompare(b,"pt-BR"));
return heading("Banco de questões","Combine provas, áreas e vários subtemas.")+
`<div class="card">
<div class="filters">
<div><label>Prova</label>
<select onchange="changeFilter('prova',this.value)">
<option value="">Todas as provas</option>
${provas.map(p=>`<option value="${esc(p.id)}" ${filter.prova===p.id?"selected":""}>${esc(proofName(p))}</option>`).join("")}
</select></div>
<div><label>Grande área</label>
<select onchange="changeFilter('area',this.value)">
${options([...AREAS,...questoes.map(q=>q.grande_area)],filter.area)}</select></div>
<div><label>Tema geral</label>
<select onchange="changeFilter('tema',this.value)">
${options(themes,filter.tema)}</select></div>
<div><label>Desempenho</label>
<select onchange="changeFilter('status',this.value)">
<option value="">Todos</option>
${STATUSES.map(s=>`<option value="${s}" ${filter.status===s?"selected":""}>${statusName(s)}</option>`).join("")}
</select></div>
<div><label>Pesquisar texto ou descrição</label>
<input value="${esc(filter.busca)}" placeholder="Palavra-chave"
onchange="changeFilter('busca',this.value)"></div>
</div>
<div class="field">
<label>Subtemas — marque quantos quiser</label>
<div class="choices">${subs.map(s=>`
<label class="choice"><input type="checkbox"
${filter.subs.includes(s)?"checked":""}
onchange="toggleSub('${enc(s)}',this.checked)">${esc(s)}</label>
`).join("")||'<span class="small">Nenhum subtema disponível.</span>'}</div>
</div>
<div class="row between">
<span class="small">${list.length} questões encontradas · ${filter.subs.length} subtemas selecionados</span>
<div class="row">
<button class="btn" onclick="clearFilters()">Limpar filtros</button>
<button class="btn" onclick="selectResults()">Selecionar resultados</button>
</div></div></div>
<div class="card">
<div class="row between">
<b>${selected.size} selecionadas</b>
<div class="row">
<button class="btn" ${selected.size?"":"disabled"} onclick="batchModal()">Classificar em lote</button>
<button class="btn" ${selected.size?"":"disabled"} onclick="makeCollection()">Criar coleção</button>
<button class="btn primary" ${selected.size?"":"disabled"} onclick="copyStudy([...selected])">Copiar para ChatGPT</button>
</div></div>
${list.map(lineQ).join("")||'<div class="empty">Nenhuma questão encontrada.</div>'}
</div>`;
}
function selectQ(e,on){
let id=dec(e);
on?selected.add(id):selected.delete(id);
render();
}
function selectResults(){
filtered().forEach(q=>selected.add(q.id));
render();
}

// JANELA DA QUESTÃO
function releaseImages(){
imageURLs.forEach(URL.revokeObjectURL);
imageURLs=[];
}
function imgURL(blob){
let url=URL.createObjectURL(blob);
imageURLs.push(url);
return url;
}
function modal(html){
$("modalRoot").innerHTML=`
<div class="modal-bg" onclick="if(event.target===this)closeModal()">
<div class="modal">${html}</div></div>`;
}
function closeModal(){
releaseImages();
$("modalRoot").innerHTML="";
current=null;
}
function openQ(e,keep=false){
let q=questoes.find(x=>x.id===dec(e));
if(!q)return;
if(!keep)navigation=filtered().map(x=>x.id);
if(!navigation.includes(q.id))navigation=[q.id];
current=q.id;
let pos=navigation.indexOf(q.id);
releaseImages();
let alternatives=Object.entries(q.alternativas||{})
.map(([a,v])=>`<div class="alternative"><b>${esc(a)})</b> ${esc(v)}</div>`).join("");
let pictures=(q.imagens||[]).map(id=>{
let im=imagens.find(x=>x.id===id);
return im?`<img class="qimage" alt="Figura da questão" src="${imgURL(im.blob)}">`:"";
}).join("");
let themes=[...new Set(questoes.map(x=>x.tema_geral).filter(Boolean))];
let subs=[...new Set(questoes.map(x=>x.tema_especifico).filter(Boolean))];
modal(`<div class="modal-head row between">
<div><h2 style="margin:0">${esc(titleQ(q))}</h2>
<span class="small">Questão ${pos+1} de ${navigation.length}</span></div>
<button class="btn" onclick="closeModal()">Fechar ×</button>
</div>
<div class="two">
<section>
<div class="question">${esc(q.enunciado)}</div>
${alternatives}${pictures}
<div class="notice">
Gabarito: <b>${esc(q.gabarito||"Não informado")}</b> ·
Sua resposta: <b>${esc(q.minha_resposta||"Não informada")}</b>
</div></section>
<section><div class="card">
<h2>Classificação</h2>
<div class="field"><label>Grande área</label>
<select id="edArea">
${options([...AREAS,...questoes.map(x=>x.grande_area)],q.grande_area,"Selecionar")}
</select></div>
<div class="field"><label>Tema geral</label>
<input id="edTheme" list="themes" value="${esc(q.tema_geral)}">
<datalist id="themes">${themes.map(v=>`<option value="${esc(v)}">`).join("")}</datalist>
</div>
<div class="field"><label>Subtema amplo</label>
<input id="edSub" list="subs" value="${esc(q.tema_especifico)}"
placeholder="Ex.: Anemias hemolíticas">
<datalist id="subs">${subs.map(v=>`<option value="${esc(v)}">`).join("")}</datalist>
</div>
<div class="field"><label>Descrição detalhada (opcional)</label>
<input id="edDetail" value="${esc(q.descricao_detalhada||"")}"
placeholder="Ex.: Esferocitose hereditária"></div>
<div class="field"><label>Desempenho</label>
<select id="edStatus">
${STATUSES.map(s=>`<option value="${s}" ${q.situacao===s?"selected":""}>${statusName(s)}</option>`).join("")}
</select></div>
<div class="two">
<div class="field"><label>Minha resposta</label>
<input id="edAnswer" value="${esc(q.minha_resposta)}"></div>
<div class="field"><label>Gabarito</label>
<input id="edKey" value="${esc(q.gabarito)}"></div>
</div>
<div class="field"><label>Anotações (opcional)</label>
<textarea id="edNotes" placeholder="Em branco por padrão">${esc(q.comentario||"")}</textarea>
</div>
</div></section></div>
<div class="modal-foot row between">
<div class="row">
<button class="btn" ${pos===0?"disabled":""}
onclick="saveQ(-1)">← Salvar e anterior</button>
<button class="btn" onclick="saveQ(0)">Salvar</button>
</div><div class="row">
<button class="btn" onclick="copyStudy([dec('${enc(q.id)}')])">Copiar prompt</button>
<button class="btn" onclick="chatStudy([dec('${enc(q.id)}')])">ChatGPT</button>
<button class="btn primary" ${pos===navigation.length-1?"disabled":""}
onclick="saveQ(1)">Salvar e próxima →</button>
</div></div>`);
}
async function saveQ(direction=0){
let q=questoes.find(x=>x.id===current);
if(!q)return;
let pos=navigation.indexOf(q.id);
let updated={...q,
grande_area:$("edArea").value,
tema_geral:clean($("edTheme").value),
tema_especifico:clean($("edSub").value),
descricao_detalhada:clean($("edDetail").value),
situacao:$("edStatus").value,
minha_resposta:clean($("edAnswer").value),

// IMPORTAÇÃO E ARQUIVOS
function normalizeProof(p){
let name=clean(p.nome||p.prova||"Prova");
let year=p.ano||"";
let id=clean(p.id)||"prova-"+name.toLowerCase()
.normalize("NFD").replace(/[\u0300-\u036f]/g,"")
.replace(/[^a-z0-9]+/g,"-")+"-"+year;
return {id,nome:name,ano:year};
}
function broadSub(v){
let s=clean(v);
let k=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
if(k.includes("trauma esplenico"))return "Trauma esplênico";
if(k.includes("anemia")&&k.includes("hemolit"))return "Anemias hemolíticas";
if(k.includes("anemia"))return "Anemias";
if(/\bdiabetes\b|\bdm\b/.test(k))return "Diabetes mellitus";
if(/\bhas\b|hipertensao arterial/.test(k))return "Hipertensão arterial";
if(/anatomia pelvica|vascularizacao pelvica|pelvimetria|nervo pudendo/.test(k))return "Anatomia pélvica";
return s;
}
function normalizeQ(q,p){
let raw=clean(q.tema_especifico||q.subtema);
let broad=broadSub(raw);
let status=clean(q.situacao).toLowerCase();
if(!STATUSES.includes(status))status="a_conferir";
return {
id:clean(q.id)||p.id+"-q"+(q.numero||q.questao),
provaId:p.id,
numero:q.numero||q.questao||0,
enunciado:String(q.enunciado||q.texto||""),
alternativas:q.alternativas||{},
grande_area:clean(q.grande_area||q.area),
tema_geral:clean(q.tema_geral||q.tema),
tema_especifico:broad,
descricao_detalhada:clean(q.descricao_detalhada||q.detalhamento||(raw!==broad?raw:"")),
classificacao_aprovada:!!q.classificacao_aprovada,
situacao:status,
gabarito:clean(q.gabarito),
minha_resposta:clean(q.minha_resposta),
comentario:"",
imagens:Array.isArray(q.imagens)?q.imagens:[]
};
}
async function importRecords(ps,qs,imgs){
let existing=new Map(questoes.map(q=>[q.id,q]));
let duplicates=qs.filter(q=>existing.has(q.id));
let overwrite=false;
if(duplicates.length){
overwrite=confirm(
duplicates.length+" questões já existem.\n"+
"OK = substituir registros existentes.\n"+
"Cancelar = preservar os existentes e importar apenas novos.");
}
let admitted=qs.filter(q=>overwrite||!existing.has(q.id));
let ids=new Set(admitted.flatMap(q=>q.imagens||[]));
for(let p of ps){
if(!provas.some(x=>x.id===p.id)||overwrite)
await put("provas",p);
}
for(let im of imgs)if(ids.has(im.id))await put("imagens",im);
for(let q of admitted)await put("questoes",q);
await reload();
alert(admitted.length+" questões importadas ou atualizadas.");
}
async function importJSON(data,name){
if(data.tipo==="MEUBANCO_BACKUP_V3"||
(Array.isArray(data.provas)&&Array.isArray(data.questoes))){
await restore(data);return;
}
let list=data.questoes||data.questions;
if(!Array.isArray(list))throw Error("JSON sem questões.");
let p=normalizeProof(data.prova||{
nome:data.nome||name.replace(/\.json$/i,""),ano:data.ano||""
});
await importRecords([p],list.map(q=>normalizeQ(q,p)),[]);
}
async function importZIP(file){
if(typeof JSZip==="undefined")throw Error("Biblioteca ZIP indisponível.");
let zip=await JSZip.loadAsync(file);
let entry=zip.file("manifest.json")||zip.file("backup.json");
if(!entry)throw Error("ZIP sem manifest.json ou backup.json.");
let data=JSON.parse(await entry.async("string"));
if(data.tipo==="MEUBANCO_BACKUP_V3"){
await restore(data,zip);return;
}
if(!Array.isArray(data.questoes))throw Error("Manifesto sem questões.");
let p=normalizeProof(data.prova||{nome:file.name,ano:""});
let list=data.questoes.map(q=>normalizeQ(q,p));
let imgs=[];
for(let q of list){
let ids=[];
for(let path of q.imagens){
if(typeof path!=="string"||path.startsWith("/")||
path.includes(".."))continue;
let f=zip.file(path);
if(!f)continue;
let id=p.id+"::"+path;
imgs.push({id,provaId:p.id,caminho:path,blob:await f.async("blob")});
ids.push(id);
}
q.imagens=ids;
}
await importRecords([p],list,imgs);
}
async function buildZip(personal=true){
if(typeof JSZip==="undefined")throw Error("Biblioteca ZIP indisponível.");
let zip=new JSZip(),meta=[];
for(let im of imagens){
let ext=(im.caminho||"imagem.png").split(".").pop().toLowerCase();
if(!/^(jpg|jpeg|png|gif|webp|svg)$/.test(ext))ext="png";
let path="imagens/"+im.id.replace(/[^\w-]/g,"_")+"."+ext;
zip.file(path,im.blob);
meta.push({id:im.id,provaId:im.provaId,caminho:im.caminho,arquivo:path});
}
let qs=personal?questoes:questoes.map(q=>({
...q,minha_resposta:"",situacao:"a_conferir",
comentario:"",classificacao_aprovada:false
}));
zip.file("backup.json",JSON.stringify({
tipo:"MEUBANCO_BACKUP_V3",versao:3,
provas,questoes:qs,colecoes:personal?colecoes:[],
imagens:meta,criado:new Date().toISOString()
},null,2));
return await zip.generateAsync({type:"blob",compression:"DEFLATE"});
}

async function restore(data,zip){
if(!Array.isArray(data.questoes))throw Error("Backup inválido.");
let imgs=[];
if(zip){
for(let im of data.imagens||[]){
let f=zip.file(im.arquivo);
if(f)imgs.push({id:im.id,provaId:im.provaId,
caminho:im.caminho,blob:await f.async("blob")});
}
}
await importRecords(data.provas||[],data.questoes,imgs);
for(let c of data.colecoes||[])await put("colecoes",c);
await reload();
}
async function deleteProof(e){
let id=dec(e);
if(!confirm("Excluir a prova e suas questões?"))return;
let removed=new Set(questoes.filter(q=>q.provaId===id).map(q=>q.id));
for(let qid of removed)await del("questoes",qid);
for(let im of imagens.filter(x=>x.provaId===id))await del("imagens",im.id);
for(let c of colecoes){
c.ids=c.ids.filter(qid=>!removed.has(qid));
await put("colecoes",c);
}
await del("provas",id);await reload();
}
