
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f8fa">
<title>MEUBANCO</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root {
--bg:#f6f8fa;--ink:#263445;--muted:#728294;
--line:#e1e7ed;--blue:#285f79;--soft:#edf4f8;
--red:#b44949;--green:#26815c
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
header{background:white;border-bottom:1px solid var(--line);padding:17px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font-size:21px;font-weight:800;letter-spacing:.5px}
.logo small{display:block;color:var(--muted);font-size:11px;font-weight:400}
nav{display:flex;gap:5px;overflow:auto}
nav button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:10px;white-space:nowrap}
nav button.active{background:var(--soft);color:var(--blue);font-weight:700}
main{max-width:1250px;margin:auto;padding:24px 16px 75px}
h1{font-size:26px;margin:0 0 5px}
h2{font-size:19px;margin:0 0 13px}
h3{font-size:15px;margin:0}
p{line-height:1.65}
.small,.sub{color:var(--muted);font-size:12px}
.sub{margin-bottom:22px}
.card,.metric{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.metric strong{display:block;font-size:28px;margin-top:5px}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{background:white;border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:650;padding:10px 14px;border-radius:9px}
.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}
.btn.danger{color:var(--red)}
.btn.large{font-size:15px;padding:15px 20px}
label{display:block;color:var(--muted);font-size:12px;font-weight:650;margin-bottom:6px}
input:not([type=checkbox]),select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;background:white;color:var(--ink)}
textarea{resize:vertical;min-height:90px}
.field{margin-bottom:13px}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.item{padding:15px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.preview{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;padding:5px 9px;background:#f0f3f6;border-radius:20px;font-size:11px;margin:3px 3px 3px 0}
.good{background:#e7f5ed;color:var(--green)}
.bad{background:#ffeded;color:var(--red)}
.warn{background:#fff2d7;color:#906318}
.check{width:19px;height:19px;accent-color:var(--blue)}
.choices{display:flex;flex-wrap:wrap;gap:8px;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px}
.choice{display:flex;align-items:center;gap:7px;border:1px solid var(--line);padding:8px 11px;border-radius:20px;margin:0;color:var(--ink);font-weight:500;cursor:pointer}
.choice input{accent-color:var(--blue)}
.notice{background:var(--soft);color:#456579;border-radius:10px;padding:13px;font-size:13px}
.empty{text-align:center;padding:36px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:#17263791;z-index:20;display:flex;justify-content:center;align-items:center;padding:10px}
.modal{background:white;border-radius:16px;width:min(100%,1120px);max-height:96dvh;overflow:auto;padding:20px}
.modal-head{position:sticky;top:-20px;background:white;z-index:3;border-bottom:1px solid var(--line);padding:5px 0 12px;margin-bottom:15px}
.modal-foot{position:sticky;bottom:-20px;background:white;z-index:3;border-top:1px solid var(--line);padding:13px 0 5px;margin-top:16px}
.question{font-size:15px;line-height:1.75;white-space:pre-wrap}
.alternative{border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;white-space:pre-wrap}
.qimage{display:block;max-width:100%;max-height:440px;object-fit:contain;margin:12px 0}
.chartrow{display:grid;grid-template-columns:minmax(125px,1.3fr) minmax(70px,2fr) 65px;gap:10px;align-items:center;margin:13px 0;font-size:12px}
.bar{height:11px;background:#edf1f4;border-radius:15px;overflow:hidden}
.fill{height:100%;background:#438ca5}
.report-item{cursor:pointer;border-radius:9px;padding:7px;margin:-7px}
.report-item:hover{background:#f4f7f9}
.step{border-left:3px solid #a4cbdc;padding-left:18px}
.stepnumber{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.07em}
.hero{background:#fbfdff;border-color:#c3dbe6}
.segment{display:flex;gap:8px;flex-wrap:wrap}
.segment button.active{background:var(--blue);color:white;border-color:var(--blue)}
@media(max-width:850px){
header{display:block;padding:13px}
nav{margin-top:10px}
.grid,.two,.filters{grid-template-columns:repeat(2,minmax(0,1fr))}
.modal{padding:14px}
.modal-head{top:-14px}
.modal-foot{bottom:-14px}
}
@media(max-width:550px){
main{padding:16px 11px}
.grid,.two,.filters{grid-template-columns:1fr}
.modal-bg{padding:4px}
.modal{max-height:98dvh}
.chartrow{grid-template-columns:105px 1fr 55px}
}
</style>
</head>
<body>
<header>
<div class="logo">MEUBANCO<small>Banco pessoal de questões</small></div>
<nav id="nav"></nav>
</header>
<main id="app"></main>
<div id="modalRoot"></div>
<input id="fileInput" type="file" accept=".zip,.json" multiple hidden>

<script>
"use strict";

const $=id=>document.getElementById(id);
const clean=v=>String(v??"").trim();
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
})[c]);
const enc=v=>encodeURIComponent(String(v));
const dec=v=>decodeURIComponent(v);
const uid=()=>crypto.randomUUID();

const AREAS=[
"Clínica Médica","Cirurgia Geral",
"Ginecologia e Obstetrícia","Pediatria",
"Medicina Preventiva","Outras"
];
const STATES=["acertei","errei","nao_fiz","anulada","a_conferir"];
const TABS=[
["inicio","Início"],["provas","Provas"],
["questoes","Questões"],["colecoes","Coleções"],
["desempenho","Desempenho"],["backup","Importar nova prova / Backup"]
];

let db,provas=[],questoes=[],colecoes=[],imagens=[];
let page="inicio",current=null,navigation=[],imageURLs=[];
let selected=new Set();

let filter={
prova:"",area:"",tema:"",subs:[],status:"",busca:""
};

let report={
provas:[],area:"",tema:"",subs:[],detail:"",
view:"macro"
};

// BANCO LOCAL
function openDB(){
return new Promise((resolve,reject)=>{
let r=indexedDB.open("MEUBANCO_V3",1);
r.onupgradeneeded=()=>{
for(let t of ["provas","questoes","colecoes","imagens"]){
if(!r.result.objectStoreNames.contains(t))
r.result.createObjectStore(t,{keyPath:"id"});
}
};
r.onsuccess=()=>resolve(r.result);
r.onerror=()=>reject(r.error);
});
}
function getAll(t){
return new Promise((resolve,reject)=>{
let r=db.transaction(t).objectStore(t).getAll();
r.onsuccess=()=>resolve(r.result);
r.onerror=()=>reject(r.error);
});
}
function put(t,v){
return new Promise((resolve,reject)=>{
let tr=db.transaction(t,"readwrite");
tr.objectStore(t).put(v);
tr.oncomplete=resolve;
tr.onerror=()=>reject(tr.error);
});
}
function del(t,id){
return new Promise((resolve,reject)=>{
let tr=db.transaction(t,"readwrite");
tr.objectStore(t).delete(id);
tr.oncomplete=resolve;
tr.onerror=()=>reject(tr.error);
});
}
function clear(t){
return new Promise((resolve,reject)=>{
let tr=db.transaction(t,"readwrite");
tr.objectStore(t).clear();
tr.oncomplete=resolve;
tr.onerror=()=>reject(tr.error);
});
}
async function reload(draw=true){
[provas,questoes,colecoes,imagens]=await Promise.all(
["provas","questoes","colecoes","imagens"].map(getAll)
);
if(draw)render();
}

function go(p){
page=p;
selected.clear();
render();
window.scrollTo(0,0);
}
function heading(t,s){
return `<h1>${esc(t)}</h1><div class="sub">${esc(s)}</div>`;
}
function proof(q){return provas.find(p=>p.id===q.provaId)}
function proofName(p){
if(!p)return "Prova";
return p.nome+(!p.ano||String(p.nome).includes(String(p.ano))?"":" "+p.ano);
}
function titleQ(q){return proofName(proof(q))+" — Q"+q.numero}
function statusName(s){
return ({
acertei:"Acertei",errei:"Errei",nao_fiz:"Não fiz",
anulada:"Anulada",a_conferir:"A conferir"
})[s]||"A conferir";
}

function stats(list){
let made=list.filter(q=>["acertei","errei"].includes(q.situacao));
let right=made.filter(q=>q.situacao==="acertei").length;
return {
total:list.length,made:made.length,right,
wrong:made.length-right,
nao:list.filter(q=>q.situacao==="nao_fiz").length,
anuladas:list.filter(q=>q.situacao==="anulada").length,
pendentes:list.filter(q=>q.situacao==="a_conferir").length,
rate:made.length?right/made.length*100:null
};
}
function pct(n){
return n===null?"—":n.toFixed(1).replace(".",",")+"%";
}
function metrics(s){
return `<div class="grid" style="margin-bottom:17px">
<div class="metric"><span class="small">TOTAL DE QUESTÕES</span><strong>${s.total}</strong></div>
<div class="metric"><span class="small">QUESTÕES FEITAS</span><strong>${s.made}</strong></div>
<div class="metric"><span class="small">ACERTOS / ERROS</span><strong>${s.right} / ${s.wrong}</strong></div>
<div class="metric"><span class="small">ÍNDICE DE ACERTOS</span><strong>${pct(s.rate)}</strong></div>
</div>`;
}
function render(){
$("nav").innerHTML=TABS.map(([k,t])=>
`<button class="${page===k?"active":""}" onclick="go('${k}')">${t}</button>`
).join("");
$("app").innerHTML=({
inicio:home,provas:proofPage,questoes:questionPage,
colecoes:collectionPage,desempenho:performancePage,backup:backupPage
})[page]();
}

// INÍCIO
function home(){
return heading("Minha biblioteca","Suas provas e questões organizadas por assunto.")+
metrics(stats(questoes))+
`<div class="two">
<div class="card">
<h2>Minhas provas</h2>
${provas.map(p=>`<div class="item row between">
<div><b>${esc(proofName(p))}</b>
<div class="small">${questoes.filter(q=>q.provaId===p.id).length} questões</div></div>
<button class="btn" onclick="openProof('${enc(p.id)}')">Abrir</button>
</div>`).join("")||'<p class="small">Nenhuma prova importada.</p>'}
</div>
<div class="card">
<h2>Adicionar nova prova</h2>
<p>Envie ao ChatGPT o PDF de uma prova. Depois, importe o arquivo preparado para reunir as questões no MEUBANCO.</p>
<button class="btn primary large" onclick="go('backup')">
Importar nova prova →
</button>
</div>
</div>`;
}

// PROVAS
function proofPage(){
return heading("Provas","Abra as questões de uma prova na ordem original.")+
`<div class="card">
${provas.map(p=>{
let s=stats(questoes.filter(q=>q.provaId===p.id));
return `<div class="item row between">
<div><h3>${esc(proofName(p))}</h3>
<span class="small">${s.total} questões · ${s.made} feitas · ${pct(s.rate)} de acertos</span></div>
<div class="row">
<button class="btn" onclick="openProof('${enc(p.id)}')">Abrir</button>
<button class="btn danger" onclick="deleteProof('${enc(p.id)}')">Excluir</button>
</div></div>`;
}).join("")||'<div class="empty">Nenhuma prova importada.</div>'}
</div>`;
}
function openProof(id){
filter={prova:dec(id),area:"",tema:"",subs:[],status:"",busca:""};
go("questoes");
}
function options(values,value,base="Todos"){
return `<option value="">${esc(base)}</option>`+
[...new Set(values.filter(Boolean))]
.sort((a,b)=>a.localeCompare(b,"pt-BR"))
.map(v=>`<option value="${esc(v)}" ${value===v?"selected":""}>${esc(v)}</option>`).join("");
}

// FILTROS DE QUESTÕES
function filtered(){
return questoes.filter(q=>{
let hay=[q.enunciado,q.tema_geral,q.tema_especifico,
q.descricao_detalhada,...Object.values(q.alternativas||{})]
.join(" ").toLocaleLowerCase("pt-BR");
return (!filter.prova||q.provaId===filter.prova)&&
(!filter.area||q.grande_area===filter.area)&&
(!filter.tema||q.tema_geral===filter.tema)&&
(!filter.subs.length||filter.subs.includes(q.tema_especifico))&&
(!filter.status||q.situacao===filter.status)&&
(!filter.busca||hay.includes(filter.busca.toLocaleLowerCase("pt-BR")));
}).sort((a,b)=>
proofName(proof(a)).localeCompare(proofName(proof(b)),"pt-BR")||
Number(a.numero)-Number(b.numero));
}
function changeFilter(k,v){
filter[k]=v;
if(k==="area"){filter.tema="";filter.subs=[]}
if(k==="tema")filter.subs=[];
render();
}
function toggleSub(id,on){
let v=dec(id);
filter.subs=on?[...new Set([...filter.subs,v])]:
filter.subs.filter(s=>s!==v);
render();
}
function clearFilters(){
filter={prova:"",area:"",tema:"",subs:[],status:"",busca:""};
render();
}
function tag(q){
let c=q.situacao==="acertei"?"good":
q.situacao==="errei"?"bad":"warn";
return `<span class="tag ${c}">${statusName(q.situacao)}</span>`;
}
function lineQ(q){
return `<div class="item">
<div class="row between">
<div class="row">
<input class="check" type="checkbox" ${selected.has(q.id)?"checked":""}
onchange="selectQ('${enc(q.id)}',this.checked)">
<div>
<h3>${esc(titleQ(q))}</h3>
<span class="tag">${esc(q.grande_area||"Sem área")}</span>
<span class="tag">${esc(q.tema_geral||"Sem tema")}</span>
<span class="tag">${esc(q.tema_especifico||"Sem subtema")}</span>
${tag(q)}
${q.classificacao_aprovada?"":'<span class="tag warn">Tema sugerido</span>'}
</div></div>
<button class="btn" onclick="openQ('${enc(q.id)}')">Abrir</button>
</div>
<p class="preview">${esc(q.enunciado)}</p>
${q.descricao_detalhada?
`<div class="small">Descrição: ${esc(q.descricao_detalhada)}</div>`:""}
</div>`;
}
function questionPage(){
let list=filtered();
let themes=questoes.filter(q=>
!filter.area||q.grande_area===filter.area
).map(q=>q.tema_geral);
let subs=[...new Set(questoes.filter(q=>
(!filter.prova||q.provaId===filter.prova)&&
(!filter.area||q.grande_area===filter.area)&&
(!filter.tema||q.tema_geral===filter.tema)
).map(q=>q.tema_especifico).filter(Boolean))]
.sort((a,b)=>a.localeCompare(b,"pt-BR"));

return heading("Banco de questões","Combine provas, temas e vários subtemas.")+
`<div class="card">
<div class="filters">
<div><label>Prova</label>
<select onchange="changeFilter('prova',this.value)">
<option value="">Todas as provas</option>
${provas.map(p=>`<option value="${esc(p.id)}"
${filter.prova===p.id?"selected":""}>${esc(proofName(p))}</option>`).join("")}
</select></div>
<div><label>Grande área</label>
<select onchange="changeFilter('area',this.value)">
${options([...AREAS,...questoes.map(q=>q.grande_area)],filter.area)}
</select></div>
<div><label>Tema geral</label>
<select onchange="changeFilter('tema',this.value)">
${options(themes,filter.tema)}
</select></div>
<div><label>Desempenho</label>
<select onchange="changeFilter('status',this.value)">
<option value="">Todos</option>
${STATES.map(s=>`<option value="${s}"
${filter.status===s?"selected":""}>${statusName(s)}</option>`).join("")}
</select></div>
<div><label>Pesquisar texto ou descrição</label>
<input value="${esc(filter.busca)}" placeholder="Palavra-chave"
onchange="changeFilter('busca',this.value)">
</div></div>

<div class="field">
<label>Subtemas — marque quantos quiser</label>
<div class="choices">
${subs.map(s=>`<label class="choice">
<input type="checkbox" ${filter.subs.includes(s)?"checked":""}
onchange="toggleSub('${enc(s)}',this.checked)">${esc(s)}
</label>`).join("")||'<span class="small">Sem subtemas disponíveis.</span>'}
</div></div>

<div class="row between">
<span class="small">${list.length} questões encontradas</span>
<div class="row">
<button class="btn" onclick="clearFilters()">Limpar filtros</button>
<button class="btn" onclick="selectResults()">Selecionar resultados</button>
</div></div></div>

<div class="card">
<div class="row between">
<b>${selected.size} selecionadas</b>
<div class="row">
<button class="btn" ${selected.size?"":"disabled"}
onclick="batchModal()">Classificar em lote</button>
<button class="btn" ${selected.size?"":"disabled"}
onclick="makeCollection()">Criar coleção</button>
<button class="btn primary" ${selected.size?"":"disabled"}
onclick="copyStudy([...selected])">Copiar para ChatGPT</button>
</div></div>
${list.map(lineQ).join("")||
'<div class="empty">Nenhuma questão encontrada.</div>'}
</div>`;
}
function selectQ(id,on){
let v=dec(id);
on?selected.add(v):selected.delete(v);
render();
}
function selectResults(){
filtered().forEach(q=>selected.add(q.id));
render();
}

// VISUALIZAÇÃO E CLASSIFICAÇÃO
function releaseImages(){
imageURLs.forEach(URL.revokeObjectURL);
imageURLs=[];
}
function imgURL(blob){
let url=URL.createObjectURL(blob);
imageURLs.push(url);
return url;
}
function modal(html){
$("modalRoot").innerHTML=`
<div class="modal-bg" onclick="if(event.target===this)closeModal()">
<div class="modal">${html}</div></div>`;
}
function closeModal(){
releaseImages();
$("modalRoot").innerHTML="";
current=null;
}
function openQ(id,keep=false){
let q=questoes.find(x=>x.id===dec(id));
if(!q)return;
if(!keep)navigation=filtered().map(q=>q.id);
if(!navigation.includes(q.id))navigation=[q.id];
current=q.id;
let pos=navigation.indexOf(q.id);
releaseImages();

let alternatives=Object.entries(q.alternativas||{})
.map(([a,v])=>`<div class="alternative">
<b>${esc(a)})</b> ${esc(v)}</div>`).join("");

let pictures=(q.imagens||[]).map(id=>{
let im=imagens.find(x=>x.id===id);
return im?`<img class="qimage" alt="Figura da questão"
src="${imgURL(im.blob)}">`:"";
}).join("");

let themes=[...new Set(questoes.map(x=>x.tema_geral).filter(Boolean))];
let subs=[...new Set(questoes.map(x=>x.tema_especifico).filter(Boolean))];

modal(`<div class="modal-head row between">
<div><h2 style="margin:0">${esc(titleQ(q))}</h2>
<span class="small">Questão ${pos+1} de ${navigation.length}</span></div>
<button class="btn" onclick="closeModal()">Fechar ×</button>
</div>

<div class="two">
<section>
<div class="question">${esc(q.enunciado)}</div>
${alternatives}${pictures}
<div class="notice">
Gabarito: <b>${esc(q.gabarito||"Não informado")}</b> ·
Sua resposta: <b>${esc(q.minha_resposta||"Não informada")}</b>
</div>
</section>

<section><div class="card">
<h2>Classificação</h2>
<div class="field"><label>Grande área</label>
<select id="edArea">
${options([...AREAS,...questoes.map(x=>x.grande_area)],
q.grande_area,"Selecionar")}
</select></div>

<div class="field"><label>Tema geral</label>
<input id="edTheme" list="themes" value="${esc(q.tema_geral)}">
<datalist id="themes">
${themes.map(v=>`<option value="${esc(v)}">`).join("")}
</datalist></div>

<div class="field"><label>Subtema amplo</label>
<input id="edSub" list="subs" value="${esc(q.tema_especifico)}"
placeholder="Ex.: Anemias hemolíticas">
<datalist id="subs">
${subs.map(v=>`<option value="${esc(v)}">`).join("")}
</datalist></div>

<div class="field"><label>Descrição detalhada</label>
<input id="edDetail" value="${esc(q.descricao_detalhada||"")}"
placeholder="Ex.: Esferocitose hereditária"></div>

<div class="field"><label>Desempenho</label>
<select id="edStatus">
${STATES.map(s=>`<option value="${s}"
${q.situacao===s?"selected":""}>${statusName(s)}</option>`).join("")}
</select></div>

<div class="two">
<div class="field"><label>Minha resposta</label>
<input id="edAnswer" value="${esc(q.minha_resposta)}"></div>
<div class="field"><label>Gabarito</label>
<input id="edKey" value="${esc(q.gabarito)}"></div>
</div>

<div class="field"><label>Anotações (opcional)</label>
<textarea id="edNotes" placeholder="Em branco por padrão">${esc(q.comentario||"")}</textarea>
</div>
</div></section>
</div>

<div class="modal-foot row between">
<div class="row">
<button class="btn" ${pos===0?"disabled":""}
onclick="saveQ(-1)">← Salvar e anterior</button>
<button class="btn" onclick="saveQ(0)">Salvar</button>
</div>
<div class="row">
<button class="btn" onclick="copyStudy([dec('${enc(q.id)}')])">
Copiar prompt</button>

grande_area:$("edArea").value,
tema_geral:clean($("edTheme").value),

};

}

function reportList(){
return questoes.filter(q=>
(!report.provas.length||report.provas.includes(q.provaId))&&
(!report.area||q.grande_area===report.area)&&
(!report.tema||q.tema_geral===report.tema)&&
(!report.subs.length||report.subs.includes(q.tema_especifico))&&
(!report.detail||q.descricao_detalhada===report.detail)
);

function changeReport(k,v){
report[k]=v;
if(k==="area"){
report.tema="";

function groupStats(list,key){

return [...groups].map(([name,qs])=>({
name,...stats(qs)
})).sort((a,b)=>b.made-a.made||a.name.localeCompare(b.name,"pt-BR"));

function download(blob,name){
let url=URL.createObjectURL(blob);
let a=document.createElement("a");
a.href=url;a.download=name;
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function exportCSV(){
let list=reportList();
let rows=[[
"Nível","Assunto","Total","Feitas","Acertos",
"Erros","Não fiz","Anuladas","A conferir","Índice"
]];
for(let [key,label] of [
["grande_area","Grande área"],
["tema_geral","Tema geral"],
["tema_especifico","Subtema"],
["descricao_detalhada","Descrição detalhada"]
]){
for(let g of groupStats(list,key)){
rows.push([
label,g.name,g.total,g.made,g.right,g.wrong,
g.nao,g.anuladas,g.pendentes,pct(g.rate)
]);
}
}
let csv="\ufeff"+rows.map(r=>
r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(";")
).join("\n");
download(
new Blob([csv],{type:"text/csv;charset=utf-8"}),
"MEUBANCO-RELATORIO.csv"
);
}

function zipPrompt(){
return `Quero adicionar uma prova de residência médica em PDF ao aplicativo MEUBANCO.

COMECE A CONVERSA COM A SEGUINTE ORIENTAÇÃO:

"Envie aqui o PDF da prova que você deseja importar para o MEUBANCO.

Se você já resolveu a prova e tem suas respostas marcadas, envie essa versão. Assim poderei identificar seus acertos e erros quando houver gabarito confiável.

Se o gabarito oficial estiver em outro arquivo, pode enviar também.

Depois que eu receber seu PDF, identificarei a prova e confirmarei o nome antes de preparar o ZIP."

AGUARDE O PDF.

DEPOIS DE RECEBER:
1. Identifique o processo seletivo e o ano.
2. Pergunte: "Identifiquei a prova [NOME] de [ANO]. Posso nomeá-la como [NOME ANO] ou prefere outro nome?"
3. Aguarde a escolha do usuário.
4. Use exatamente o nome escolhido em prova.nome.
5. Não acrescente o ano duas vezes.

PREPARAÇÃO DO ZIP:

Transcreva integralmente todas as questões, enunciados e alternativas, sem resumir.

Preserve figuras, tabelas, gráficos, eletrocardiogramas e imagens.
Extraia-as para a pasta imagens/ e associe cada arquivo à questão correspondente.

Crie manifest.json na raiz do ZIP, com versao 3.

FORMATO:

{
 "versao":3,
 "prova":{
  "id":"identificador-estavel",
  "nome":"Nome escolhido",
  "ano":2026
 },
 "questoes":[{
  "id":"identificador-estavel-q1",
  "numero":1,
  "enunciado":"Texto integral",
  "alternativas":{
   "A":"Texto A",
   "B":"Texto B",
   "C":"Texto C",
   "D":"Texto D"
  },
  "grande_area":"Clínica Médica",
  "tema_geral":"Hematologia",
  "tema_especifico":"Anemias hemolíticas",
  "descricao_detalhada":"Esferocitose hereditária",
  "classificacao_aprovada":false,
  "situacao":"a_conferir",
  "minha_resposta":"",
  "gabarito":"",
  "comentario":"",
  "imagens":[]
 }]
}

CLASSIFIQUE EM QUATRO NÍVEIS:

Grande área > Tema geral > Subtema amplo > Descrição detalhada.

Exemplos:
Clínica Médica > Hematologia > Anemias hemolíticas > Esferocitose hereditária.
Cirurgia Geral > Trauma > Trauma esplênico > Tratamento não operatório.
Cirurgia Geral > Cuidados perioperatórios > Avaliação pré-operatória > Risco cardiovascular.
Clínica Médica > Endocrinologia > Diabetes mellitus > Diagnóstico laboratorial.

Os temas e subtemas devem ser amplos, reutilizáveis e escritos por extenso.

A classificação é uma sugestão. Defina classificacao_aprovada como false.
O usuário definirá a classificação final no aplicativo.

GRANDES ÁREAS:
Clínica Médica;
Cirurgia Geral;
Ginecologia e Obstetrícia;
Pediatria;
Medicina Preventiva.

DESEMPENHO:
Se houver resposta pessoal identificável e gabarito confiável, registre acertei ou errei.
Use anulada para questões anuladas.
Use nao_fiz somente quando houver evidência de que a questão não foi respondida.
Use a_conferir quando a marcação estiver incerta.

Deixe comentario vazio por padrão.
Não invente respostas, gabaritos ou textos ilegíveis.

Use identificadores únicos e estáveis.
Confira a quantidade de questões, os caminhos das imagens e a integridade do ZIP.
Entregue o arquivo ZIP pronto para importar no MEUBANCO.`;
}

// IMPORTAÇÃO
function normalizeProof(p){
let name=clean(p.nome||p.prova||"Prova");
let year=p.ano||"";
let id=clean(p.id)||"prova-"+name.toLowerCase()
.normalize("NFD").replace(/[\u0300-\u036f]/g,"")
.replace(/[^a-z0-9]+/g,"-")+"-"+year;
return {id,nome:name,ano:year};
}
function broadSub(v){
let s=clean(v);
let k=s.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"").toLowerCase();
if(k.includes("trauma esplenico"))return "Trauma esplênico";
if(k.includes("anemia")&&k.includes("hemolit"))return "Anemias hemolíticas";
if(k.includes("anemia"))return "Anemias";
if(/\bdiabetes\b|\bdm\b/.test(k))return "Diabetes mellitus";
if(/\bhas\b|hipertensao arterial/.test(k))return "Hipertensão arterial";
if(/anatomia pelvica|vascularizacao pelvica|pelvimetria|nervo pudendo/.test(k))
return "Anatomia pélvica";
return s;
}
function normalizeQ(q,p){
let raw=clean(q.tema_especifico||q.subtema);
let broad=broadSub(raw);
let status=clean(q.situacao).toLowerCase();
if(!STATES.includes(status))status="a_conferir";
return {
id:clean(q.id)||p.id+"-q"+(q.numero||q.questao),
provaId:p.id,
numero:q.numero||q.questao||0,
enunciado:String(q.enunciado||q.texto||""),
alternativas:q.alternativas||{},
grande_area:clean(q.grande_area||q.area),
tema_geral:clean(q.tema_geral||q.tema),
tema_especifico:broad,
descricao_detalhada:clean(
q.descricao_detalhada||q.detalhamento||(raw!==broad?raw:"")
),
classificacao_aprovada:!!q.classificacao_aprovada,
situacao:status,
gabarito:clean(q.gabarito),
minha_resposta:clean(q.minha_resposta),
comentario:"",
imagens:Array.isArray(q.imagens)?q.imagens:[]
};
}
async function importRecords(ps,qs,imgs){
let existing=new Set(questoes.map(q=>q.id));
let duplicates=qs.filter(q=>existing.has(q.id));
let overwrite=false;
if(duplicates.length){
overwrite=confirm(
duplicates.length+" questões já existem.\n"+
"OK = substituir registros existentes.\n"+
"Cancelar = preservar as questões existentes e importar apenas novas."
);
}
let admitted=qs.filter(q=>overwrite||!existing.has(q.id));
let ids=new Set(admitted.flatMap(q=>q.imagens||[]));
for(let p of ps){
if(overwrite||!provas.some(x=>x.id===p.id))
await put("provas",p);
}
for(let im of imgs)if(ids.has(im.id))await put("imagens",im);
for(let q of admitted)await put("questoes",q);
await reload();
alert(admitted.length+" questões importadas ou atualizadas.");
}
async function importJSON(data,name){
if(data.tipo==="MEUBANCO_BACKUP_V3"||
(Array.isArray(data.provas)&&Array.isArray(data.questoes))){
await restore(data);return;
}
let list=data.questoes||data.questions;
if(!Array.isArray(list))throw Error("JSON sem questões.");
let p=normalizeProof(data.prova||{
nome:data.nome||name.replace(/\.json$/i,""),
ano:data.ano||""
});
await importRecords([p],list.map(q=>normalizeQ(q,p)),[]);
}
async function importZIP(file){
if(typeof JSZip==="undefined")
throw Error("Biblioteca ZIP indisponível.");
let zip=await JSZip.loadAsync(file);
let entry=zip.file("manifest.json")||zip.file("backup.json");
if(!entry)throw Error("ZIP sem manifest.json ou backup.json.");
let data=JSON.parse(await entry.async("string"));
if(data.tipo==="MEUBANCO_BACKUP_V3"){
await restore(data,zip);
return;
}
if(!Array.isArray(data.questoes))
throw Error("Manifesto sem questões.");
let p=normalizeProof(data.prova||{nome:file.name,ano:""});
let list=data.questoes.map(q=>normalizeQ(q,p));
let imgs=[];
for(let q of list){
let ids=[];
for(let path of q.imagens){
if(typeof path!=="string"||path.startsWith("/")||
path.includes(".."))continue;
let f=zip.file(path);
if(!f)continue;
let id=p.id+"::"+path;
imgs.push({
id,provaId:p.id,caminho:path,
blob:await f.async("blob")
});
ids.push(id);
}
q.imagens=ids;
}
await importRecords([p],list,imgs);
}

// EXPORTAÇÃO
async function buildZip(personal=true){
if(typeof JSZip==="undefined")
throw Error("Biblioteca ZIP indisponível.");
let zip=new JSZip();
let meta=[];
for(let im of imagens){
let ext=(im.caminho||"imagem.png")
.split(".").pop().toLowerCase();
if(!/^(jpg|jpeg|png|gif|webp|svg)$/.test(ext))
ext="png";
let path="imagens/"+
im.id.replace(/[^\w-]/g,"_")+"."+ext;
zip.file(path,im.blob);
meta.push({
id:im.id,provaId:im.provaId,
caminho:im.caminho,arquivo:path
});
}
let qs=personal?questoes:questoes.map(q=>({
...q,
minha_resposta:"",
situacao:"a_conferir",
comentario:"",
classificacao_aprovada:false
}));
zip.file("backup.json",JSON.stringify({
tipo:"MEUBANCO_BACKUP_V3",
versao:3,
provas,
questoes:qs,
colecoes:personal?colecoes:[],
imagens:meta,
criado:new Date().toISOString()
},null,2));
return zip.generateAsync({type:"blob",compression:"DEFLATE"});
}
async function exportBackup(){
try{
download(
await buildZip(true),
"MEUBANCO-BACKUP-"+new Date().toISOString().slice(0,10)+".zip"
);
}catch(e){alert(e.message)}
}
async function exportShare(){
try{
download(await buildZip(false),"MEUBANCO-COMPARTILHAR.zip");
}catch(e){alert(e.message)}
}
async function restore(data,zip){
if(!Array.isArray(data.questoes))
throw Error("Backup inválido.");
let imgs=[];
if(zip){
for(let im of data.imagens||[]){
let f=zip.file(im.arquivo);
if(f)imgs.push({
id:im.id,provaId:im.provaId,
caminho:im.caminho,
blob:await f.async("blob")
});
}
}
await importRecords(data.provas||[],data.questoes,imgs);
for(let c of data.colecoes||[])await put("colecoes",c);
await reload();
}
async function deleteProof(id){
let v=dec(id);
if(!confirm("Excluir a prova e suas questões?"))return;
let removed=new Set(
questoes.filter(q=>q.provaId===v).map(q=>q.id)
);
for(let qid of removed)await del("questoes",qid);
for(let im of imagens.filter(x=>x.provaId===v))
await del("imagens",im.id);
for(let c of colecoes){
c.ids=c.ids.filter(qid=>!removed.has(qid));
await put("colecoes",c);
}
await del("provas",v);
await reload();
}
async function deleteAll(){
if(prompt("Digite APAGAR para confirmar:")!=="APAGAR")return;
for(let t of ["provas","questoes","colecoes","imagens"])
await clear(t);
await reload();
}
$("fileInput").addEventListener("change",async e=>{
let files=[...e.target.files];
e.target.value="";
for(let f of files){
try{
if(/\.zip$/i.test(f.name))
await importZIP(f);
else if(/\.json$/i.test(f.name))
await importJSON(JSON.parse(await f.text()),f.name);
else throw Error("Formato incompatível.");
}catch(err){
console.error(err);
alert("Erro: "+err.message);
}
}
});
openDB().then(()=>reload()).catch(err=>{
console.error(err);
$("app").innerHTML=
"<h2>Erro ao abrir o armazenamento.</h2><p>Abra pelo GitHub Pages, em HTTPS.</p>";
});
