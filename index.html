
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f8fa">
<title>MEUBANCO</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<style>
:root {
  --bg:#f6f8fa;
  --surface:#ffffff;
  --text:#263445;
  --muted:#768495;
  --line:#e2e7ec;
  --primary:#285e78;
  --soft:#edf4f7;
  --green:#25805a;
  --red:#b94848;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;
}
button,input,select,textarea {font:inherit}
button {cursor:pointer}
button:disabled {opacity:.4;cursor:default}
header {
  background:white;
  border-bottom:1px solid var(--line);
  padding:16px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
}
.logo {font-size:21px;font-weight:800;letter-spacing:.5px}
.logo small {
  display:block;
  font-size:11px;
  color:var(--muted);
  font-weight:400;
}
nav {display:flex;gap:5px;overflow-x:auto}
nav button {
  background:transparent;
  border:0;
  border-radius:8px;
  padding:10px;
  color:var(--muted);
  white-space:nowrap;
  font-size:13px;
}
nav button.active {background:var(--soft);color:var(--primary);font-weight:700}
main {max-width:1250px;margin:auto;padding:24px 16px 80px}
h1 {font-size:26px;margin:0 0 5px}
h2 {font-size:18px;margin:0 0 13px}
h3 {font-size:15px;margin:0 0 5px}
p {line-height:1.6}
.sub {font-size:13px;color:var(--muted);margin-bottom:22px}
.card {
  background:white;
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  margin-bottom:15px;
}
.grid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}
.two {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px;
}
.metric {
  background:white;
  border:1px solid var(--line);
  border-radius:12px;
  padding:17px;
}
.metric strong {display:block;font-size:27px;margin-top:7px}
.small {font-size:12px;color:var(--muted)}
.row {display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.between {justify-content:space-between}
.btn {
  border:1px solid var(--line);
  border-radius:9px;
  background:white;
  color:var(--text);
  font-size:13px;
  font-weight:600;
  padding:11px 14px;
}
.btn.primary {background:var(--primary);border-color:var(--primary);color:white}
.btn.danger {color:var(--red)}
.btn:focus-visible,input:focus-visible,
select:focus-visible,textarea:focus-visible {
  outline:2px solid #65b3dc;
  outline-offset:2px;
}
label {
  display:block;
  font-size:12px;
  font-weight:650;
  color:var(--muted);
  margin-bottom:6px;
}
input:not([type=checkbox]),select,textarea {
  width:100%;
  padding:11px;
  color:var(--text);
  background:white;
  border:1px solid var(--line);
  border-radius:9px;
}
textarea {resize:vertical;min-height:85px}
.field {margin-bottom:13px}
.filters {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.item {padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child {border-bottom:0}
.preview {
  font-size:13px;
  line-height:1.6;
  color:var(--muted);
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.tag {
  display:inline-block;
  background:#f0f3f6;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  margin:3px 3px 3px 0;
}
.tag.good {background:#e7f5ed;color:var(--green)}
.tag.bad {background:#ffeded;color:var(--red)}
.tag.warn {background:#fff2d7;color:#946515}
.check {width:19px;height:19px;accent-color:var(--primary)}
.notice {
  background:var(--soft);
  padding:13px;
  border-radius:10px;
  font-size:13px;
  line-height:1.6;
  color:#45657a;
}
.empty {padding:38px;text-align:center;color:var(--muted)}
.modal-bg {
  position:fixed;
  inset:0;
  background:#16233088;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
}
.modal {
  background:white;
  border-radius:16px;
  width:min(100%,1150px);
  max-height:95dvh;
  overflow:auto;
  padding:20px;
}
.modal-header {
  position:sticky;
  top:-20px;
  z-index:5;
  background:white;
  padding:6px 0 13px;
  border-bottom:1px solid var(--line);
  margin-bottom:15px;
}
.modal-footer {
  position:sticky;
  bottom:-20px;
  z-index:5;
  background:white;
  padding:13px 0 5px;
  border-top:1px solid var(--line);
  margin-top:17px;
}
.question {
  font-size:15px;
  white-space:pre-wrap;
  line-height:1.75;
}
.alternative {
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  margin:8px 0;
  line-height:1.55;
  white-space:pre-wrap;
}
.qimage {
  display:block;
  max-width:100%;
  max-height:420px;
  object-fit:contain;
  margin:12px 0;
  border-radius:8px;
}
.chart-row {
  display:grid;
  grid-template-columns:minmax(110px,1.2fr) minmax(80px,2fr) 65px;
  gap:12px;
  align-items:center;
  margin:13px 0;
  font-size:12px;
}
.bar {height:11px;background:#edf1f4;border-radius:12px;overflow:hidden}
.fill {height:100%;background:#428ca6}
.proof-options {
  display:flex;
  flex-wrap:wrap;
  gap:11px;
  padding:9px 0;
}
.proof-options label {
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  font-weight:500;
  color:var(--text);
  margin:0;
}
.proof-options input {width:17px;height:17px}
@media(max-width:850px) {
  header {display:block;padding:13px}
  nav {margin-top:10px}
  .grid,.two {grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters {grid-template-columns:repeat(2,minmax(0,1fr))}
  .modal {padding:14px}
  .modal-header {top:-14px}
  .modal-footer {bottom:-14px}
}
@media(max-width:540px) {
  main {padding:16px 11px}
  .grid,.two,.filters {grid-template-columns:1fr}
  .modal-bg {padding:4px}
  .modal {max-height:98dvh}
  .chart-row {grid-template-columns:100px 1fr 55px}
}
</style>
</head>

<body>
<header>
  <div class="logo">
    MEUBANCO
    <small>Meu banco pessoal de questões</small>
  </div>
  <nav id="nav"></nav>
</header>

<main id="app"></main>
<div id="modalRoot"></div>

<input id="fileInput" type="file" accept=".zip,.json" multiple hidden>

<script>
"use strict";

const $ = id => document.getElementById(id);
const txt = v => String(v ?? "").trim();
const escapeHTML = v => String(v ?? "").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
})[c]);

const code = v => encodeURIComponent(String(v));
const decode = v => decodeURIComponent(v);
const uid = () => crypto.randomUUID();

const areas = [
  "Clínica Médica",
  "Cirurgia Geral",
  "Ginecologia e Obstetrícia",
  "Pediatria",
  "Medicina Preventiva",
  "Outras"
];

const tabs = [
  ["inicio","Início"],
  ["provas","Provas"],
  ["questoes","Questões"],
  ["colecoes","Coleções"],
  ["desempenho","Desempenho"],
  ["backup","Importar / Backup"]
];

let db;
let provas = [];
let questoes = [];
let imagens = [];
let colecoes = [];

let tela = "inicio";
let aberta = null;
let navIds = [];
let imageURLs = [];
let selecionadas = new Set();

let filtro = {
  provas:[],
  area:"",
  tema:"",
  sub:"",
  status:"",
  busca:""
};

let relatorioProva = "";

function aviso(s){alert(s)}

function openDB(){
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open("MEUBANCO_V3",1);
    r.onupgradeneeded=()=>{
      for(const nome of ["provas","questoes","imagens","colecoes"]){
        if(!r.result.objectStoreNames.contains(nome)){
          r.result.createObjectStore(nome,{keyPath:"id"});
        }
      }
    };
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}

function getAll(table){
  return new Promise((resolve,reject)=>{
    const r=db.transaction(table).objectStore(table).getAll();
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}

function put(table,object){
  return new Promise((resolve,reject)=>{
    const tr=db.transaction(table,"readwrite");
    tr.objectStore(table).put(object);
    tr.oncomplete=resolve;
    tr.onerror=()=>reject(tr.error);
  });
}

function remove(table,id){
  return new Promise((resolve,reject)=>{
    const tr=db.transaction(table,"readwrite");
    tr.objectStore(table).delete(id);
    tr.oncomplete=resolve;
    tr.onerror=()=>reject(tr.error);
  });
}

function wipe(table){
  return new Promise((resolve,reject)=>{
    const tr=db.transaction(table,"readwrite");
    tr.objectStore(table).clear();
    tr.oncomplete=resolve;
    tr.onerror=()=>reject(tr.error);
  });
}

async function refresh(draw=true){
  [provas,questoes,imagens,colecoes]=await Promise.all(
    ["provas","questoes","imagens","colecoes"].map(getAll)
  );
  if(draw)render();
}

function go(to){
  tela=to;
  selecionadas.clear();
  render();
  window.scrollTo(0,0);
}

function heading(title,subtitle){
  return `<h1>${escapeHTML(title)}</h1>
  <div class="sub">${escapeHTML(subtitle)}</div>`;
}

function provaDe(q){
  return provas.find(p=>p.id===q.provaId);
}

function nomeProva(p){
  if(!p)return "Prova";
  const ano=String(p.ano||"");
  return p.nome+(ano&&!p.nome.includes(ano)?" "+ano:"");
}

function tituloQ(q){
  return nomeProva(provaDe(q))+" — Q"+q.numero;
}

function labelStatus(s){
  return ({
    acertei:"Acertei",
    errei:"Errei",
    nao_fiz:"Não fiz",
    anulada:"Anulada",
    a_conferir:"A conferir"
  })[s]||"A conferir";
}

function badge(q){
  const s=q.situacao;
  const classe=s==="acertei"?"good":
    s==="errei"?"bad":
    ["anulada","a_conferir"].includes(s)?"warn":"";
  return `<span class="tag ${classe}">${labelStatus(s)}</span>`;
}

function desempenho(lista){
  const feitas=lista.filter(q=>["acertei","errei"].includes(q.situacao));
  const acertos=feitas.filter(q=>q.situacao==="acertei").length;
  return {
    total:lista.length,
    feitas:feitas.length,
    acertos,
    erros:feitas.length-acertos,
    nao:lista.filter(q=>q.situacao==="nao_fiz").length,
    anuladas:lista.filter(q=>q.situacao==="anulada").length,
    pendentes:lista.filter(q=>q.situacao==="a_conferir").length,
    indice:feitas.length?acertos/feitas.length*100:null
  };
}

function percentual(n){
  return n===null?"—":n.toFixed(1).replace(".",",")+"%";
}

function metricas(s){
  return `<div class="grid" style="margin-bottom:16px">
    <div class="metric">
      <div class="small">QUESTÕES</div>
      <strong>${s.total}</strong>
    </div>
    <div class="metric">
      <div class="small">QUESTÕES FEITAS</div>
      <strong>${s.feitas}</strong>
    </div>
    <div class="metric">
      <div class="small">ACERTOS / ERROS</div>
      <strong>${s.acertos} / ${s.erros}</strong>
    </div>
    <div class="metric">
      <div class="small">ÍNDICE DE ACERTOS</div>
      <strong>${percentual(s.indice)}</strong>
    </div>
  </div>`;
}

function render(){
  $("nav").innerHTML=tabs.map(([id,label])=>
    `<button class="${tela===id?"active":""}"
      onclick="go('${id}')">${label}</button>`
  ).join("");

  const views={
    inicio:home,
    provas:paginaProvas,
    questoes:paginaQuestoes,
    colecoes:paginaColecoes,
    desempenho:paginaDesempenho,
    backup:paginaBackup
  };

  $("app").innerHTML=views[tela]();
}

function home(){
  return heading(
    "Minha biblioteca",
    "Organize suas provas e estude questões por assunto."
  )+metricas(desempenho(questoes))+`
  <div class="two">
    <div class="card">
      <h2>Minhas provas</h2>
      ${provas.map(p=>`
        <div class="item row between">
          <div>
            <b>${escapeHTML(nomeProva(p))}</b>
            <div class="small">
              ${questoes.filter(q=>q.provaId===p.id).length} questões
            </div>
          </div>
          <button class="btn" onclick="abrirProva('${code(p.id)}')">
            Abrir
          </button>
        </div>
      `).join("")||'<p class="small">Nenhuma prova cadastrada.</p>'}
    </div>

    <div class="card">
      <h2>Acesso rápido</h2>
      <p>Importe uma prova, classifique seus temas e consulte grupos de questões semelhantes.</p>
      <div class="row">
        <button class="btn primary" onclick="go('backup')">Importar prova</button>
        <button class="btn" onclick="go('questoes')">Pesquisar questões</button>
      </div>
    </div>
  </div>`;
}

function paginaProvas(){
  return heading("Provas","Acesse as questões de cada prova em sequência.")+`
  <div class="card">
    ${provas.map(p=>{
      const s=desempenho(questoes.filter(q=>q.provaId===p.id));
      return `<div class="item row between">
        <div>
          <h3>${escapeHTML(nomeProva(p))}</h3>
          <div class="small">
            ${s.total} questões · ${s.feitas} feitas ·
            ${percentual(s.indice)} de acertos
          </div>
        </div>
        <div class="row">
          <button class="btn" onclick="abrirProva('${code(p.id)}')">
            Abrir prova
          </button>
          <button class="btn danger" onclick="excluirProva('${code(p.id)}')">
            Excluir
          </button>
        </div>
      </div>`;
    }).join("")||'<div class="empty">Nenhuma prova importada.</div>'}
  </div>`;
}

function abrirProva(id){
  filtro={
    provas:[decode(id)],
    area:"",tema:"",sub:"",status:"",busca:""
  };
  go("questoes");
}

function opcoes(valores,atual,placeholder="Todos"){
  return `<option value="">${escapeHTML(placeholder)}</option>`+
  [...new Set(valores.filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,"pt-BR"))
    .map(v=>`<option value="${escapeHTML(v)}"
      ${atual===v?"selected":""}>${escapeHTML(v)}</option>`
    ).join("");
}

function filtradas(){
  return questoes.filter(q=>
    (!filtro.provas.length||filtro.provas.includes(q.provaId))&&
    (!filtro.area||q.grande_area===filtro.area)&&
    (!filtro.tema||q.tema_geral===filtro.tema)&&
    (!filtro.sub||q.tema_especifico===filtro.sub)&&
    (!filtro.status||q.situacao===filtro.status)&&
    (!filtro.busca||
      [q.enunciado,q.tema_geral,q.tema_especifico,
      ...Object.values(q.alternativas||{})]
      .join(" ").toLocaleLowerCase("pt-BR")
      .includes(filtro.busca.toLocaleLowerCase("pt-BR"))
    )
  ).sort((a,b)=>
    nomeProva(provaDe(a)).localeCompare(nomeProva(provaDe(b)),"pt-BR")||
    Number(a.numero)-Number(b.numero)
  );
}

function mudarFiltro(campo,valor){
  filtro[campo]=valor;
  if(campo==="area"){filtro.tema="";filtro.sub=""}
  if(campo==="tema")filtro.sub="";
  render();
}

function alternarProva(id,checked){
  const valor=decode(id);
  if(checked&&!filtro.provas.includes(valor))filtro.provas.push(valor);
  if(!checked)filtro.provas=filtro.provas.filter(x=>x!==valor);
  render();
}

function limparFiltros(){
  filtro={provas:[],area:"",tema:"",sub:"",status:"",busca:""};
  render();
}

function linhaQuestao(q){
  return `<div class="item">
    <div class="row between">
      <div class="row">
        <input class="check" type="checkbox"
          ${selecionadas.has(q.id)?"checked":""}
          onchange="selecionar('${code(q.id)}',this.checked)">
        <div>
          <h3>${escapeHTML(tituloQ(q))}</h3>
          <span class="tag">${escapeHTML(q.grande_area||"Sem área")}</span>
          <span class="tag">${escapeHTML(q.tema_geral||"Sem tema")}</span>
          ${q.tema_especifico?
            `<span class="tag">${escapeHTML(q.tema_especifico)}</span>`:""}
          ${badge(q)}
          ${!q.classificacao_aprovada?
            '<span class="tag warn">Classificação sugerida</span>':""}
        </div>
      </div>
      <button class="btn" onclick="abrirQuestao('${code(q.id)}')">
        Abrir
      </button>
    </div>
    <p class="preview">${escapeHTML(q.enunciado)}</p>
  </div>`;
}

function paginaQuestoes(){
  const lista=filtradas();
  const temas=questoes
    .filter(q=>!filtro.area||q.grande_area===filtro.area)
    .map(q=>q.tema_geral);
  const subs=questoes
    .filter(q=>
      (!filtro.area||q.grande_area===filtro.area)&&
      (!filtro.tema||q.tema_geral===filtro.tema)
    ).map(q=>q.tema_especifico);

  return heading(
    "Banco de questões",
    "Combine provas, áreas, temas e desempenho."
  )+`
  <div class="card">
    <label>Selecionar provas</label>
    <div class="proof-options">
      ${provas.map(p=>`
        <label>
          <input type="checkbox"
            ${filtro.provas.includes(p.id)?"checked":""}
            onchange="alternarProva('${code(p.id)}',this.checked)">
          ${escapeHTML(nomeProva(p))}
        </label>
      `).join("")||'<span class="small">Nenhuma prova importada.</span>'}
    </div>

    <div class="filters">
      <div>
        <label>Grande área</label>
        <select onchange="mudarFiltro('area',this.value)">
          ${opcoes([...areas,...questoes.map(q=>q.grande_area)],filtro.area)}
        </select>
      </div>
      <div>
        <label>Tema geral</label>
        <select onchange="mudarFiltro('tema',this.value)">
          ${opcoes(temas,filtro.tema)}
        </select>
      </div>
      <div>
        <label>Subtema</label>
        <select onchange="mudarFiltro('sub',this.value)">
          ${opcoes(subs,filtro.sub)}
        </select>
      </div>
      <div>
        <label>Desempenho</label>
        <select onchange="mudarFiltro('status',this.value)">
          <option value="">Todos</option>
          ${["acertei","errei","nao_fiz","anulada","a_conferir"].map(s=>
            `<option value="${s}" ${filtro.status===s?"selected":""}>
              ${labelStatus(s)}
            </option>`).join("")}
        </select>
      </div>
      <div>
        <label>Pesquisar conteúdo</label>
        <input placeholder="Palavra do enunciado"
          value="${escapeHTML(filtro.busca)}"
          onchange="mudarFiltro('busca',this.value)">
      </div>
    </div>

    <div class="row between" style="margin-top:14px">
      <span class="small">${lista.length} questões encontradas</span>
      <div class="row">
        <button class="btn" onclick="limparFiltros()">Limpar filtros</button>
        <button class="btn" onclick="selecionarResultados()">
          Selecionar resultados
        </button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row between">
      <b>${selecionadas.size} selecionadas</b>
      <div class="row">
        <button class="btn" ${!selecionadas.size?"disabled":""}
          onclick="classificarLote()">Classificar em lote</button>
        <button class="btn" ${!selecionadas.size?"disabled":""}
          onclick="criarColecao()">Criar coleção</button>
        <button class="btn primary" ${!selecionadas.size?"disabled":""}
          onclick="copiarSelecionadas()">Copiar para ChatGPT</button>
      </div>
    </div>
    ${lista.map(linhaQuestao).join("")||
      '<div class="empty">Nenhuma questão encontrada.</div>'}
  </div>`;
}

function selecionar(id,checked){
  const v=decode(id);
  checked?selecionadas.add(v):selecionadas.delete(v);
  render();
}

function selecionarResultados(){
  filtradas().forEach(q=>selecionadas.add(q.id));
  render();
}

// VISUALIZAÇÃO E NAVEGAÇÃO ENTRE QUESTÕES

function liberarImagens(){
  imageURLs.forEach(URL.revokeObjectURL);
  imageURLs=[];
}

function mostrarModal(html){
  $("modalRoot").innerHTML=`
    <div class="modal-bg" onclick="if(event.target===this)fecharModal()">
      <div class="modal">${html}</div>
    </div>`;
}

function fecharModal(){
  liberarImagens();
  $("modalRoot").innerHTML="";
  aberta=null;
}

function urlImagem(blob){

async function salvarQuestao(direcao=0){
  const q=questoes.find(x=>x.id===aberta);
  if(!q)return;

  const id=q.id;
  const pos=navIds.indexOf(id);

  const atualizada={
    ...q,
    grande_area:$("edArea").value,
    tema_geral:txt($("edTema").value),
    tema_especifico:txt($("edSub").value),
    situacao:$("edStatus").value,
    minha_resposta:txt($("edMinha").value),
    gabarito:txt($("edGab").value),
    comentario:$("edNotas").value,
    classificacao_aprovada:true
  };

  await put("questoes",atualizada);
  await refresh(false);
  render();

  const alvo=navIds[pos+direcao]||id;
  abrirQuestao(code(alvo),true);
}

async function aplicarLote(){

  const tema=txt($("lTema").value);
  const sub=txt($("lSub").value);
  const status=$("lStatus").value;

  for(const q of questoes.filter(x=>selecionadas.has(x.id))){

function agrupar(lista,campo){
  const grupos=new Map();

  for(const q of lista){
    const nome=q[campo]||"Sem classificação";
    if(!grupos.has(nome))grupos.set(nome,[]);
    grupos.get(nome).push(q);
  }

  return [...grupos].map(([nome,qs])=>({
    nome,...desempenho(qs)
  })).sort((a,b)=>b.feitas-a.feitas);
}

function grafico(grupos){
  return grupos.map(g=>`
    <div class="chart-row">
      <div>
        <b>${escapeHTML(g.nome)}</b>

      <div class="bar">
        <div class="fill" style="width:${g.indice||0}%"></div>
      </div>
      <b>${percentual(g.indice)}</b>

  `).join("")||'<div class="empty">Sem dados.</div>';
}

function baixar(blob,nome){
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;
  link.download=nome;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

function exportarCSV(){
  const lista=questoes.filter(q=>
    !relatorioProva||q.provaId===relatorioProva
  );

  const linhas=[[
    "Nível","Assunto","Total","Feitas","Acertos",
    "Erros","Não fiz","Anuladas","A conferir","Índice"
  ]];

  for(const [campo,nivel] of [
    ["grande_area","Grande área"],
    ["tema_geral","Tema geral"],
    ["tema_especifico","Subtema"]
  ]){
    for(const g of agrupar(lista,campo)){
      linhas.push([
        nivel,g.nome,g.total,g.feitas,g.acertos,g.erros,
        g.nao,g.anuladas,g.pendentes,percentual(g.indice)
      ]);
    }
  }

  const csv="\ufeff"+linhas.map(l=>
    l.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")
  ).join("\n");

  baixar(
    new Blob([csv],{type:"text/csv;charset=utf-8"}),
    "MEUBANCO-RELATORIO.csv"
  );
}

function normalizarProva(p){
  const nome=txt(p.nome||p.prova||"Prova");
  const ano=p.ano||"";
  const id=txt(p.id)||"prova-"+nome.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-")+"-"+ano;
  return {id,nome,ano};
}

function normalizarSubtema(v){
  const original=txt(v);
  const s=original.normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase();

  if(!s)return "";

  if(/(^|\b)(dm|diabetes)(\b|$)/.test(s))
    return "Diabetes mellitus";

  if(/(^|\b)(has|hipertensao arterial)(\b|$)/.test(s))
    return "Hipertensão arterial";

  if(s.includes("endocardite"))
    return "Endocardite infecciosa";

  if(s.includes("anatomia pelvica")||
     s.includes("vascularizacao pelvica")||
     s.includes("pelvimetria")||
     s.includes("nervo pudendo"))
    return "Anatomia pélvica";

  return original;
}

function normalizarQuestao(q,p){
  let status=txt(q.situacao).toLowerCase();

  if(!["acertei","errei","nao_fiz","anulada","a_conferir"].includes(status)){
    status="a_conferir";
  }

  return {
    id:txt(q.id)||p.id+"-q"+(q.numero||q.questao),
    provaId:p.id,
    numero:q.numero||q.questao||0,
    enunciado:String(q.enunciado||q.texto||""),
    alternativas:q.alternativas||{},
    grande_area:txt(q.grande_area||q.area),
    tema_geral:txt(q.tema_geral||q.tema),
    tema_especifico:normalizarSubtema(q.tema_especifico||q.subtema),
    classificacao_aprovada:!!q.classificacao_aprovada,
    situacao:status,
    gabarito:txt(q.gabarito),
    minha_resposta:txt(q.minha_resposta),
    comentario:"",
    imagens:Array.isArray(q.imagens)?q.imagens:[]
  };
}

async function importarRegistros(ps,qs,imgs){
  const duplicadas=qs.filter(q=>questoes.some(x=>x.id===q.id));

  let substituir=false;
  if(duplicadas.length){
    substituir=confirm(
      duplicadas.length+" questões já existem.\n"+
      "OK: substituir os registros existentes.\n"+
      "Cancelar: preservar as questões existentes."
    );
  }

  const permitidas=qs.filter(q=>
    substituir||!duplicadas.some(x=>x.id===q.id)
  );

  for(const p of ps)await put("provas",p);

  const caminhos=new Set(permitidas.flatMap(q=>q.imagens||[]));

  for(const im of imgs){
    if(caminhos.has(im.id))await put("imagens",im);
  }

  for(const q of permitidas){
    await put("questoes",q);
  }

  await refresh();
  aviso(permitidas.length+" questões importadas ou atualizadas.");
}

async function importarJSON(data,nome){
  if(data.tipo==="MEUBANCO_BACKUP_V3"||
     Array.isArray(data.provas)&&Array.isArray(data.questoes)){
    await restaurar(data);
    return;
  }

  const lista=data.questoes||data.questions;
  if(!Array.isArray(lista))throw Error("Arquivo sem questões.");

  const p=normalizarProva(data.prova||{
    nome:data.nome||nome.replace(/\.json$/i,""),
    ano:data.ano||""
  });

  await importarRegistros(
    [p],
    lista.map(q=>normalizarQuestao(q,p)),
    []
  );
}

async function importarZIP(file){
  if(typeof JSZip==="undefined")
    throw Error("Biblioteca ZIP indisponível. Conecte-se à internet.");

  const zip=await JSZip.loadAsync(file);
  const entrada=zip.file("manifest.json")||zip.file("backup.json");

  if(!entrada)throw Error("Arquivo manifest.json ou backup.json não encontrado.");

  const data=JSON.parse(await entrada.async("string"));

  if(data.tipo==="MEUBANCO_BACKUP_V3"){
    await restaurar(data,zip);
    return;
  }

  if(!Array.isArray(data.questoes))
    throw Error("O ZIP não contém lista de questões.");

  const p=normalizarProva(data.prova||{nome:file.name,ano:""});
  const lista=data.questoes.map(q=>normalizarQuestao(q,p));
  const imgs=[];

  for(const q of lista){
    const ids=[];
    for(const caminho of q.imagens){
      if(typeof caminho!=="string"||
         caminho.startsWith("/")||
         caminho.includes(".."))continue;

      const f=zip.file(caminho);
      if(!f)continue;

      const id=p.id+"::"+caminho;
      imgs.push({
        id,
        provaId:p.id,
        caminho,
        blob:await f.async("blob")
      });
      ids.push(id);
    }
    q.imagens=ids;
  }

  await importarRegistros([p],lista,imgs);
}

async function exportarBackup(){
  if(typeof JSZip==="undefined"){
    aviso("Biblioteca ZIP indisponível.");
    return;
  }

  const zip=new JSZip();
  const meta=[];

  for(const im of imagens){
    let ext=(im.caminho||"imagem.png").split(".").pop().toLowerCase();
    if(!/^(jpg|jpeg|png|gif|webp|svg)$/.test(ext))ext="png";

    const path="imagens/"+im.id.replace(/[^\w-]/g,"_")+"."+ext;
    zip.file(path,im.blob);

    meta.push({
      id:im.id,
      provaId:im.provaId,
      caminho:im.caminho,
      arquivo:path
    });
  }

  zip.file("backup.json",JSON.stringify({
    tipo:"MEUBANCO_BACKUP_V3",
    versao:3,
    provas,
    questoes,
    colecoes,
    imagens:meta,
    criado:new Date().toISOString()
  },null,2));

  const blob=await zip.generateAsync({
    type:"blob",
    compression:"DEFLATE"
  });

  baixar(
    blob,
    "MEUBANCO-BACKUP-"+new Date().toISOString().slice(0,10)+".zip"
  );
}

async function restaurar(data,zip){
  if(!Array.isArray(data.questoes))
    throw Error("Backup inválido.");

  const imgs=[];

  if(zip){
    for(const im of data.imagens||[]){
      const f=zip.file(im.arquivo);
      if(f)imgs.push({
        id:im.id,
        provaId:im.provaId,
        caminho:im.caminho,
        blob:await f.async("blob")
      });
    }
  }

  // Preserva informações pessoais e classificações do backup.
  const lista=data.questoes.map(q=>({
    ...q,
    comentario:q.comentario||"",
    imagens:Array.isArray(q.imagens)?q.imagens:[]
  }));

  await importarRegistros(data.provas||[],lista,imgs);

  for(const c of data.colecoes||[]){
    await put("colecoes",c);
  }

  await refresh();
}

async function excluirProva(id){
  const v=decode(id);

  if(!confirm("Excluir esta prova e todas as suas questões?"))return;

  const ids=questoes.filter(q=>q.provaId===v).map(q=>q.id);
  const conjunto=new Set(ids);

  for(const qid of ids)await remove("questoes",qid);

  for(const im of imagens.filter(x=>x.provaId===v)){
    await remove("imagens",im.id);
  }

  for(const c of colecoes){
    c.ids=c.ids.filter(id=>!conjunto.has(id));
    await put("colecoes",c);
  }

  await remove("provas",v);
  await refresh();
}

async function apagarTudo(){
  if(prompt("Digite APAGAR para excluir todos os dados:")!=="APAGAR")return;

  for(const t of ["provas","questoes","imagens","colecoes"]){
    await wipe(t);
  }

  await refresh();
}

$("fileInput").addEventListener("change",async e=>{
  const files=[...e.target.files];
  e.target.value="";

  for(const file of files){
    try{
      if(/\.zip$/i.test(file.name)){
        await importarZIP(file);
      }else if(/\.json$/i.test(file.name)){
        await importarJSON(JSON.parse(await file.text()),file.name);
      }else{
        throw Error("Formato incompatível.");
      }
    }catch(err){
      console.error(err);
      aviso("Erro na importação: "+err.message);
    }
  }
});

(async()=>{
  try{
    db=await openDB();
    await refresh();
  }catch(err){
    console.error(err);
    $("app").innerHTML=`
      <h2>Não foi possível acessar o banco local.</h2>
      <p>Abra o aplicativo pelo GitHub Pages em HTTPS, fora do modo privado.</p>`;
  }
})();
