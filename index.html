 
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7f9">
<title>MEUBANCO</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{--bg:#f5f7f9;--ink:#253343;--muted:#778596;--line:#e0e6ec;--blue:#285f79;--soft:#edf4f7;--red:#b54848;--green:#207a57}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
header{background:white;border-bottom:1px solid var(--line);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{font-size:21px;font-weight:800;letter-spacing:.4px}
.logo small{display:block;font-size:11px;color:var(--muted);font-weight:400}
nav{display:flex;gap:5px;overflow:auto}
nav button{border:0;background:transparent;color:var(--muted);padding:10px;border-radius:9px;white-space:nowrap}
nav button.active{background:var(--soft);color:var(--blue);font-weight:700}
main{max-width:1250px;margin:auto;padding:24px 17px 80px}
h1{font-size:26px;margin:0 0 5px}
h2{font-size:19px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 5px}
p{line-height:1.65}
.small,.sub{font-size:12px;color:var(--muted)}
.sub{margin-bottom:22px}
.card,.metric{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.metric strong{display:block;font-size:28px;margin:5px 0}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{background:white;border:1px solid var(--line);border-radius:9px;padding:11px 14px;color:var(--ink);font-size:13px;font-weight:650}
.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}
.btn.danger{color:var(--red)}
label{display:block;color:var(--muted);font-size:12px;font-weight:650;margin-bottom:6px}
input:not([type=checkbox]),select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;background:white;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.field{margin-bottom:13px}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.item{padding:15px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.preview{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;background:#f0f3f6;border-radius:20px;padding:5px 9px;font-size:11px;margin:3px}
.good{background:#e7f5ed;color:var(--green)}
.bad{background:#ffeded;color:var(--red)}
.warn{background:#fff2d7;color:#91641a}
.check{width:19px;height:19px;accent-color:var(--blue)}
.choices{display:flex;flex-wrap:wrap;gap:7px;max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px}
.choice{display:flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--line);border-radius:20px;color:var(--ink);font-weight:500;margin:0}
.choice input{accent-color:var(--blue)}
.modal-bg{position:fixed;inset:0;background:#17263791;z-index:20;display:flex;align-items:center;justify-content:center;padding:10px}
.modal{background:white;width:min(100%,1120px);max-height:96dvh;overflow:auto;border-radius:16px;padding:20px}
.modal-head{position:sticky;top:-20px;background:white;z-index:3;border-bottom:1px solid var(--line);padding:5px 0 12px;margin-bottom:15px}
.modal-foot{position:sticky;bottom:-20px;z-index:3;background:white;border-top:1px solid var(--line);padding:13px 0 5px;margin-top:16px}
.question{white-space:pre-wrap;font-size:15px;line-height:1.75}
.alternative{border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;white-space:pre-wrap}
.qimage{display:block;max-width:100%;max-height:440px;object-fit:contain;margin:12px 0}
.notice{background:var(--soft);border-radius:10px;padding:13px;color:#45687b;font-size:13px;white-space:pre-line}
.empty{text-align:center;padding:38px;color:var(--muted)}
.chartrow{display:grid;grid-template-columns:minmax(115px,1.3fr) minmax(70px,2fr) 65px;gap:10px;align-items:center;margin:13px 0;font-size:12px}
.bar{height:11px;background:#edf1f4;border-radius:12px;overflow:hidden}
.fill{height:100%;background:#438ca5}
.step{border-left:3px solid #a5cbdc;padding-left:18px}
.stepnumber{font-weight:800;color:var(--blue);font-size:11px;letter-spacing:.06em}
.hero{background:#fbfdff;border-color:#c3dbe6}
@media(max-width:850px){header{display:block;padding:13px}nav{margin-top:10px}.grid,.two,.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.modal{padding:14px}.modal-head{top:-14px}.modal-foot{bottom:-14px}}
@media(max-width:550px){main{padding:16px 11px}.grid,.two,.filters{grid-template-columns:1fr}.modal-bg{padding:4px}.modal{max-height:98dvh}.chartrow{grid-template-columns:100px 1fr 55px}}
</style>
</head>
<body>

<header>
<div class="logo">MEUBANCO<small>Banco pessoal de questões</small></div>
<nav id="nav"></nav>
</header>
<main id="app"></main>
<div id="modalRoot"></div>
<input type="file" id="fileInput" accept=".zip,.json" multiple hidden>

<script>
"use strict";

const $=id=>document.getElementById(id);
const clean=v=>String(v??"").trim();
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
})[c]);
const enc=v=>encodeURIComponent(String(v));
const dec=v=>decodeURIComponent(v);
const uid=()=>crypto.randomUUID();

const AREAS=[
"Clínica Médica",
"Cirurgia Geral",
"Ginecologia e Obstetrícia",
"Pediatria",
"Medicina Preventiva",
"Outras"
];

const STATES=["acertei","errei","nao_fiz","anulada","a_conferir"];
const TABS=[
["inicio","Início"],
["provas","Provas"],
["questoes","Questões"],
["colecoes","Coleções"],
["desempenho","Desempenho"],
["backup","Importar nova prova / Backup"]
];

let db;
let provas=[];
let questoes=[];
let colecoes=[];
let imagens=[];
let page="inicio";
let current=null;
let navigation=[];
let imageURLs=[];
let selected=new Set();

let filter={
provas:[],area:"",tema:"",subs:[],status:"",busca:""
};

let report={
provas:[],area:"",tema:"",subs:[],detail:"",view:"macro"
};

/* ARMAZENAMENTO */

function openDB(){
return new Promise((resolve,reject)=>{
const r=indexedDB.open("MEUBANCO_V3",1);
r.onupgradeneeded=()=>{
for(const name of ["provas","questoes","colecoes","imagens"]){
if(!r.result.objectStoreNames.contains(name)){
r.result.createObjectStore(name,{keyPath:"id"});
}
}
};
r.onsuccess=()=>resolve(r.result);
r.onerror=()=>reject(r.error);
});
}

function getAll(table){
return new Promise((resolve,reject)=>{
const r=db.transaction(table).objectStore(table).getAll();
r.onsuccess=()=>resolve(r.result);
r.onerror=()=>reject(r.error);
});
}

function put(table,item){
return new Promise((resolve,reject)=>{
const tx=db.transaction(table,"readwrite");
tx.objectStore(table).put(item);
tx.oncomplete=resolve;
tx.onerror=()=>reject(tx.error);
});
}

function remove(table,id){
return new Promise((resolve,reject)=>{
const tx=db.transaction(table,"readwrite");
tx.objectStore(table).delete(id);
tx.oncomplete=resolve;
tx.onerror=()=>reject(tx.error);
});
}

function wipe(table){
return new Promise((resolve,reject)=>{
const tx=db.transaction(table,"readwrite");
tx.objectStore(table).clear();
tx.oncomplete=resolve;
tx.onerror=()=>reject(tx.error);
});
}

async function reload(draw=true){
[provas,questoes,colecoes,imagens]=await Promise.all(
["provas","questoes","colecoes","imagens"].map(getAll)
);
if(draw)render();
}

function go(p){
page=p;
selected.clear();
render();
window.scrollTo(0,0);
}

function heading(title,subtitle){
return `<h1>${esc(title)}</h1><div class="sub">${esc(subtitle)}</div>`;
}

function proof(q){
return provas.find(p=>p.id===q.provaId);
}

function proofName(p){
if(!p)return "Prova";
const name=String(p.nome||"Prova");
return name+(!p.ano||name.includes(String(p.ano))?"":" "+p.ano);
}

const titleQ=q=>proofName(proof(q))+" — Q"+q.numero;

function statusName(s){
return ({
acertei:"Acertei",
errei:"Errei",
nao_fiz:"Não fiz",
anulada:"Anulada",
a_conferir:"A conferir"
})[s]||"A conferir";
}

/* ACERTOS AUTOMÁTICOS */

function validAnswer(value){
const v=clean(value).toUpperCase();
return /^[A-E]$/.test(v)?v:"";
}

function isAnnulled(value){
return /\bANULAD[AO]\b/i.test(clean(value));
}

function calculateStatus(answer,key,empty="a_conferir"){
if(isAnnulled(key))return "anulada";

const a=validAnswer(answer);
const g=validAnswer(key);

if(a&&g)return a===g?"acertei":"errei";

if(!a&&empty==="nao_fiz")return "nao_fiz";
return "a_conferir";
}

function updateCalculated(){
const a=$("edAnswer");
const g=$("edKey");
const result=$("calculatedResult");
const manual=$("edManual");

if(!a||!g||!result)return;

const value=calculateStatus(a.value,g.value);
result.textContent="Resultado automático: "+statusName(value)+
(manual?.value!=="automatico"?" · Correção manual ativa":"");
}

/* ESTATÍSTICAS */

function stats(list){
const made=list.filter(q=>
q.situacao==="acertei"||q.situacao==="errei"
);
const right=made.filter(q=>q.situacao==="acertei").length;
return {
total:list.length,
made:made.length,
right,
wrong:made.length-right,
nao:list.filter(q=>q.situacao==="nao_fiz").length,
annulled:list.filter(q=>q.situacao==="anulada").length,
pending:list.filter(q=>q.situacao==="a_conferir").length,
rate:made.length?right/made.length*100:null
};
}

const pct=n=>n===null?"—":n.toFixed(1).replace(".",",")+"%";

function metrics(s){
return `<div class="grid" style="margin-bottom:16px">
<div class="metric"><div class="small">QUESTÕES</div><strong>${s.total}</strong></div>
<div class="metric"><div class="small">FEITAS</div><strong>${s.made}</strong></div>
<div class="metric"><div class="small">ACERTOS / ERROS</div><strong>${s.right} / ${s.wrong}</strong></div>
<div class="metric"><div class="small">ÍNDICE DE ACERTOS</div><strong>${pct(s.rate)}</strong></div>
</div>`;
}

function options(values,current,placeholder="Todos"){
return `<option value="">${esc(placeholder)}</option>`+
[...new Set(values.filter(Boolean))]
.sort((a,b)=>a.localeCompare(b,"pt-BR"))
.map(v=>`<option value="${esc(v)}" ${current===v?"selected":""}>${esc(v)}</option>`)
.join("");
}

function render(){
$("nav").innerHTML=TABS.map(([id,name])=>
`<button class="${page===id?"active":""}" onclick="go('${id}')">${name}</button>`
).join("");

$("app").innerHTML=({
inicio:home,
provas:proofPage,
questoes:questionPage,
colecoes:collectionPage,
desempenho:performancePage,
backup:backupPage
})[page]();
}

/* INÍCIO */

function home(){
return heading(
"Minha biblioteca",
"Suas provas e questões organizadas por assunto."
)+metrics(stats(questoes))+`
<div class="two">
<div class="card">
<h2>Minhas provas</h2>
${provas.map(p=>`
<div class="item row between">
<div>
<b>${esc(proofName(p))}</b>
<div class="small">${questoes.filter(q=>q.provaId===p.id).length} questões</div>
</div>
<button class="btn" onclick="openProof('${enc(p.id)}')">Abrir</button>
</div>`).join("")||'<p class="small">Nenhuma prova importada.</p>'}
</div>
<div class="card">
<h2>Importar nova prova</h2>
<p>Envie seu PDF ao ChatGPT e importe o ZIP com as questões, respostas e gabaritos.</p>
<button class="btn primary" onclick="go('backup')">
Importar nova prova →
</button>
</div>
</div>`;
}

/* PROVAS */

function proofPage(){
return heading("Provas","Acesse suas questões por prova.")+
`<div class="card">
${provas.map(p=>{
const s=stats(questoes.filter(q=>q.provaId===p.id));
return `<div class="item row between">
<div>
<h3>${esc(proofName(p))}</h3>
<div class="small">${s.total} questões · ${s.made} feitas · ${pct(s.rate)} de acertos</div>
</div>
<div class="row">
<button class="btn" onclick="openProof('${enc(p.id)}')">Abrir</button>
<button class="btn danger" onclick="deleteProof('${enc(p.id)}')">Excluir</button>
</div>
</div>`;
}).join("")||'<div class="empty">Nenhuma prova importada.</div>'}
</div>`;
}

function openProof(id){
filter={provas:[dec(id)],area:"",tema:"",subs:[],status:"",busca:""};
go("questoes");
}

/* FILTROS DE QUESTÕES */

function filtered(){
return questoes.filter(q=>{
const content=[
q.enunciado,q.tema_geral,q.tema_especifico,
q.descricao_detalhada,...Object.values(q.alternativas||{})
].join(" ").toLowerCase();

return (!filter.provas.length||filter.provas.includes(q.provaId))&&
(!filter.area||q.grande_area===filter.area)&&
(!filter.tema||q.tema_geral===filter.tema)&&
(!filter.subs.length||filter.subs.includes(q.tema_especifico))&&
(!filter.status||q.situacao===filter.status)&&
(!filter.busca||content.includes(filter.busca.toLowerCase()));
}).sort((a,b)=>
proofName(proof(a)).localeCompare(proofName(proof(b)),"pt-BR")||
Number(a.numero)-Number(b.numero));
}

function changeFilter(key,value){
filter[key]=value;
if(key==="area"){filter.tema="";filter.subs=[]}
if(key==="tema")filter.subs=[];
render();
}

function toggleProofFilter(id,on){
const v=dec(id);
filter.provas=on?
[...new Set([...filter.provas,v])]:
filter.provas.filter(x=>x!==v);
render();
}

function toggleSub(id,on){
const v=dec(id);
filter.subs=on?
[...new Set([...filter.subs,v])]:
filter.subs.filter(x=>x!==v);
render();
}

function clearFilters(){
filter={provas:[],area:"",tema:"",subs:[],status:"",busca:""};
render();
}

function tag(q){
const color=q.situacao==="acertei"?"good":
q.situacao==="errei"?"bad":"warn";
return `<span class="tag ${color}">${statusName(q.situacao)}</span>`;
}

function questionRow(q){
return `<div class="item">
<div class="row between">
<div class="row">
<input type="checkbox" class="check"
${selected.has(q.id)?"checked":""}
onchange="toggleSelected('${enc(q.id)}',this.checked)">
<div>
<h3>${esc(titleQ(q))}</h3>
<span class="tag">${esc(q.grande_area||"Sem área")}</span>
<span class="tag">${esc(q.tema_geral||"Sem tema")}</span>
<span class="tag">${esc(q.tema_especifico||"Sem subtema")}</span>
${tag(q)}
${q.classificacao_aprovada?"":'<span class="tag warn">Tema sugerido</span>'}
</div>
</div>
<button class="btn" onclick="openQuestion('${enc(q.id)}')">Abrir</button>
</div>
<p class="preview">${esc(q.enunciado)}</p>
${q.descricao_detalhada?`<div class="small">Descrição: ${esc(q.descricao_detalhada)}</div>`:""}
</div>`;
}

function questionPage(){
const list=filtered();

const base=questoes.filter(q=>
!filter.provas.length||filter.provas.includes(q.provaId));

const themes=base.filter(q=>
!filter.area||q.grande_area===filter.area)
.map(q=>q.tema_geral);

const subs=[...new Set(base.filter(q=>
(!filter.area||q.grande_area===filter.area)&&
(!filter.tema||q.tema_geral===filter.tema))
.map(q=>q.tema_especifico).filter(Boolean))]
.sort((a,b)=>a.localeCompare(b,"pt-BR"));

return heading("Banco de questões","Combine provas, áreas e vários subtemas.")+`
<div class="card">

<div class="field">
<label>Selecionar provas (sem marcação = todas)</label>
<div class="choices">
${provas.map(p=>`<label class="choice">
<input type="checkbox"
${filter.provas.includes(p.id)?"checked":""}
onchange="toggleProofFilter('${enc(p.id)}',this.checked)">
${esc(proofName(p))}
</label>`).join("")||'<span class="small">Nenhuma prova disponível.</span>'}
</div>
</div>

<div class="filters">
<div><label>Grande área</label>
<select onchange="changeFilter('area',this.value)">
${options([...AREAS,...questoes.map(q=>q.grande_area)],filter.area)}
</select></div>

<div><label>Tema geral</label>
<select onchange="changeFilter('tema',this.value)">
${options(themes,filter.tema)}
</select></div>

<div><label>Desempenho</label>
<select onchange="changeFilter('status',this.value)">
<option value="">Todos</option>
${STATES.map(s=>`<option value="${s}" ${filter.status===s?"selected":""}>${statusName(s)}</option>`).join("")}
</select></div>

<div><label>Pesquisar conteúdo</label>
<input value="${esc(filter.busca)}" placeholder="Palavra-chave"
onchange="changeFilter('busca',this.value)">
</div>
</div>

<div class="field">
<label>Subtemas — marque quantos quiser</label>
<div class="choices">
${subs.map(s=>`<label class="choice">
<input type="checkbox" ${filter.subs.includes(s)?"checked":""}
onchange="toggleSub('${enc(s)}',this.checked)">
${esc(s)}
</label>`).join("")||'<span class="small">Nenhum subtema.</span>'}
</div>
</div>

<div class="row between">
<span class="small">${list.length} questões encontradas</span>
<div class="row">
<button class="btn" onclick="clearFilters()">Limpar filtros</button>
<button class="btn" onclick="selectResults()">Selecionar resultados</button>
</div>
</div>
</div>

<div class="card">
<div class="row between">
<b>${selected.size} selecionadas</b>
<div class="row">
<button class="btn" ${selected.size?"":"disabled"} onclick="batchEditor()">Classificar em lote</button>
<button class="btn" ${selected.size?"":"disabled"} onclick="makeCollection()">Criar coleção</button>
<button class="btn primary" ${selected.size?"":"disabled"} onclick="copyStudy([...selected])">Copiar para ChatGPT</button>
</div>
</div>
${list.map(questionRow).join("")||'<div class="empty">Nenhuma questão encontrada.</div>'}
</div>`;
}

function toggleSelected(id,on){
const v=dec(id);
on?selected.add(v):selected.delete(v);
render();
}

function selectResults(){
filtered().forEach(q=>selected.add(q.id));
render();
}

/* JANELA DE QUESTÃO */

function releaseImages(){
imageURLs.forEach(URL.revokeObjectURL);
imageURLs=[];
}

function imageURL(blob){
const url=URL.createObjectURL(blob);
imageURLs.push(url);
return url;
}

function showModal(html){
$("modalRoot").innerHTML=`
<div class="modal-bg" onclick="if(event.target===this)closeModal()">
<div class="modal">${html}</div>
</div>`;
}

function closeModal(){
releaseImages();
$("modalRoot").innerHTML="";
current=null;
}

function openQuestion(id,keepNavigation=false){
const q=questoes.find(x=>x.id===dec(id));
if(!q)return;

if(!keepNavigation)navigation=filtered().map(x=>x.id);
if(!navigation.includes(q.id))navigation=[q.id];

current=q.id;
const position=navigation.indexOf(q.id);
releaseImages();

const alternatives=Object.entries(q.alternativas||{})
.map(([letter,value])=>`<div class="alternative">
<b>${esc(letter)})</b> ${esc(value)}
</div>`).join("");

const pictures=(q.imagens||[]).map(id=>{
const im=imagens.find(x=>x.id===id);
return im?`<img class="qimage" alt="Imagem da questão" src="${imageURL(im.blob)}">`:"";
}).join("");

const themes=[...new Set(questoes.map(x=>x.tema_geral).filter(Boolean))];
const subs=[...new Set(questoes.map(x=>x.tema_especifico).filter(Boolean))];

showModal(`
<div class="modal-head row between">
<div>
<h2 style="margin:0">${esc(titleQ(q))}</h2>
<div class="small">Questão ${position+1} de ${navigation.length}</div>
</div>
<button class="btn" onclick="closeModal()">Fechar ×</button>
</div>

<div class="two">
<section>
<div class="question">${esc(q.enunciado)}</div>
${alternatives}
${pictures}
<div class="notice">
Gabarito: <b>${esc(q.gabarito||"Não informado")}</b> ·
Sua resposta: <b>${esc(q.minha_resposta||"Não informada")}</b>
</div>
</section>

<section>
<div class="card">
<h2>Classificação e desempenho</h2>

<div class="field">
<label>Grande área</label>
<select id="edArea">
${options([...AREAS,...questoes.map(x=>x.grande_area)],q.grande_area,"Selecionar")}
</select>
</div>

<div class="field">
<label>Tema geral</label>
<input id="edTheme" list="themeList" value="${esc(q.tema_geral)}">
<datalist id="themeList">
${themes.map(t=>`<option value="${esc(t)}">`).join("")}
</datalist>
</div>

<div class="field">
<label>Subtema amplo</label>
<input id="edSub" list="subList" value="${esc(q.tema_especifico)}">
<datalist id="subList">
${subs.map(s=>`<option value="${esc(s)}">`).join("")}
</datalist>
</div>

<div class="field">
<label>Descrição detalhada</label>

async function saveQuestion(direction=0){
const q=questoes.find(x=>x.id===current);
if(!q)return;

const position=navigation.indexOf(q.id);
const answer=clean($("edAnswer").value).toUpperCase();
const key=clean($("edKey").value).toUpperCase();
const manual=$("edManual").value;

const status=manual==="automatico"?
calculateStatus(answer,key,q.situacao):manual;

const imageIds=[...document.querySelectorAll(".keepImage:checked")]
.map(x=>x.value);

const updated={
...q,
grande_area:$("edArea").value,
tema_geral:clean($("edTheme").value),
tema_especifico:clean($("edSub").value),
descricao_detalhada:clean($("edDetail").value),
minha_resposta:answer,
gabarito:key,
situacao:status,
situacao_manual:manual!=="automatico",
imagens:imageIds,
comentario:$("edNotes").value,
classificacao_aprovada:true
};

await put("questoes",updated);
await reload(false);
render();

const next=navigation[position+direction]||q.id;
openQuestion(enc(next),true);
}

async function applyBatch(){
const area=$("bArea").value;
const theme=clean($("bTheme").value);
const sub=clean($("bSub").value);
const detail=clean($("bDetail").value);
const status=$("bStatus").value;

for(const q of questoes.filter(q=>selected.has(q.id))){
if(area)q.grande_area=area;
if(theme)q.tema_geral=theme;
if(sub)q.tema_especifico=sub;

q.situacao=status;
q.situacao_manual=true;
}
q.classificacao_aprovada=true;
await put("questoes",q);
}

selected.clear();
closeModal();
await reload();
}

function reportList(){

(!report.tema||q.tema_geral===report.tema)&&

);

function changeReport(key,value){

function toggleReportProof(id,on){

report.provas.filter(x=>x!==v);
render();

function toggleReportSub(id,on){
const v=dec(id);
report.subs=on?[...new Set([...report.subs,v])]:
report.subs.filter(x=>x!==v);
report.detail="";
render();
}

report={provas:[],area:"",tema:"",subs:[],detail:"",view:"macro"};

function grouped(list,field){
const groups=new Map();
for(const q of list){
const key=q[field]||"Sem classificação";
if(!groups.has(key))groups.set(key,[]);
groups.get(key).push(q);
}
return [...groups].map(([name,items])=>({
name,...stats(items)
})).sort((a,b)=>b.made-a.made);
}

function download(blob,name){
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download=name;
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(()=>URL.revokeObjectURL(url),60000);
}

function exportCSV(){
const list=reportList();
const rows=[["Nível","Assunto","Total","Feitas","Acertos","Erros","Índice"]];

for(const [field,label] of [
["grande_area","Grande área"],
["tema_geral","Tema geral"],
["tema_especifico","Subtema"],
["descricao_detalhada","Descrição detalhada"]
]){
for(const g of grouped(list,field)){
rows.push([label,g.name,g.total,g.made,g.right,g.wrong,pct(g.rate)]);
}
}

const csv="\ufeff"+rows.map(row=>
row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")
).join("\n");

download(
new Blob([csv],{type:"text/csv;charset=utf-8"}),
"MEUBANCO-RELATORIO.csv"
);
}

/* PROMPT PREPARADOR */

function zipPrompt(){
return `Quero importar uma prova de residência médica em PDF para o aplicativo MEUBANCO.

INICIE SUA RESPOSTA ASSIM:

"Envie aqui o PDF da prova que você deseja adicionar ao MEUBANCO.

Se você já resolveu a prova, envie preferencialmente o PDF com suas respostas marcadas. Se o gabarito oficial estiver em outro arquivo, envie-o também.

Depois que receber o PDF, identificarei a instituição e o ano e confirmarei o nome antes de preparar o ZIP."

AGUARDE O ENVIO DO PDF.

APÓS RECEBER O PDF:

1. Identifique a instituição e o ano.
2. Pergunte: "Identifiquei a prova [NOME] de [ANO]. Posso nomeá-la como [NOME ANO] ou prefere outro nome?"
3. Aguarde a escolha.
4. Use exatamente o nome escolhido em prova.nome.
5. Não repita o ano automaticamente.

LEITURA DAS RESPOSTAS:

Analise as marcações visuais no PDF, inclusive alternativas circuladas, sublinhadas ou destacadas.

Extraia a letra que o usuário marcou em cada questão. Não confunda marcação pessoal com destaque feito no enunciado.

Compare a resposta pessoal com o gabarito oficial.

Registre minha_resposta e gabarito separadamente.

Se ambas forem identificadas e iguais, situacao=acertei.
Se forem diferentes, situacao=errei.
Se o gabarito oficial disser ANULADA, situacao=anulada.
Se houver evidência de resposta não marcada, situacao=nao_fiz.
Se a leitura for incerta, situacao=a_conferir.

NUNCA marque todas as questões como a_conferir quando as respostas pessoais estão identificáveis.

ANTES DE ENTREGAR:
Confira quantas respostas pessoais, gabaritos e anulações foram extraídos.
Se houver respostas ausentes ou duvidosas, informe os números das questões.

IMAGENS:
Transcreva integralmente os enunciados e alternativas como texto.
Inclua SOMENTE imagens clinicamente necessárias, como radiografias, eletrocardiogramas, tabelas, gráficos, esquemas e fotografias clínicas.
Não inclua capturas de páginas repetindo enunciados e alternativas já transcritos.

CLASSIFICAÇÃO:
Use quatro níveis:
grande_area > tema_geral > tema_especifico > descricao_detalhada.

O tema e subtema devem ser amplos e reutilizáveis entre provas.

Exemplos:
Clínica Médica > Hematologia > Anemias hemolíticas > Esferocitose hereditária.
Cirurgia Geral > Trauma > Trauma esplênico > Tratamento não operatório.
Cirurgia Geral > Cuidados perioperatórios > Avaliação pré-operatória > Risco cardiovascular.

Não crie subtemas excessivamente específicos.
Use nomes por extenso, sem abreviações.
Deixe classificacao_aprovada como false.
Deixe comentario vazio.

ESTRUTURA DO ZIP:
Crie manifest.json na raiz, com versao 3, e pasta imagens/.

Exemplo:

{
 "versao":3,
 "prova":{
  "id":"psu-mg-2026",
  "nome":"Nome escolhido pelo usuário",
  "ano":2026
 },
 "questoes":[{
  "id":"psu-mg-2026-q1",
  "numero":1,
  "enunciado":"Texto integral",
  "alternativas":{
   "A":"Texto A",
   "B":"Texto B",
   "C":"Texto C",
   "D":"Texto D"
  },
  "grande_area":"Clínica Médica",
  "tema_geral":"Endocrinologia",
  "tema_especifico":"Diabetes mellitus",
  "descricao_detalhada":"Confirmação diagnóstica",
  "classificacao_aprovada":false,
  "minha_resposta":"D",
  "gabarito":"B",
  "situacao":"errei",
  "comentario":"",
  "imagens":[]
 }]
}

As imagens devem ser referenciadas pelos caminhos relativos dentro do ZIP, por exemplo imagens/ecg_12.png.

Use IDs estáveis e únicos.

Confira se o ZIP contém todas as questões e alternativas, os gabaritos corretos e somente as imagens necessárias.

Entregue o ZIP pronto para importar no MEUBANCO.`;
}

/* NORMALIZAÇÃO DE PROVAS */

function normalizeProof(p){
const name=clean(p.nome||p.prova||"Prova");
const year=p.ano||"";

const id=clean(p.id)||"prova-"+name.toLowerCase()
.normalize("NFD").replace(/[\u0300-\u036f]/g,"")
.replace(/[^a-z0-9]+/g,"-")+"-"+year;

return {id,nome:name,ano:year};
}

function broadSub(value){
const original=clean(value);
const s=original.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"").toLowerCase();

if(s.includes("trauma esplenico"))return "Trauma esplênico";
if(s.includes("anemia")&&s.includes("hemolit"))return "Anemias hemolíticas";
if(s.includes("anemia"))return "Anemias";
if(/\bdiabetes\b|\bdm\b/.test(s))return "Diabetes mellitus";
if(/\bhas\b|hipertensao arterial/.test(s))return "Hipertensão arterial";
if(/anatomia pelvica|vascularizacao pelvica|pelvimetria/.test(s))return "Anatomia pélvica";
if(s.includes("endocardite"))return "Endocardite infecciosa";

return original;
}

function normalizeQuestion(q,p){
const raw=clean(q.tema_especifico||q.subtema);
const broad=broadSub(raw);

const answer=clean(
q.minha_resposta||
q.resposta_marcada||
q.resposta_pessoal||
q.resposta_usuario||
q.marcada
).toUpperCase();

let key=clean(q.gabarito||q.gabarito_oficial).toUpperCase();

if(q.anulada===true||isAnnulled(q.situacao)||isAnnulled(key)){
key="ANULADA";
}

const previousStatus=clean(q.situacao).toLowerCase();
const emptyStatus=previousStatus==="nao_fiz"?"nao_fiz":"a_conferir";

return {
id:clean(q.id)||p.id+"-q"+(q.numero||q.questao),
provaId:p.id,
numero:q.numero||q.questao||0,
enunciado:String(q.enunciado||q.texto||""),
alternativas:q.alternativas||{},
grande_area:clean(q.grande_area||q.area),
tema_geral:clean(q.tema_geral||q.tema),
tema_especifico:broad,
descricao_detalhada:clean(
q.descricao_detalhada||
q.detalhamento||
(raw!==broad?raw:"")
),
classificacao_aprovada:!!q.classificacao_aprovada,
minha_resposta:answer,
gabarito:key,
situacao:calculateStatus(answer,key,emptyStatus),
situacao_manual:false,
comentario:"",
imagens:Array.isArray(q.imagens)?q.imagens:[]
};
}

/* CONFERÊNCIA DO ZIP */

function importSummary(list){
const answers=list.filter(q=>validAnswer(q.minha_resposta)).length;
const keys=list.filter(q=>
validAnswer(q.gabarito)||isAnnulled(q.gabarito)
).length;
const annulled=list.filter(q=>isAnnulled(q.gabarito)).length;
const pending=list.filter(q=>q.situacao==="a_conferir").length;
const missing=list.filter(q=>
validAnswer(q.gabarito)&&!validAnswer(q.minha_resposta)
).map(q=>q.numero);

return {
answers,keys,annulled,pending,missing
};
}

async function importRecords(ps,qs,imgs,collections=[]){
const s=importSummary(qs);

const message=
"CONFERÊNCIA ANTES DA IMPORTAÇÃO\n\n"+
qs.length+" questões\n"+
s.answers+" respostas pessoais identificadas\n"+
s.keys+" gabaritos identificados\n"+
s.annulled+" questões anuladas\n"+
s.pending+" questões a conferir\n\n"+
(s.missing.length?
"Sem resposta pessoal: "+s.missing.slice(0,15).join(", ")+
(s.missing.length>15?"...":"")+"\n\n":"")+
"Se você já resolveu a prova e muitas respostas estão ausentes, cancele e peça ao ChatGPT para refazer o ZIP a partir do PDF marcado.\n\n"+
"Continuar a importação?";

if(!confirm(message))return false;

const existing=new Map(questoes.map(q=>[q.id,q]));
let created=0,updated=0;
const allowedImages=new Set();

for(const p of ps){
if(!provas.some(x=>x.id===p.id))await put("provas",p);
}

for(const incoming of qs){
const old=existing.get(incoming.id);

if(!old){
await put("questoes",incoming);
(incoming.imagens||[]).forEach(id=>allowedImages.add(id));
created++;
continue;
}

const next={...old};

/* PREENCHE LACUNAS, SEM APAGAR RESPOSTAS JÁ GRAVADAS */

if(!validAnswer(next.minha_resposta)&&validAnswer(incoming.minha_resposta)){
next.minha_resposta=incoming.minha_resposta;
}

if(isAnnulled(incoming.gabarito)){
next.gabarito="ANULADA";
}else if(!validAnswer(next.gabarito)&&validAnswer(incoming.gabarito)){
next.gabarito=incoming.gabarito;
}

if(!next.enunciado&&incoming.enunciado){
next.enunciado=incoming.enunciado;
}

if(!Object.keys(next.alternativas||{}).length){
next.alternativas=incoming.alternativas;
}

if(!next.classificacao_aprovada){
for(const field of [
"grande_area","tema_geral",
"tema_especifico","descricao_detalhada"
]){
if(!next[field]&&incoming[field]){
next[field]=incoming[field];
}
}
}

next.imagens=[...new Set([
...(next.imagens||[]),
...(incoming.imagens||[])
])];

if(!next.situacao_manual){
next.situacao=calculateStatus(
next.minha_resposta,
next.gabarito,
next.situacao
);
}

next.imagens.forEach(id=>allowedImages.add(id));

await put("questoes",next);
updated++;
}

for(const image of imgs){
if(allowedImages.has(image.id)&&
!imagens.some(x=>x.id===image.id)){
await put("imagens",image);
}
}

for(const c of collections){
if(!colecoes.some(x=>x.id===c.id)){
await put("colecoes",c);
}
}

await reload();

alert(
created+" questões novas.\n"+
updated+" questões complementadas.\n\n"+
"Respostas identificadas no ZIP: "+s.answers+"/"+qs.length
);

return true;
}

/* IMPORTAÇÃO ZIP / JSON */

async function importJSON(data,name){
if(data.tipo==="MEUBANCO_BACKUP_V3"||
(Array.isArray(data.provas)&&Array.isArray(data.questoes))){
await restore(data);
return;
}

const list=data.questoes||data.questions;
if(!Array.isArray(list))throw Error("JSON sem questões.");

const p=normalizeProof(data.prova||{
nome:data.nome||name.replace(/\.json$/i,""),
ano:data.ano||""
});

await importRecords(
[p],
list.map(q=>normalizeQuestion(q,p)),
[]
);
}

async function importZIP(file){
if(typeof JSZip==="undefined"){
throw Error("Biblioteca ZIP indisponível.");
}

const zip=await JSZip.loadAsync(file);
const manifest=zip.file("manifest.json")||zip.file("backup.json");

if(!manifest){
throw Error("manifest.json ou backup.json não encontrado na raiz.");
}

const data=JSON.parse(await manifest.async("string"));

if(data.tipo==="MEUBANCO_BACKUP_V3"){
await restore(data,zip);
return;
}

if(!Array.isArray(data.questoes)){
throw Error("O ZIP não contém lista de questões.");
}

const p=normalizeProof(data.prova||{nome:file.name,ano:""});
const list=data.questoes.map(q=>normalizeQuestion(q,p));
const imgs=[];

for(const q of list){
const ids=[];

for(const path of q.imagens){
if(typeof path!=="string"||
path.startsWith("/")||path.includes(".."))continue;

const entry=zip.file(path);
if(!entry)continue;

const id=p.id+"::"+path;

imgs.push({
id,provaId:p.id,caminho:path,
blob:await entry.async("blob")
});

ids.push(id);
}

q.imagens=ids;
}

await importRecords([p],list,imgs);
}

/* BACKUP E COMPARTILHAMENTO */

async function makeZIP(personal=true){
if(typeof JSZip==="undefined"){
throw Error("Biblioteca ZIP indisponível.");
}

const zip=new JSZip();
const meta=[];
const usedImageIds=new Set(
questoes.flatMap(q=>q.imagens||[])
);

for(const im of imagens){
if(!usedImageIds.has(im.id))continue;

let ext=(im.caminho||"imagem.png").split(".").pop().toLowerCase();
if(!/^(jpg|jpeg|png|gif|webp|svg)$/.test(ext))ext="png";

const path="imagens/"+im.id.replace(/[^\w-]/g,"_")+"."+ext;
zip.file(path,im.blob);

meta.push({
id:im.id,
provaId:im.provaId,
caminho:im.caminho,
arquivo:path
});
}

const qs=personal?questoes:questoes.map(q=>({
...q,
minha_resposta:"",
situacao:"a_conferir",
situacao_manual:false,
comentario:"",
classificacao_aprovada:false
}));

zip.file("backup.json",JSON.stringify({
tipo:"MEUBANCO_BACKUP_V3",
versao:3,
provas,
questoes:qs,
colecoes:personal?colecoes:[],
imagens:meta,
criado:new Date().toISOString()
},null,2));

return zip.generateAsync({
type:"blob",
compression:"DEFLATE"
});
}

async function exportBackup(){
try{
download(
await makeZIP(true),
"MEUBANCO-BACKUP-"+new Date().toISOString().slice(0,10)+".zip"
);
}catch(err){
alert("Erro no backup: "+err.message);
}
}

async function exportShare(){
try{
download(await makeZIP(false),"MEUBANCO-COMPARTILHAR.zip");
}catch(err){
alert("Erro ao compartilhar: "+err.message);
}
}

async function restore(data,zip){
if(!Array.isArray(data.questoes)){
throw Error("Backup inválido.");
}

const imgs=[];

if(zip){
for(const im of data.imagens||[]){
const entry=zip.file(im.arquivo);
if(!entry)continue;

imgs.push({
id:im.id,
provaId:im.provaId,
caminho:im.caminho,
blob:await entry.async("blob")
});
}
}

/* O BACKUP PRESERVA O HISTÓRICO EXISTENTE */

await importRecords(
data.provas||[],
data.questoes,
imgs,
data.colecoes||[]
);
}

/* EXCLUSÃO */

async function deleteProof(id){
const value=dec(id);

if(!confirm("Excluir esta prova e suas questões?"))return;

const ids=new Set(
questoes.filter(q=>q.provaId===value).map(q=>q.id)
);

for(const qid of ids)await remove("questoes",qid);

for(const im of imagens.filter(x=>x.provaId===value)){
await remove("imagens",im.id);
}

for(const c of colecoes){
c.ids=c.ids.filter(id=>!ids.has(id));
await put("colecoes",c);
}

await remove("provas",value);
await reload();
}

async function deleteAll(){
if(prompt("Digite APAGAR para excluir todos os dados:")!=="APAGAR"){
return;
}

for(const table of ["provas","questoes","colecoes","imagens"]){
await wipe(table);
}

await reload();
}

/* ARQUIVO SELECIONADO */

$("fileInput").addEventListener("change",async event=>{
const files=[...event.target.files];
event.target.value="";

for(const file of files){
try{
if(/\.zip$/i.test(file.name)){
await importZIP(file);
}else if(/\.json$/i.test(file.name)){
await importJSON(
JSON.parse(await file.text()),
file.name
);
}else{
throw Error("Formato de arquivo incompatível.");
}
}catch(err){
console.error(err);
alert("Não foi possível importar: "+err.message);
}
}
});
