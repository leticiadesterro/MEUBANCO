
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7f9">
<title>MEUBANCO</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{
--bg:#f5f7f9;--white:#fff;--ink:#263445;
--muted:#718093;--line:#e1e7ed;
--primary:#285e78;--soft:#edf4f7;
--green:#22805b;--red:#b74848
}
*{box-sizing:border-box}
body{
margin:0;background:var(--bg);color:var(--ink);
font:14px/1.55 -apple-system,BlinkMacSystemFont,
"Segoe UI",sans-serif
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
header{
background:white;border-bottom:1px solid var(--line);
padding:16px 22px;display:flex;
justify-content:space-between;align-items:center;gap:15px
}
.logo{font-size:21px;font-weight:800;letter-spacing:.4px}
.logo small{
display:block;font-size:11px;color:var(--muted);
font-weight:400
}
nav{display:flex;gap:5px;overflow-x:auto}
nav button{
border:0;background:transparent;color:var(--muted);
padding:10px;border-radius:9px;white-space:nowrap
}
nav button.active{
background:var(--soft);color:var(--primary);font-weight:700
}
main{max-width:1250px;margin:auto;padding:24px 16px 80px}
h1{font-size:26px;margin:0 0 5px}
h2{font-size:18px;margin:0 0 13px}
h3{font-size:15px;margin:0}
p{line-height:1.65}
.sub,.small{font-size:12px;color:var(--muted)}
.sub{margin-bottom:22px}
.card,.metric{
background:white;border:1px solid var(--line);
border-radius:14px;padding:18px;margin-bottom:15px
}
.grid{
display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
gap:12px
}
.two{
display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
gap:15px
}
.metric strong{display:block;font-size:28px;margin-top:5px}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{
background:white;border:1px solid var(--line);
border-radius:9px;padding:10px 14px;
color:var(--ink);font-size:13px;font-weight:650
}
.btn.primary{
background:var(--primary);color:white;
border-color:var(--primary)
}
.btn.danger{color:var(--red)}
.btn.large{font-size:15px;padding:15px 20px}
label{
display:block;color:var(--muted);
font-size:12px;font-weight:650;margin-bottom:6px
}
input:not([type=checkbox]),select,textarea{
width:100%;border:1px solid var(--line);
border-radius:9px;padding:11px;
background:white;color:var(--ink)
}
textarea{min-height:90px;resize:vertical}
.field{margin-bottom:13px}
.filters{
display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
gap:12px
}
.item{padding:15px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.preview{
font-size:13px;color:var(--muted);
display:-webkit-box;-webkit-line-clamp:2;
-webkit-box-orient:vertical;overflow:hidden
}
.tag{
display:inline-block;background:#f0f3f6;
border-radius:20px;padding:5px 9px;
font-size:11px;margin:3px
}
.good{background:#e7f5ed;color:var(--green)}
.bad{background:#ffeded;color:var(--red)}
.warn{background:#fff2d7;color:#92641a}
.check{width:19px;height:19px;accent-color:var(--primary)}
.choices{
display:flex;flex-wrap:wrap;gap:8px;
max-height:210px;overflow:auto;
border:1px solid var(--line);
border-radius:11px;padding:10px
}
.choice{
display:flex;align-items:center;gap:7px;
border:1px solid var(--line);
border-radius:20px;padding:8px 11px;
color:var(--ink);font-weight:500;margin:0;cursor:pointer
}
.choice input{accent-color:var(--primary)}
.notice{
background:var(--soft);border-radius:10px;
padding:13px;color:#45677a;font-size:13px
}
.empty{text-align:center;padding:36px;color:var(--muted)}
.modal-bg{
position:fixed;inset:0;background:#17263791;
z-index:20;display:flex;
justify-content:center;align-items:center;padding:10px
}
.modal{
background:white;border-radius:16px;
width:min(100%,1120px);max-height:96dvh;
overflow:auto;padding:20px
}
.modal-head{
position:sticky;top:-20px;background:white;
z-index:3;border-bottom:1px solid var(--line);
padding:5px 0 12px;margin-bottom:15px
}
.modal-foot{
position:sticky;bottom:-20px;background:white;
z-index:3;border-top:1px solid var(--line);
padding:13px 0 5px;margin-top:16px
}
.question{
font-size:15px;line-height:1.75;white-space:pre-wrap
}
.alternative{
border:1px solid var(--line);border-radius:10px;
padding:12px;margin:8px 0;white-space:pre-wrap
}
.qimage{
display:block;max-width:100%;max-height:440px;
object-fit:contain;margin:12px 0
}
.chartrow{
display:grid;
grid-template-columns:minmax(120px,1.4fr) minmax(70px,2fr) 65px;
gap:10px;align-items:center;margin:13px 0;font-size:12px
}
.bar{
height:11px;background:#edf1f4;
border-radius:15px;overflow:hidden
}
.fill{height:100%;background:#438da5}
.chart-button{
background:transparent;border:0;text-align:left;
padding:4px;color:var(--ink);white-space:normal
}
.chart-button:hover{text-decoration:underline}
.step{
border-left:3px solid #a5cbdc;
padding-left:18px
}
.stepnumber{
color:var(--primary);font-size:11px;
font-weight:800;letter-spacing:.06em
}
.hero{background:#fbfdff;border-color:#c3dbe6}
.segment{display:flex;gap:8px;flex-wrap:wrap}
.segment .active{
background:var(--primary);color:white;
border-color:var(--primary)
}
@media(max-width:850px){
header{display:block;padding:13px}
nav{margin-top:10px}
.grid,.two,.filters{
grid-template-columns:repeat(2,minmax(0,1fr))
}
.modal{padding:14px}
.modal-head{top:-14px}
.modal-foot{bottom:-14px}
}
@media(max-width:550px){
main{padding:16px 11px}
.grid,.two,.filters{grid-template-columns:1fr}
.modal-bg{padding:4px}
.modal{max-height:98dvh}
.chartrow{grid-template-columns:100px 1fr 55px}
}
</style>
</head>
<body>

<header>
<div class="logo">
MEUBANCO
<small>Banco pessoal de questões</small>
</div>
<nav id="nav"></nav>
</header>

<main id="app"></main>
<div id="modalRoot"></div>
<input id="fileInput" type="file" accept=".zip,.json" multiple hidden>

<script>
"use strict";

/* CONFIGURAÇÕES */

const $=id=>document.getElementById(id);
const clean=v=>String(v??"").trim();
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
})[c]);
const enc=v=>encodeURIComponent(String(v));
const dec=v=>decodeURIComponent(v);
const uid=()=>crypto.randomUUID();

const AREAS=[
"Clínica Médica",
"Cirurgia Geral",
"Ginecologia e Obstetrícia",
"Pediatria",
"Medicina Preventiva",
"Outras"
];

const STATES=[
"acertei","errei","nao_fiz","anulada","a_conferir"
];

const TABS=[
["inicio","Início"],
["provas","Provas"],
["questoes","Questões"],
["colecoes","Coleções"],
["desempenho","Desempenho"],
["backup","Importar nova prova / Backup"]
];

let db;
let provas=[];
let questoes=[];
let colecoes=[];
let imagens=[];

let page="inicio";
let current=null;
let navigation=[];
let imageURLs=[];
let selected=new Set();

let filter={
provas:[],
area:"",
tema:"",
subs:[],
status:"",
busca:""
};

let report={
provas:[],
area:"",
tema:"",
subs:[],
detail:"",
view:"macro"
};

function statusName(s){
return ({
acertei:"Acertei",
errei:"Errei",
nao_fiz:"Não fiz",
anulada:"Anulada",
a_conferir:"A conferir"
})[s]||"A conferir";
}

/* BANCO DE DADOS: PRESERVA MEUBANCO_V3 */

function openDB(){
return new Promise((resolve,reject)=>{
const request=indexedDB.open("MEUBANCO_V3",1);

request.onupgradeneeded=()=>{
const database=request.result;

for(const name of [
"provas","questoes","colecoes","imagens"
]){
if(!database.objectStoreNames.contains(name)){
database.createObjectStore(name,{keyPath:"id"});
}
}
};

request.onsuccess=()=>resolve(request.result);
request.onerror=()=>reject(request.error);
});
}

function getAll(table){
return new Promise((resolve,reject)=>{
const request=db.transaction(table)
.objectStore(table).getAll();

request.onsuccess=()=>resolve(request.result);
request.onerror=()=>reject(request.error);
});
}

function put(table,object){
return new Promise((resolve,reject)=>{
const transaction=db.transaction(table,"readwrite");
transaction.objectStore(table).put(object);
transaction.oncomplete=resolve;
transaction.onerror=()=>reject(transaction.error);
});
}

function remove(table,id){
return new Promise((resolve,reject)=>{
const transaction=db.transaction(table,"readwrite");
transaction.objectStore(table).delete(id);
transaction.oncomplete=resolve;
transaction.onerror=()=>reject(transaction.error);
});
}

function wipe(table){
return new Promise((resolve,reject)=>{
const transaction=db.transaction(table,"readwrite");
transaction.objectStore(table).clear();
transaction.oncomplete=resolve;
transaction.onerror=()=>reject(transaction.error);
});
}

async function reload(draw=true){
[provas,questoes,colecoes,imagens]=await Promise.all([
getAll("provas"),
getAll("questoes"),
getAll("colecoes"),
getAll("imagens")
]);

if(draw)render();
}

/* NAVEGAÇÃO */

function go(destination){
page=destination;
selected.clear();
render();
window.scrollTo(0,0);
}

function heading(title,subtitle){
return `<h1>${esc(title)}</h1>
<div class="sub">${esc(subtitle)}</div>`;
}

function proof(q){
return provas.find(p=>p.id===q.provaId);
}

function proofName(p){
if(!p)return "Prova";
const name=String(p.nome||"Prova");
const year=String(p.ano||"");
return name+(year&&!name.includes(year)?" "+year:"");
}

function titleQ(q){
return proofName(proof(q))+" — Q"+q.numero;
}

function stats(list){
const made=list.filter(q=>
q.situacao==="acertei"||q.situacao==="errei"
);
const right=made.filter(q=>q.situacao==="acertei").length;

return {
total:list.length,
made:made.length,
right,
wrong:made.length-right,
nao:list.filter(q=>q.situacao==="nao_fiz").length,
anuladas:list.filter(q=>q.situacao==="anulada").length,
pendentes:list.filter(q=>q.situacao==="a_conferir").length,
rate:made.length?right/made.length*100:null
};
}

function pct(value){
return value===null?"—":
value.toFixed(1).replace(".",",")+"%";
}

function metrics(s){
return `<div class="grid" style="margin-bottom:17px">
<div class="metric">
<span class="small">TOTAL DE QUESTÕES</span>
<strong>${s.total}</strong>
</div>
<div class="metric">
<span class="small">QUESTÕES FEITAS</span>
<strong>${s.made}</strong>
</div>
<div class="metric">
<span class="small">ACERTOS / ERROS</span>
<strong>${s.right} / ${s.wrong}</strong>
</div>
<div class="metric">
<span class="small">ÍNDICE DE ACERTOS</span>
<strong>${pct(s.rate)}</strong>
</div>
</div>`;
}

function options(values,current,base="Todos"){
return `<option value="">${esc(base)}</option>`+
[...new Set(values.filter(Boolean))]
.sort((a,b)=>String(a).localeCompare(String(b),"pt-BR"))
.map(value=>`
<option value="${esc(value)}"
${current===value?"selected":""}>
${esc(value)}
</option>
`).join("");
}

function render(){
$("nav").innerHTML=TABS.map(([id,title])=>
`<button class="${page===id?"active":""}"
onclick="go('${id}')">${title}</button>`
).join("");

const views={
inicio:home,
provas:proofPage,
questoes:questionPage,
colecoes:collectionPage,
desempenho:performancePage,
backup:backupPage
};

$("app").innerHTML=views[page]();
}

/* PÁGINA INICIAL */

function home(){
return heading(
"Minha biblioteca",
"Suas provas e questões organizadas por assunto."
)+metrics(stats(questoes))+`
<div class="two">
<div class="card">
<h2>Minhas provas</h2>
${provas.map(p=>`
<div class="item row between">
<div>
<b>${esc(proofName(p))}</b>
<div class="small">
${questoes.filter(q=>q.provaId===p.id).length} questões
</div>
</div>
<button class="btn"
onclick="openProof('${enc(p.id)}')">Abrir</button>
</div>
`).join("")||'<p class="small">Nenhuma prova importada.</p>'}
</div>

<div class="card">
<h2>Importar nova prova</h2>
<p>Envie ao ChatGPT o PDF de uma prova já resolvida e importe as questões organizadas para o MEUBANCO.</p>
<button class="btn primary large"
onclick="go('backup')">
Importar nova prova →
</button>
</div>
</div>`;
}

/* BIBLIOTECA DE PROVAS */

function proofPage(){
return heading(
"Provas",
"Consulte todas as questões de uma prova."
)+`<div class="card">
${provas.map(p=>{
const list=questoes.filter(q=>q.provaId===p.id);
const s=stats(list);

return `<div class="item row between">
<div>
<h3>${esc(proofName(p))}</h3>
<div class="small">
${s.total} questões ·
${s.made} feitas ·
${pct(s.rate)} de acertos
</div>
</div>
<div class="row">
<button class="btn"
onclick="openProof('${enc(p.id)}')">Abrir</button>
<button class="btn danger"
onclick="deleteProof('${enc(p.id)}')">Excluir</button>
</div>
</div>`;
}).join("")||'<div class="empty">Nenhuma prova cadastrada.</div>'}
</div>`;
}

function openProof(id){
filter={
provas:[dec(id)],
area:"",
tema:"",
subs:[],
status:"",
busca:""
};
go("questoes");
}

/* FILTROS DE QUESTÕES */

function filtered(){
return questoes.filter(q=>{
const content=[
q.enunciado,
q.tema_geral,
q.tema_especifico,
q.descricao_detalhada,
...Object.values(q.alternativas||{})
].join(" ").toLocaleLowerCase("pt-BR");

return (
!filter.provas.length||
filter.provas.includes(q.provaId)
)&&(
!filter.area||q.grande_area===filter.area
)&&(
!filter.tema||q.tema_geral===filter.tema
)&&(
!filter.subs.length||
filter.subs.includes(q.tema_especifico)
)&&(
!filter.status||q.situacao===filter.status
)&&(
!filter.busca||
content.includes(filter.busca.toLocaleLowerCase("pt-BR"))
);
}).sort((a,b)=>
proofName(proof(a)).localeCompare(
proofName(proof(b)),"pt-BR"
)||Number(a.numero)-Number(b.numero)
);
}

function changeFilter(key,value){
filter[key]=value;

if(key==="area"){
filter.tema="";
filter.subs=[];
}
if(key==="tema")filter.subs=[];

render();
}

function toggleFilterProof(id,on){
const value=dec(id);

filter.provas=on?
[...new Set([...filter.provas,value])]:
filter.provas.filter(x=>x!==value);

render();
}

function toggleFilterSub(id,on){
const value=dec(id);

filter.subs=on?
[...new Set([...filter.subs,value])]:
filter.subs.filter(x=>x!==value);

render();
}

function clearFilters(){
filter={
provas:[],area:"",tema:"",
subs:[],status:"",busca:""
};
render();
}

function tag(q){
const c=q.situacao==="acertei"?"good":
q.situacao==="errei"?"bad":"warn";

return `<span class="tag ${c}">
${statusName(q.situacao)}
</span>`;
}

function lineQ(q){
return `<div class="item">
<div class="row between">
<div class="row">
<input class="check" type="checkbox"
${selected.has(q.id)?"checked":""}
onchange="selectQ('${enc(q.id)}',this.checked)">

<div>
<h3>${esc(titleQ(q))}</h3>
<span class="tag">${esc(q.grande_area||"Sem área")}</span>
<span class="tag">${esc(q.tema_geral||"Sem tema")}</span>
<span class="tag">${esc(q.tema_especifico||"Sem subtema")}</span>
${tag(q)}
${q.classificacao_aprovada?"":`
<span class="tag warn">Tema sugerido</span>`}
</div>
</div>

<button class="btn"
onclick="openQ('${enc(q.id)}')">Abrir</button>
</div>

<p class="preview">${esc(q.enunciado)}</p>
${q.descricao_detalhada?`
<div class="small">
Descrição: ${esc(q.descricao_detalhada)}
</div>`:""}
</div>`;
}

function questionPage(){
const list=filtered();

const available=questoes.filter(q=>
!filter.provas.length||
filter.provas.includes(q.provaId)
);

const themes=available.filter(q=>
!filter.area||q.grande_area===filter.area
).map(q=>q.tema_geral);

const subs=[...new Set(available.filter(q=>
(!filter.area||q.grande_area===filter.area)&&
(!filter.tema||q.tema_geral===filter.tema)
).map(q=>q.tema_especifico).filter(Boolean))]
.sort((a,b)=>a.localeCompare(b,"pt-BR"));

return heading(
"Banco de questões",
"Selecione provas, áreas e vários subtemas."
)+`
<div class="card">

<div class="field">
<label>Selecionar provas — sem marcação = todas</label>
<div class="choices">
${provas.map(p=>`
<label class="choice">
<input type="checkbox"
${filter.provas.includes(p.id)?"checked":""}
onchange="toggleFilterProof('${enc(p.id)}',this.checked)">
${esc(proofName(p))}
</label>
`).join("")||'<span class="small">Nenhuma prova disponível.</span>'}
</div>
</div>

<div class="filters">
<div>
<label>Grande área</label>
<select onchange="changeFilter('area',this.value)">
${options([...AREAS,...questoes.map(q=>q.grande_area)],filter.area)}
</select>
</div>

<div>
<label>Tema geral</label>
<select onchange="changeFilter('tema',this.value)">
${options(themes,filter.tema)}
</select>
</div>

<div>
<label>Desempenho</label>
<select onchange="changeFilter('status',this.value)">
<option value="">Todos</option>
${STATES.map(s=>`
<option value="${s}"
${filter.status===s?"selected":""}>
${statusName(s)}
</option>`).join("")}
</select>
</div>

<div>
<label>Pesquisar conteúdo</label>
<input value="${esc(filter.busca)}"
placeholder="Palavra-chave"
onchange="changeFilter('busca',this.value)">
</div>
</div>

<div class="field">
<label>Subtemas — marque quantos quiser</label>
<div class="choices">
${subs.map(s=>`
<label class="choice">
<input type="checkbox"
${filter.subs.includes(s)?"checked":""}
onchange="toggleFilterSub('${enc(s)}',this.checked)">
${esc(s)}
</label>
`).join("")||'<span class="small">Sem subtemas.</span>'}
</div>
</div>

<div class="row between">
<span class="small">${list.length} questões encontradas</span>
<div class="row">
<button class="btn" onclick="clearFilters()">
Limpar filtros
</button>
<button class="btn" onclick="selectResults()">
Selecionar resultados
</button>
</div>
</div>
</div>

<div class="card">
<div class="row between">
<b>${selected.size} selecionadas</b>

<div class="row">
<button class="btn" ${selected.size?"":"disabled"}
onclick="batchModal()">Classificar em lote</button>

<button class="btn" ${selected.size?"":"disabled"}
onclick="makeCollection()">Criar coleção</button>

<button class="btn primary" ${selected.size?"":"disabled"}
onclick="copyStudy([...selected])">
Copiar para ChatGPT
</button>
</div>
</div>

${list.map(lineQ).join("")||
'<div class="empty">Nenhuma questão encontrada.</div>'}
</div>`;
}

function selectQ(id,on){
const value=dec(id);
on?selected.add(value):selected.delete(value);
render();
}

function selectResults(){
filtered().forEach(q=>selected.add(q.id));
render();
}

/* ABRIR QUESTÃO */

function releaseImages(){
imageURLs.forEach(URL.revokeObjectURL);
imageURLs=[];
}

function imgURL(blob){
const url=URL.createObjectURL(blob);
imageURLs.push(url);
return url;
}

function modal(html){
$("modalRoot").innerHTML=`
<div class="modal-bg"
onclick="if(event.target===this)closeModal()">
<div class="modal">${html}</div>
</div>`;
}

function closeModal(){
releaseImages();
$("modalRoot").innerHTML="";
current=null;
}

function openQ(id,keep=false){
const q=questoes.find(x=>x.id===dec(id));
if(!q)return;

if(!keep)navigation=filtered().map(q=>q.id);
if(!navigation.includes(q.id))navigation=[q.id];

current=q.id;
const position=navigation.indexOf(q.id);

releaseImages();

const alternatives=Object.entries(q.alternativas||{})
.map(([a,value])=>`
<div class="alternative">
<b>${esc(a)})</b> ${esc(value)}
</div>`).join("");

const pictures=(q.imagens||[]).map(id=>{
const image=imagens.find(x=>x.id===id);
return image?`
<img class="qimage"
alt="Figura da questão"
src="${imgURL(image.blob)}">`:"";
}).join("");

const themes=[...new Set(
questoes.map(x=>x.tema_geral).filter(Boolean)
)];

const subs=[...new Set(
questoes.map(x=>x.tema_especifico).filter(Boolean)
)];

modal(`
<div class="modal-head row between">
<div>
<h2 style="margin:0">${esc(titleQ(q))}</h2>
<span class="small">

async function saveQ(direction=0){
const q=questoes.find(x=>x.id===current);
if(!q)return;

const position=navigation.indexOf(q.id);

const updated={
...q,
grande_area:$("edArea").value,
tema_geral:clean($("edTheme").value),
tema_especifico:clean($("edSub").value),
descricao_detalhada:clean($("edDetail").value),
situacao:$("edStatus").value,
minha_resposta:clean($("edAnswer").value),
gabarito:clean($("edKey").value),
comentario:$("edNotes").value,
classificacao_aprovada:true
};

await put("questoes",updated);
await reload(false);
render();

const next=navigation[position+direction]||q.id;
openQ(enc(next),true);
}

async function applyBatch(){
const a=$("bArea").value;
const t=clean($("bTheme").value);
const s=clean($("bSub").value);
const d=clean($("bDetail").value);
const st=$("bStatus").value;

for(const q of questoes.filter(q=>selected.has(q.id))){
if(a)q.grande_area=a;
if(t)q.tema_geral=t;
if(s)q.tema_especifico=s;
if(d)q.descricao_detalhada=d;
if(st)q.situacao=st;
q.classificacao_aprovada=true;

await put("questoes",q);
}

selected.clear();
closeModal();
await reload();
}

/* RELATÓRIO MACRO E MICRO */

function reportList(){
return questoes.filter(q=>(
!report.provas.length||
report.provas.includes(q.provaId)
)&&(
!report.area||
q.grande_area===report.area
)&&(
!report.tema||
q.tema_geral===report.tema
)&&(
!report.subs.length||
report.subs.includes(q.tema_especifico)
)&&(
!report.detail||
q.descricao_detalhada===report.detail
));
}

function changeReport(key,value){
report[key]=value;

if(key==="area"){
report.tema="";
report.subs=[];
report.detail="";
}

if(key==="tema"){
report.subs=[];
report.detail="";
}

render();
}

function toggleReportProof(id,on){
const value=dec(id);

report.provas=on?
[...new Set([...report.provas,value])]:
report.provas.filter(x=>x!==value);

render();
}

function toggleReportSub(id,on){
const value=dec(id);

report.subs=on?
[...new Set([...report.subs,value])]:
report.subs.filter(x=>x!==value);

report.detail="";
render();
}

function clearReport(){
report={
provas:[],area:"",tema:"",
subs:[],detail:"",view:"macro"
};
render();
}

function groupStats(list,field){
const groups=new Map();

for(const q of list){
const key=q[field]||"Sem classificação";

if(!groups.has(key))groups.set(key,[]);
groups.get(key).push(q);
}

return [...groups].map(([name,items])=>({
name,...stats(items)
})).sort((a,b)=>
b.made-a.made||
a.name.localeCompare(b.name,"pt-BR")
);
}

function chart(rows,field){
return rows.map(r=>`
<div class="chartrow">
<div>
<button class="chart-button"
onclick="openReportGroup('${field}','${enc(r.name)}')">
<b>${esc(r.name)}</b>
<div class="small">
${r.made} feitas · ${r.wrong} erros
</div>
</button>
</div>

<div class="bar">
<div class="fill" style="width:${r.rate||0}%"></div>
</div>

<b>${pct(r.rate)}</b>
</div>
`).join("")||
'<div class="empty">Nenhum dado disponível.</div>';
}

function download(blob,name){
const url=URL.createObjectURL(blob);
const a=document.createElement("a");

a.href=url;
a.download=name;
document.body.appendChild(a);
a.click();
a.remove();

setTimeout(()=>URL.revokeObjectURL(url),60000);
}

function exportCSV(){
const list=reportList();

const rows=[[
"Nível","Assunto","Total","Feitas",
"Acertos","Erros","Índice"
]];

for(const [field,label] of [
["grande_area","Grande área"],
["tema_geral","Tema geral"],
["tema_especifico","Subtema"],
["descricao_detalhada","Descrição detalhada"]
]){
for(const g of groupStats(list,field)){
rows.push([
label,g.name,g.total,g.made,
g.right,g.wrong,pct(g.rate)
]);
}
}

const csv="\ufeff"+rows.map(row=>
row.map(value=>
'"'+String(value).replace(/"/g,'""')+'"'
).join(";")
).join("\n");

download(
new Blob([csv],{type:"text/csv;charset=utf-8"}),
"MEUBANCO-RELATORIO.csv"
);
}

/* IMPORTAR NOVA PROVA */

function zipPrompt(){
return `Quero importar uma prova de residência médica em PDF para o aplicativo MEUBANCO.

INICIE SUA RESPOSTA PEDINDO:
"Envie aqui o PDF da prova que você deseja adicionar ao MEUBANCO.

Se você já resolveu a prova, envie preferencialmente o PDF com as suas respostas marcadas. Se o gabarito oficial estiver em outro arquivo, envie-o também.

Depois que receber o PDF, identificarei a prova e confirmarei o nome antes de preparar o ZIP."

AGUARDE O ENVIO DO PDF.

APÓS RECEBER:
1. Identifique a instituição e o ano.
2. Pergunte: "Identifiquei a prova [NOME] de [ANO]. Posso nomeá-la como [NOME ANO] ou prefere outro nome?"
3. Aguarde a escolha.
4. Use exatamente o nome escolhido em prova.nome.
5. Não repita o ano automaticamente.

PREPARE UM ZIP contendo manifest.json na raiz e a pasta imagens/.

O manifest.json deve seguir este formato:

{
 "versao":3,
 "prova":{
  "id":"identificador-estavel",
  "nome":"Nome escolhido",
  "ano":2026
 },
 "questoes":[{
  "id":"identificador-estavel-q1",
  "numero":1,
  "enunciado":"Texto integral",
  "alternativas":{
   "A":"Texto A",
   "B":"Texto B",
   "C":"Texto C",
   "D":"Texto D"
  },
  "grande_area":"Clínica Médica",
  "tema_geral":"Hematologia",
  "tema_especifico":"Anemias hemolíticas",
  "descricao_detalhada":"Esferocitose hereditária",
  "classificacao_aprovada":false,
  "situacao":"a_conferir",
  "minha_resposta":"",
  "gabarito":"",
  "comentario":"",
  "imagens":[]
 }]
}

REGRAS:
- Transcreva integralmente enunciados e alternativas.
- Preserve imagens, tabelas, gráficos e eletrocardiogramas.
- Use cinco grandes áreas padronizadas.
- Sugira tema geral e subtema amplo.
- Deixe os detalhes no campo descricao_detalhada.
- Não use microcategorias nem abreviações.
- A classificação é apenas sugerida.
- Deixe classificacao_aprovada como false.
- Deixe comentario vazio.
- Se houver minhas respostas e gabarito confiável, identifique acertei ou errei.
- Use anulada para questões anuladas.
- Use nao_fiz apenas se houver evidência de não resposta.
- Use a_conferir quando não puder confirmar.
- Não invente respostas, gabaritos ou texto ilegível.
- Use identificadores estáveis.
- Confira todas as imagens e a quantidade de questões.
- Entregue o ZIP pronto para importar.`;
}

/* IMPORTAÇÃO DOS ARQUIVOS */

function normalizeProof(p){
const name=clean(p.nome||p.prova||"Prova");
const year=p.ano||"";

const id=clean(p.id)||"prova-"+
name.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^a-z0-9]+/g,"-")+"-"+year;

return {id,nome:name,ano:year};
}

function broadSub(value){
const original=clean(value);

const s=original.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.toLowerCase();

if(s.includes("trauma esplenico"))
return "Trauma esplênico";

if(s.includes("anemia")&&s.includes("hemolit"))
return "Anemias hemolíticas";

if(s.includes("anemia"))
return "Anemias";

if(/\bdiabetes\b|\bdm\b/.test(s))
return "Diabetes mellitus";

if(/\bhas\b|hipertensao arterial/.test(s))
return "Hipertensão arterial";

if(/anatomia pelvica|vascularizacao pelvica|pelvimetria|nervo pudendo/.test(s))
return "Anatomia pélvica";

return original;
}

function normalizeQ(q,p){
const raw=clean(q.tema_especifico||q.subtema);
const broad=broadSub(raw);

let status=clean(q.situacao).toLowerCase();
if(!STATES.includes(status))status="a_conferir";

return {
id:clean(q.id)||p.id+"-q"+(q.numero||q.questao),
provaId:p.id,
numero:q.numero||q.questao||0,
enunciado:String(q.enunciado||q.texto||""),
alternativas:q.alternativas||{},
grande_area:clean(q.grande_area||q.area),
tema_geral:clean(q.tema_geral||q.tema),
tema_especifico:broad,
descricao_detalhada:clean(
q.descricao_detalhada||
q.detalhamento||
(raw!==broad?raw:"")
),
classificacao_aprovada:!!q.classificacao_aprovada,
situacao:status,
gabarito:clean(q.gabarito),
minha_resposta:clean(q.minha_resposta),
comentario:"",
imagens:Array.isArray(q.imagens)?q.imagens:[]
};
}

async function importRecords(ps,qs,imgs){
const existing=new Set(questoes.map(q=>q.id));

const duplicates=qs.filter(q=>existing.has(q.id));

let overwrite=false;

if(duplicates.length){
overwrite=confirm(
duplicates.length+" questões já existem.\n"+
"OK = substituir os registros existentes, inclusive suas classificações.\n"+
"Cancelar = preservar as existentes e importar somente as novas."
);
}

const admitted=qs.filter(q=>
overwrite||!existing.has(q.id)
);

const imageIds=new Set(
admitted.flatMap(q=>q.imagens||[])
);

for(const p of ps){
if(overwrite||!provas.some(x=>x.id===p.id)){
await put("provas",p);
}
}

for(const image of imgs){
if(imageIds.has(image.id)){
await put("imagens",image);
}
}

for(const q of admitted){
await put("questoes",q);
}

await reload();

alert(admitted.length+" questões importadas ou atualizadas.");
}

async function importJSON(data,name){
if(data.tipo==="MEUBANCO_BACKUP_V3"||
(Array.isArray(data.provas)&&Array.isArray(data.questoes))){
await restore(data);
return;
}

const list=data.questoes||data.questions;
if(!Array.isArray(list)){
throw Error("JSON sem questões.");
}

const p=normalizeProof(data.prova||{
nome:data.nome||name.replace(/\.json$/i,""),
ano:data.ano||""
});

await importRecords(
[p],
list.map(q=>normalizeQ(q,p)),
[]
);
}

async function importZIP(file){
if(typeof JSZip==="undefined"){
throw Error("Biblioteca ZIP indisponível.");
}

const zip=await JSZip.loadAsync(file);

const entry=zip.file("manifest.json")||
zip.file("backup.json");

if(!entry){
throw Error("ZIP sem manifest.json ou backup.json.");
}

const data=JSON.parse(await entry.async("string"));

if(data.tipo==="MEUBANCO_BACKUP_V3"){
await restore(data,zip);
return;
}

if(!Array.isArray(data.questoes)){
throw Error("Manifesto sem questões.");
}

const p=normalizeProof(
data.prova||{nome:file.name,ano:""}
);

const list=data.questoes.map(q=>normalizeQ(q,p));
const imgs=[];

for(const q of list){
const ids=[];

for(const path of q.imagens){
if(typeof path!=="string"||
path.startsWith("/")||
path.includes("..")){
continue;
}

const f=zip.file(path);
if(!f)continue;

const id=p.id+"::"+path;

imgs.push({
id,
provaId:p.id,
caminho:path,
blob:await f.async("blob")
});

ids.push(id);
}

q.imagens=ids;
}

await importRecords([p],list,imgs);
}

/* EXPORTAÇÃO E BACKUP */

async function buildZIP(personal=true){
if(typeof JSZip==="undefined"){
throw Error("Biblioteca ZIP indisponível.");
}

const zip=new JSZip();
const imageMetadata=[];

for(const image of imagens){
let extension=(image.caminho||"imagem.png")
.split(".").pop().toLowerCase();

if(!/^(jpg|jpeg|png|gif|webp|svg)$/.test(extension)){
extension="png";
}

const path="imagens/"+
image.id.replace(/[^\w-]/g,"_")+
"."+extension;

zip.file(path,image.blob);

imageMetadata.push({
id:image.id,
provaId:image.provaId,
caminho:image.caminho,
arquivo:path
});
}

const exportedQuestions=personal?questoes:
questoes.map(q=>({
...q,
minha_resposta:"",
situacao:"a_conferir",
comentario:"",
classificacao_aprovada:false
}));

zip.file("backup.json",JSON.stringify({
tipo:"MEUBANCO_BACKUP_V3",
versao:3,
provas,
questoes:exportedQuestions,
colecoes:personal?colecoes:[],
imagens:imageMetadata,
criado:new Date().toISOString()
},null,2));

return zip.generateAsync({
type:"blob",
compression:"DEFLATE"
});
}

async function exportBackup(){
try{
download(
await buildZIP(true),
"MEUBANCO-BACKUP-"+
new Date().toISOString().slice(0,10)+
".zip"
);
}catch(err){
alert("Erro ao exportar: "+err.message);
}
}

async function exportShare(){
try{
download(
await buildZIP(false),
"MEUBANCO-COMPARTILHAR.zip"
);
}catch(err){
alert("Erro ao compartilhar: "+err.message);
}
}

async function restore(data,zip){
if(!Array.isArray(data.questoes)){
throw Error("Backup inválido.");
}

const imgs=[];

if(zip){
for(const image of data.imagens||[]){
const f=zip.file(image.arquivo);

if(f){
imgs.push({
id:image.id,
provaId:image.provaId,
caminho:image.caminho,
blob:await f.async("blob")
});
}
}
}

await importRecords(
data.provas||[],
data.questoes,
imgs
);

for(const collection of data.colecoes||[]){
await put("colecoes",collection);
}

await reload();
}

async function deleteProof(id){
const value=dec(id);

if(!confirm(
"Excluir esta prova e todas as suas questões?"
)){
return;
}

const deleted=new Set(
questoes.filter(q=>q.provaId===value)
.map(q=>q.id)
);

for(const qid of deleted){
await remove("questoes",qid);
}

for(const image of imagens.filter(
x=>x.provaId===value
)){
await remove("imagens",image.id);
}

for(const collection of colecoes){
collection.ids=collection.ids.filter(
id=>!deleted.has(id)
);
await put("colecoes",collection);
}

await remove("provas",value);
await reload();
}

async function deleteAll(){
if(prompt(
"Digite APAGAR para excluir todos os dados:"
)!=="APAGAR"){
return;
}

for(const table of [
"provas","questoes","colecoes","imagens"
]){
await wipe(table);
}

await reload();
}

/* SELEÇÃO DE ARQUIVOS */

$("fileInput").addEventListener("change",async event=>{
const files=[...event.target.files];
event.target.value="";

for(const file of files){
try{
if(/\.zip$/i.test(file.name)){
await importZIP(file);
}else if(/\.json$/i.test(file.name)){
await importJSON(
JSON.parse(await file.text()),
file.name
);
}else{
throw Error("Formato incompatível.");
}
}catch(err){
console.error(err);
alert("Erro ao importar: "+err.message);
}
}
});
